<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | سوق المشاريع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(145deg, #0F3D2E, #1A5F44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 48px;
            max-width: 480px;
            width: 100%;
            padding: 40px 35px;
            text-align: center;
        }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E2E8F0;
            border-radius: 60px;
            font-size: 15px;
        }
        button {
            background: #0F3D2E;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .message-box { margin-top: 20px; padding: 10px; border-radius: 30px; display: none; font-size:13px; }
        .message-box.success { background: #dcfce7; color: #166534; display: block; }
        .message-box.error { background: #fee2e2; color: #dc2626; display: block; }
        .back-link { margin-top: 25px; }
        .back-link a { color: #D4AF37; text-decoration: none; }
    </style>
</head>
<body>
<div class="reset-card">
    <i class="fas fa-lock-open" style="font-size: 60px; color: #D4AF37; margin-bottom: 15px;"></i>
    <h2 id="title">تعيين كلمة مرور جديدة</h2>
    <p id="subtitle">أدخل كلمة المرور الجديدة لحساب مشروعك</p>
    <div class="input-group"><input type="password" id="newPassword" placeholder="كلمة المرور الجديدة"></div>
    <div class="input-group"><input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور"></div>
    <button id="resetBtn">تحديث كلمة المرور <i class="fas fa-save"></i></button>
    <div id="resetMessage" class="message-box"></div>
    <div class="back-link"><a href="project-login.html" id="backLink">← العودة إلى تسجيل الدخول</a></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from './config.js';
    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    const resetBtn = document.getElementById('resetBtn');
    const newPass = document.getElementById('newPassword');
    const confirmPass = document.getElementById('confirmPassword');
    const messageDiv = document.getElementById('resetMessage');

    resetBtn.addEventListener('click', async () => {
        const password = newPass.value.trim();
        const confirm = confirmPass.value.trim();
        if (!password) {
            messageDiv.innerText = 'الرجاء إدخال كلمة المرور';
            messageDiv.className = 'message-box error';
            return;
        }
        if (password.length < 6) {
            messageDiv.innerText = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            messageDiv.className = 'message-box error';
            return;
        }
        if (password !== confirm) {
            messageDiv.innerText = 'كلمتا المرور غير متطابقتين';
            messageDiv.className = 'message-box error';
            return;
        }

        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التحديث...';
        const { error } = await supabase.auth.updateUser({ password });
        resetBtn.disabled = false;
        resetBtn.innerHTML = 'تحديث كلمة المرور <i class="fas fa-save"></i>';

        if (error) {
            messageDiv.innerText = 'حدث خطأ: ' + error.message;
            messageDiv.className = 'message-box error';
        } else {
            messageDiv.innerText = '✅ تم تغيير كلمة المرور بنجاح. جارٍ تحويلك...';
            messageDiv.className = 'message-box success';
            setTimeout(() => window.location.href = 'project-login.html', 2000);
        }
    });
</script>
</body>
</html>
