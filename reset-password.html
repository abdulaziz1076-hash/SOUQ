<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | سوق المشاريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0F3D2E, #1A5F44);
            font-family: 'Almarai', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 32px;
            padding: 35px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }
        .reset-card i { font-size: 60px; color: #D4AF37; margin-bottom: 15px; }
        h2 { color: #0F3D2E; margin-bottom: 8px; }
        p { color: #5a6e7c; margin-bottom: 25px; font-size: 14px; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 40px; margin-bottom: 20px; font-family: inherit; font-size: 14px; }
        button { width: 100%; background: #0F3D2E; color: white; border: none; padding: 14px; border-radius: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1A5F44; transform: translateY(-2px); }
        .message { margin-top: 15px; padding: 10px; border-radius: 20px; font-size: 13px; display: none; }
        .error { background: #fee2e2; color: #dc2626; }
        .success { background: #dcfce7; color: #16a34a; }
    </style>
</head>
<body>
    <div class="reset-card">
        <i class="fas fa-key"></i>
        <h2>إعادة تعيين كلمة المرور</h2>
        <p id="instruction">أدخل كلمة المرور الجديدة</p>
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
        <button id="resetBtn">تحديث كلمة المرور</button>
        <div id="msg" class="message"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabaseUrl = 'https://xyepcwptfihnztgghimx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5ZXBjd3B0Zmlobnp0Z2doaW14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODA2OTcsImV4cCI6MjA5MjA1NjY5N30.SZvZjWpih1JiUlv24xLhNwjTvzo9RNsrTiI9fchWldE';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const resetBtn = document.getElementById('resetBtn');
        const msgDiv = document.getElementById('msg');
        const newPass = document.getElementById('newPassword');
        const confirmPass = document.getElementById('confirmPassword');

        resetBtn.addEventListener('click', async () => {
            const password = newPass.value.trim();
            const confirm = confirmPass.value.trim();
            if (!password) {
                showMsg('يرجى إدخال كلمة المرور', 'error');
                return;
            }
            if (password !== confirm) {
                showMsg('كلمتا المرور غير متطابقتين', 'error');
                return;
            }
            const { error } = await supabase.auth.updateUser({ password });
            if (error) {
                showMsg(error.message, 'error');
            } else {
                showMsg('تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 2000);
            }
        });

        function showMsg(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => msgDiv.style.display = 'none', 5000);
        }
    </script>
</body>
</html>
