<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>إعادة تعيين كلمة المرور | سوق المشاريع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* نفس تصميم project-login.html */
        body {
            background: linear-gradient(145deg, #0F3D2E, #1A5F44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Almarai', sans-serif;
        }
        .reset-card {
            background: white;
            border-radius: 48px;
            max-width: 480px;
            width: 100%;
            padding: 40px 35px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            text-align: center;
        }
        .reset-card h2 {
            color: #0F3D2E;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .reset-card p {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E2E8F0;
            border-radius: 60px;
            font-size: 15px;
            background: white;
            transition: 0.2s;
            font-family: inherit;
        }
        .input-group input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 2px rgba(212,175,55,0.2);
        }
        button {
            background: #0F3D2E;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            background: #1A5F44;
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }
        .back-link {
            margin-top: 25px;
            border-top: 1px solid #E2E8F0;
            padding-top: 20px;
        }
        .back-link a {
            color: #D4AF37;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover {
            color: #0F3D2E;
        }
        .message-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .message-box.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .message-box.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
        .strength-badge {
            font-size: 11px;
            margin-top: -12px;
            margin-bottom: 15px;
            text-align: right;
            color: #64748b;
        }
        .strength-badge span {
            background: #f1f5f9;
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="reset-card">
    <i class="fas fa-lock-open" style="font-size: 60px; color: #D4AF37; margin-bottom: 15px;"></i>
    <h2 id="title">تعيين كلمة مرور جديدة</h2>
    <p id="subtitle">أدخل كلمة المرور الجديدة لحساب مشروعك</p>

    <div class="input-group">
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" autocomplete="new-password">
    </div>
    <div class="strength-badge" id="strengthMsg">
        <span><i class="fas fa-shield-alt"></i> <span id="strengthText">يجب أن تحتوي على 8 أحرف على الأقل</span></span>
    </div>
    <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" autocomplete="off">
    </div>

    <button id="resetBtn">
        <i class="fas fa-save"></i> <span id="updateBtnText">تحديث كلمة المرور</span>
    </button>

    <div id="resetMessage" class="message-box"></div>

    <div class="back-link">
        <a href="project-login.html" id="backLink">
            <i class="fas fa-arrow-right"></i> <span>العودة إلى تسجيل الدخول</span>
        </a>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from './config.js';
    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    // ترجمة بسيطة (يمكن استيراد i18n.js لاحقاً)
    const translations = {
        ar: {
            title: "تعيين كلمة مرور جديدة",
            subtitle: "أدخل كلمة المرور الجديدة لحساب مشروعك",
            newPassPlaceholder: "كلمة المرور الجديدة",
            confirmPlaceholder: "تأكيد كلمة المرور",
            updateBtn: "تحديث كلمة المرور",
            backText: "العودة إلى تسجيل الدخول",
            strengthWeak: "ضعيفة - احتياج 8 أحرف",
            strengthStrong: "كلمة مرور قوية",
            strengthDefault: "يجب أن تحتوي على 8 أحرف على الأقل",
            errorMatch: "كلمتا المرور غير متطابقتين",
            errorMinLength: "كلمة المرور يجب أن تكون 8 أحرف على الأقل",
            errorRequired: "الرجاء إدخال كلمة المرور",
            successMsg: "✅ تم تغيير كلمة المرور بنجاح. جارٍ تحويلك...",
            sendingMsg: "جاري التحديث..."
        },
        en: {
            title: "Set New Password",
            subtitle: "Enter your new password for your project account",
            newPassPlaceholder: "New Password",
            confirmPlaceholder: "Confirm Password",
            updateBtn: "Update Password",
            backText: "Back to Login",
            strengthWeak: "Weak - need 8 characters",
            strengthStrong: "Strong password",
            strengthDefault: "At least 8 characters required",
            errorMatch: "Passwords do not match",
            errorMinLength: "Password must be at least 8 characters",
            errorRequired: "Please enter a password",
            successMsg: "✅ Password changed successfully. Redirecting...",
            sendingMsg: "Updating..."
        }
    };

    let currentLang = localStorage.getItem('projectSouqLang') === 'en' ? 'en' : 'ar';

    function t(key) {
        return translations[currentLang][key] || key;
    }

    function updateUI() {
        document.getElementById('title').innerText = t('title');
        document.getElementById('subtitle').innerText = t('subtitle');
        document.getElementById('newPassword').placeholder = t('newPassPlaceholder');
        document.getElementById('confirmPassword').placeholder = t('confirmPlaceholder');
        document.getElementById('updateBtnText').innerText = t('updateBtn');
        document.getElementById('backLink').innerHTML = `<i class="fas fa-arrow-right"></i> <span>${t('backText')}</span>`;
        // تحديث اتجاه الصفحة
        if (currentLang === 'en') {
            document.documentElement.setAttribute('dir', 'ltr');
            document.body.classList.add('en-mode');
        } else {
            document.documentElement.setAttribute('dir', 'rtl');
            document.body.classList.remove('en-mode');
        }
    }

    const newPass = document.getElementById('newPassword');
    const confirmPass = document.getElementById('confirmPassword');
    const resetBtn = document.getElementById('resetBtn');
    const messageDiv = document.getElementById('resetMessage');
    const strengthSpan = document.getElementById('strengthText');

    newPass.addEventListener('input', () => {
        const val = newPass.value;
        if (val.length >= 8) {
            strengthSpan.innerText = t('strengthStrong');
            strengthSpan.style.color = '#166534';
            strengthSpan.closest('span').style.background = '#dcfce7';
        } else if (val.length > 0) {
            strengthSpan.innerText = t('strengthWeak');
            strengthSpan.style.color = '#92400E';
            strengthSpan.closest('span').style.background = '#fef3c7';
        } else {
            strengthSpan.innerText = t('strengthDefault');
            strengthSpan.style.color = '#64748b';
            strengthSpan.closest('span').style.background = '#f1f5f9';
        }
    });

    resetBtn.addEventListener('click', async () => {
        const password = newPass.value.trim();
        const confirm = confirmPass.value.trim();

        messageDiv.style.display = 'none';
        messageDiv.className = 'message-box';

        if (!password) {
            showMessage(t('errorRequired'), 'error');
            return;
        }
        if (password.length < 8) {
            showMessage(t('errorMinLength'), 'error');
            return;
        }
        if (password !== confirm) {
            showMessage(t('errorMatch'), 'error');
            return;
        }

        resetBtn.disabled = true;
        resetBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> ${t('sendingMsg')}`;

        const { error } = await supabase.auth.updateUser({ password });

        resetBtn.disabled = false;
        resetBtn.innerHTML = `<i class="fas fa-save"></i> ${t('updateBtn')}`;

        if (error) {
            showMessage(error.message, 'error');
        } else {
            showMessage(t('successMsg'), 'success');
            setTimeout(() => {
                window.location.href = 'project-login.html';
            }, 2000);
        }
    });

    function showMessage(msg, type) {
        messageDiv.innerHTML = msg;
        messageDiv.classList.add(type);
        messageDiv.style.display = 'block';
        setTimeout(() => {
            messageDiv.style.display = 'none';
            messageDiv.classList.remove(type);
        }, 5000);
    }

    confirmPass.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') resetBtn.click();
    });

    // استعادة اللغة
    const savedLang = localStorage.getItem('projectSouqLang');
    if (savedLang === 'en') currentLang = 'en';
    else currentLang = 'ar';
    updateUI();

    // ربط زر تبديل اللغة إذا كان موجوداً في الهيدر (اختياري)
    const langToggle = document.getElementById('langToggleBtn');
    if (langToggle) {
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('projectSouqLang', currentLang);
            updateUI();
        });
    }
</script>
</body>
</html>
