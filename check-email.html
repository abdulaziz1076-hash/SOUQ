<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من بريدك الإلكتروني | سوق المشاريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0F3D2E, #1A5F44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Almarai', Arial, sans-serif;
        }
        .card {
            background: white;
            border-radius: 48px;
            max-width: 550px;
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }
        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-wrapper i {
            font-size: 50px;
            color: #166534;
        }
        h1 { color: #0F3D2E; font-size: 28px; margin-bottom: 10px; }
        p { color: #64748b; line-height: 1.8; font-size: 15px; margin-bottom: 15px; }
        .email-highlight {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            color: #0F3D2E;
            margin: 15px 0;
            border: 1px solid #e2e8f0;
        }
        .btn {
            display: inline-block;
            background: #D4AF37;
            color: #0F3D2E;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 15px;
            transition: 0.2s;
            border: 1px solid #0F3D2E;
        }
        .btn:hover {
            background: #0F3D2E;
            color: white;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #D4AF37;
            color: #0F3D2E;
            margin-left: 10px;
        }
        .btn-outline:hover {
            background: #D4AF37;
            color: #0F3D2E;
        }
        .steps {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #64748b;
        }
        .step-item .num {
            width: 32px;
            height: 32px;
            background: #D4AF37;
            color: #0F3D2E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        .step-item.active .num { background: #0F3D2E; color: white; }
        .step-item.active { color: #0F3D2E; font-weight: 700; }
        .resend-link {
            color: #D4AF37;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }
        .resend-link:hover { color: #0F3D2E; }
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            .steps { flex-direction: column; gap: 10px; }
            .btn { display: block; margin: 10px 0; }
            .btn-outline { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrapper">
        <i class="fas fa-envelope-open-text"></i>
    </div>

    <h1>📧 تحقق من بريدك الإلكتروني</h1>
    <p>لقد أرسلنا رابط تأكيد إلى بريدك الإلكتروني. يرجى النقر على الرابط لتفعيل حسابك وإنشاء مشروعك.</p>

    <div class="email-highlight" id="emailDisplay">example@email.com</div>

    <div class="steps">
        <div class="step-item active">
            <span class="num">1</span>
            <span>تسجيل</span>
        </div>
        <div class="step-item">
            <span class="num">2</span>
            <span>تأكيد البريد</span>
        </div>
        <div class="step-item">
            <span class="num">3</span>
            <span>إطلاق المشروع 🚀</span>
        </div>
    </div>

    <p style="font-size: 13px; color: #94a3b8;">
        <i class="fas fa-clock"></i> سينتهي صلاحية رابط التأكيد بعد 24 ساعة.
    </p>

    <div style="margin-top: 20px;">
        <a href="index.html" class="btn">العودة للرئيسية</a>
        <a href="project-login.html" class="btn btn-outline">تسجيل الدخول</a>
    </div>

    <p style="margin-top: 25px; font-size: 13px; color: #94a3b8;">
        لم تصلك الرسالة؟ <span id="resendLink" class="resend-link">أعد إرسال رابط التأكيد</span>
    </p>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://xyepcwptfihnztgghimx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5ZXBjd3B0Zmlobnp0Z2doaW14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODA2OTcsImV4cCI6MjA5MjA1NjY5N30.SZvZjWpih1JiUlv24xLhNwjTvzo9RNsrTiI9fchWldE';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // عرض البريد الإلكتروني المحفوظ
    const email = localStorage.getItem('pendingEmail') || 'بريدك الإلكتروني';
    document.getElementById('emailDisplay').innerText = email;

    // إعادة إرسال رابط التأكيد
    document.getElementById('resendLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const link = e.target;
        link.innerText = 'جاري الإرسال...';
        link.style.color = '#64748b';
        link.style.cursor = 'default';

        try {
            const { error } = await supabase.auth.resend({
                type: 'signup',
                email: email,
                options: {
                    emailRedirectTo: window.location.origin + '/auth/callback.html'
                }
            });

            if (error) throw error;
            alert('✅ تم إعادة إرسال رابط التأكيد إلى بريدك الإلكتروني.');
        } catch (err) {
            alert('❌ حدث خطأ: ' + err.message);
        } finally {
            link.innerText = 'أعد إرسال رابط التأكيد';
            link.style.color = '#D4AF37';
            link.style.cursor = 'pointer';
        }
    });
</script>
</body>
</html>
