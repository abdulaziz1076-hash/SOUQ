<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحقق من بريدك | سوق المشاريع</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body{
      font-family: Almarai, Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 50% -10%, #1A5F44 0%, #0F3D2E 55%, #0B2E23 100%);
    }
    .wrap{ width:100%; max-width:640px; padding:18px; }
    .card{
      background: rgba(255,255,255,0.95);
      border-radius:22px;
      padding:22px;
      border:1px solid rgba(226,232,240,0.9);
      box-shadow:0 18px 50px rgba(0,0,0,.22);
      text-align:center;
      backdrop-filter: blur(6px);
    }
    .logo{ width:80px; border-radius:16px; border:2px solid #D4AF37; background:#fff; }
    h1{ margin:14px 0 6px; color:#0F3D2E; font-size:22px; }
    p{ margin:10px 0; color:#334155; line-height:1.9; }
    .email{
      display:inline-block; margin-top:10px; padding:8px 12px;
      border-radius:999px; background:#F1F5F9; color:#0F3D2E; font-weight:800;
      border:1px solid #e2e8f0;
    }
    .hint{ font-size:12px; color:#64748b; margin-top:12px; }
    .btn{
      margin-top:14px; padding:12px 14px; border-radius:16px;
      border:1px solid #0F3D2E; background:#fff; color:#0F3D2E;
      font-weight:800; cursor:pointer;
    }
    .btn:hover{ filter:brightness(0.98); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
      <h1>باقي خطوة أخيرة</h1>
      <p>أرسلنا رابط تأكيد إلى بريدك الإلكتروني. افتح الرسالة واضغط على زر التأكيد لإكمال إنشاء الحساب والدخول للوحة التحكم.</p>

      <div id="emailBox" class="email" style="display:none;"></div>
      <div class="hint">إذا ما لقيت الرسالة، تحقق من “Spam / Junk”.</div>

      <button class="btn" onclick="window.location.href='project-login.html'">رجوع لتسجيل الدخول</button>
    </div>
  </div>

  <script>
    const email = localStorage.getItem('pendingEmail') || '';
    const box = document.getElementById('emailBox');
    if (email) { box.style.display = 'inline-block'; box.textContent = email; }
  </script>
</body>
</html>
