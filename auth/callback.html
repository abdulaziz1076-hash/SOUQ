<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تأكيد البريد الإلكتروني | سوق المشاريع</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body{
      font-family: Almarai, Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 50% -10%, #1A5F44 0%, #0F3D2E 55%, #0B2E23 100%);
    }
    .card{
      background: rgba(255,255,255,0.95);
      border-radius:22px;
      padding:22px;
      border:1px solid rgba(226,232,240,0.9);
      box-shadow:0 18px 50px rgba(0,0,0,.22);
      text-align:center;
      width:min(560px, 92vw);
      backdrop-filter: blur(6px);
    }
    .logo{ width:70px; border-radius:16px; border:2px solid #D4AF37; background:#fff; }
    h1{ margin:14px 0 6px; color:#0F3D2E; font-size:20px; }
    p{ margin:8px 0; color:#334155; line-height:1.9; font-size:14px; }
    .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #D4AF37;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 20px; margin-top: 15px; }
    .success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 20px; margin-top: 15px; }
    .btn { display: inline-block; margin-top:15px; background:#D4AF37; color:#0F3D2E; padding:10px 25px; border-radius:40px; text-decoration:none; font-weight:700; }
    .btn:hover { background:#0F3D2E; color:white; }
  </style>
</head>
<body>
  <div class="card" id="statusCard">
    <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
    <h1>جاري تأكيد البريد…</h1>
    <p>يرجى الانتظار...</p>
    <div class="loader"></div>
  </div>

  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { APP_CONFIG } from '../config.js';

  const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
  const card = document.getElementById('statusCard');

  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function run() {
    try {
      const url = new URL(window.location.href);
      const code = url.searchParams.get('code');

      // 1) تبادل الكود للحصول على الجلسة
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;
        window.history.replaceState({}, document.title, url.origin + url.pathname);
      }

      // 2) الحصول على الجلسة (مع إعادة المحاولة)
      let session = null;
      for (let i = 0; i < 10; i++) {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (data.session) {
          session = data.session;
          break;
        }
        await delay(500);
      }

      if (!session) throw new Error('لم يتم العثور على جلسة نشطة. يرجى تسجيل الدخول.');

      const userId = session.user.id;

      // 3) التحقق من وجود مشروع مسبقاً (قد يكون أنشئ بالفعل)
      const { data: existingProject } = await supabase
        .from('projects')
        .select('id, status, is_email_verified')
        .eq('owner_user_id', userId)
        .maybeSingle();

      if (existingProject) {
        // إذا كان المشروع موجوداً، فقط نحدث حالة التأكيد
        await supabase
          .from('projects')
          .update({ is_email_verified: true, status: 'active', trial_end_date: null })
          .eq('id', existingProject.id);
        card.innerHTML = `
          <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
          <h1>✅ تم تفعيل مشروعك</h1>
          <p>سيتم تحويلك إلى لوحة التحكم...</p>
          <div class="loader"></div>
        `;
        setTimeout(() => window.location.href = '../project-dashboard.html', 1500);
        return;
      }

      // 4) قراءة بيانات المشروع المؤقتة من localStorage
      const pendingData = localStorage.getItem('pendingProjectData');
      const timestamp = localStorage.getItem('pendingProjectTimestamp');

      if (!pendingData) {
        throw new Error('لا توجد بيانات مشروع مؤقتة. يرجى التسجيل من الصفحة الرئيسية.');
      }

      // التحقق من صلاحية البيانات (30 دقيقة)
      if (timestamp && (Date.now() - parseInt(timestamp) > 30 * 60 * 1000)) {
        localStorage.removeItem('pendingProjectData');
        localStorage.removeItem('pendingProjectTimestamp');
        throw new Error('انتهت صلاحية بيانات التسجيل. يرجى إعادة المحاولة.');
      }

      const projectData = JSON.parse(pendingData);

      // 5) إنشاء المشروع في قاعدة البيانات
      const now = new Date();
      const trialEnd = new Date(now);
      trialEnd.setDate(trialEnd.getDate() + 7);

      const projectPayload = {
        name_ar: projectData.name_ar,
        name_en: projectData.name_en,
        emirate: projectData.emirate,
        description_ar: projectData.description_ar,
        description_en: projectData.description_en,
        long_description_ar: projectData.long_description_ar,
        long_description_en: projectData.long_description_en,
        image: projectData.image,
        coverage: projectData.coverage,
        category_ar: projectData.category_ar,
        category_en: projectData.category_en,
        adra_license: false,
        status: 'active',
        license_status: 'pending_license',
        display_order: 0,
        owner_user_id: userId,
        created_at: now.toISOString(),
        trial_end_date: null,
        is_email_verified: true
      };

      const { data: newProject, error: projError } = await supabase
        .from('projects')
        .insert(projectPayload)
        .select()
        .single();

      if (projError) throw projError;

      // 6) إدراج بيانات التواصل
      const { error: contactError } = await supabase.from('contacts').insert({
        project_id: newProject.id,
        whatsapp: projectData.whatsapp,
        instagram: projectData.instagram || null,
        email: projectData.email
      });
      if (contactError) console.warn('Contacts insert failed:', contactError);

      // 7) حذف البيانات المؤقتة
      localStorage.removeItem('pendingProjectData');
      localStorage.removeItem('pendingProjectTimestamp');
      localStorage.removeItem('pendingEmail');

      // 8) عرض رسالة النجاح والتحويل
      card.innerHTML = `
        <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
        <h1>✅ تم إنشاء مشروعك بنجاح</h1>
        <p>مرحباً بك في سوق المشاريع. سيتم تحويلك إلى لوحة التحكم خلال لحظات...</p>
        <div class="loader"></div>
      `;
      setTimeout(() => {
        window.location.href = '../project-dashboard.html';
      }, 2000);

    } catch (err) {
      console.error(err);
      card.innerHTML = `
        <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
        <h1>⚠️ حدث خطأ</h1>
        <div class="error">${err.message || 'تعذر تأكيد البريد. يرجى المحاولة مرة أخرى.'}</div>
        <p><a href="../project-login.html" class="btn">تسجيل الدخول</a> <a href="../project-register.html" class="btn" style="background:#0F3D2E;color:white;">تسجيل جديد</a></p>
      `;
    }
  }

  run();
</script>
</body>
</html>
