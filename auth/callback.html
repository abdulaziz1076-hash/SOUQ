<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد البريد الإلكتروني | سوق المشاريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Almarai', sans-serif;
            background: linear-gradient(145deg, #0F3D2E, #1A5F44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .logo { width: 70px; margin-bottom: 20px; }
        h1 { color: #0F3D2E; font-size: 24px; margin-bottom: 10px; }
        p { color: #4a5568; margin-bottom: 20px; line-height: 1.6; }
        .loader { display: inline-block; width: 30px; height: 30px; border: 3px solid #D4AF37; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success { color: #166534; background: #dcfce7; padding: 12px; border-radius: 20px; margin-top: 15px; }
        .error { color: #b91c1c; background: #fee2e2; padding: 12px; border-radius: 20px; margin-top: 15px; }
        a { color: #D4AF37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="card" id="statusCard">
    <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع">
    <h1>جاري تأكيد البريد...</h1>
    <div class="loader"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
        'https://xyepcwptfihnztgghimx.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5ZXBjd3B0Zmlobnp0Z2doaW14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0ODA2OTcsImV4cCI6MjA5MjA1NjY5N30.SZvZjWpih1JiUlv24xLhNwjTvzo9RNsrTiI9fchWldE'
    );

    const card = document.getElementById('statusCard');

    async function run() {
        const url = new URL(window.location.href);
        const code = url.searchParams.get('code');

        try {
            if (code) {
                const { error } = await supabase.auth.exchangeCodeForSession(code);
                if (error) throw error;
                window.history.replaceState({}, document.title, url.origin + url.pathname);
            }

            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            if (sessionError) throw sessionError;
            if (!session) throw new Error('لم يتم العثور على جلسة نشطة.');

            const userId = session.user.id;

            // تحديث المشروع من pending إلى active
            const { error: updateError } = await supabase
                .from('projects')
                .update({ status: 'active' })
                .eq('owner_user_id', userId)
                .eq('status', 'pending');

            if (updateError && updateError.code !== 'PGRST116') {
                console.warn('تحديث الحالة:', updateError);
                // لا نمنع الدخول
            }

            // تنظيف التخزين المؤقت
            localStorage.removeItem('pendingEmail');

            card.innerHTML = `
                <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع">
                <h1>✅ تم تأكيد البريد</h1>
                <div class="success">تم تفعيل حساب مشروعك بنجاح.</div>
                <p>سيتم تحويلك إلى لوحة التحكم...</p>
                <div class="loader"></div>
            `;
            setTimeout(() => {
                window.location.href = '../project-dashboard.html';
            }, 2000);
        } catch (err) {
            console.error(err);
            card.innerHTML = `
                <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع">
                <h1>⚠️ حدث خطأ</h1>
                <div class="error">${err.message || 'تعذر تأكيد البريد. حاول تسجيل الدخول يدوياً.'}</div>
                <p><a href="../project-login.html">تسجيل الدخول</a> | <a href="../project-register.html">تسجيل جديد</a></p>
            `;
        }
    }

    run();
</script>
</body>
</html>
