<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري تسجيل الدخول… | سوق المشاريع</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body{
      font-family: Almarai, Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 50% -10%, #1A5F44 0%, #0F3D2E 55%, #0B2E23 100%);
    }
    .card{
      background: rgba(255,255,255,0.95);
      border-radius:22px;
      padding:22px;
      border:1px solid rgba(226,232,240,0.9);
      box-shadow:0 18px 50px rgba(0,0,0,.22);
      text-align:center;
      width:min(560px, 92vw);
      backdrop-filter: blur(6px);
    }
    .logo{ width:70px; border-radius:16px; border:2px solid #D4AF37; background:#fff; }
    h1{ margin:14px 0 6px; color:#0F3D2E; font-size:20px; }
    p{ margin:8px 0; color:#334155; line-height:1.9; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
    <h1>جاري تأكيد البريد وتسجيل الدخول…</h1>
    <p>انتظر لحظات، سيتم تحويلك للوحة التحكم.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from '../config.js';

    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    async function waitForSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) return session;

      return await new Promise(async (resolve) => {
        const { data: sub } = supabase.auth.onAuthStateChange((_event, sess) => {
          if (sess) {
            sub.subscription.unsubscribe();
            resolve(sess);
          }
        });

        setTimeout(async () => {
          sub.subscription.unsubscribe();
          const { data: { session: s2 } } = await supabase.auth.getSession();
          resolve(s2 || null);
        }, 5000);
      });
    }

    const session = await waitForSession();

    if (!session) {
      window.location.href = '../project-login.html';
    } else {
      window.location.href = '../project-dashboard.html';
    }
  </script>
</body>
</html>
