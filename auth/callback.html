<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري تأكيد البريد… | سوق المشاريع</title>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    body{
      font-family: Almarai, Arial, sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 50% -10%, #1A5F44 0%, #0F3D2E 55%, #0B2E23 100%);
    }
    .card{
      background: rgba(255,255,255,0.95);
      border-radius:22px;
      padding:22px;
      border:1px solid rgba(226,232,240,0.9);
      box-shadow:0 18px 50px rgba(0,0,0,.22);
      text-align:center;
      width:min(560px, 92vw);
      backdrop-filter: blur(6px);
    }
    .logo{ width:70px; border-radius:16px; border:2px solid #D4AF37; background:#fff; }
    h1{ margin:14px 0 6px; color:#0F3D2E; font-size:20px; }
    p{ margin:8px 0; color:#334155; line-height:1.9; font-size:14px; }
    .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #D4AF37;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 20px; margin-top: 15px; }
    .success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 20px; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card" id="statusCard">
    <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
    <h1>جاري تأكيد البريد…</h1>
    <p>يرجى الانتظار...</p>
    <div class="loader"></div>
  </div>

  <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { APP_CONFIG } from '../config.js';

  const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
  const card = document.getElementById('statusCard');

  async function run() {
    try {
      const url = new URL(window.location.href);
      const code = url.searchParams.get('code');

      // 1) تبادل الكود للحصول على الجلسة
      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw error;
        window.history.replaceState({}, document.title, url.origin + url.pathname);
      }

      // 2) الحصول على الجلسة
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      if (sessionError) throw sessionError;
      if (!session) throw new Error('لم يتم العثور على جلسة نشطة.');

      const userId = session.user.id;

      // 3) البحث عن مشروع المستخدم
      const { data: project, error: projectError } = await supabase
        .from('projects')
        .select('id, status')
        .eq('owner_user_id', userId)
        .maybeSingle();

      if (projectError) throw projectError;
      if (!project) throw new Error('لا يوجد مشروع مرتبط بهذا الحساب. يرجى إعادة التسجيل.');

      // بعد تأكيد البريد وتحديث الجلسة
if (project.status === 'pending') {
    await supabase
        .from('projects')
        .update({ 
            status: 'active',
            is_email_verified: true  // ← تحديث الحقل الجديد
        })
        .eq('id', project.id);
}

      // 5) عرض رسالة النجاح والتحويل
      card.innerHTML = `
        <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
        <h1>✅ تم تأكيد البريد بنجاح</h1>
        <p>سيتم تحويلك إلى لوحة التحكم خلال لحظات...</p>
        <div class="loader"></div>
      `;
      setTimeout(() => {
        window.location.href = '../project-dashboard.html';
      }, 2000);

    } catch (err) {
      console.error(err);
      card.innerHTML = `
        <img class="logo" src="https://souqalmasharie.onrender.com/images/logo.png" alt="سوق المشاريع" />
        <h1>⚠️ حدث خطأ</h1>
        <div class="error">${err.message || 'تعذر تأكيد البريد. يرجى المحاولة مرة أخرى.'}</div>
        <p><a href="../project-login.html">تسجيل الدخول</a> | <a href="../project-register.html">تسجيل جديد</a></p>
      `;
    }
  }

  run();
</script>
</body>
</html>
