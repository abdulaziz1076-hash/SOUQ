<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | سوق المشاريع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(145deg, #0F3D2E, #1A5F44);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .forgot-card {
            background: white;
            border-radius: 48px;
            max-width: 450px;
            width: 100%;
            padding: 40px 35px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            text-align: center;
        }
        .forgot-card h2 { color: #0F3D2E; font-size: 28px; margin-bottom: 8px; }
        .forgot-card p { color: #64748b; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #E2E8F0;
            border-radius: 60px;
            font-size: 15px;
            font-family: inherit;
        }
        .input-group input:focus {
            outline: none;
            border-color: #D4AF37;
        }
        button {
            background: #0F3D2E;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            background: #1A5F44;
            transform: translateY(-2px);
        }
        .back-link {
            margin-top: 25px;
            border-top: 1px solid #E2E8F0;
            padding-top: 20px;
        }
        .back-link a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 600;
        }
        .message-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 30px;
            display: none;
            font-size: 13px;
        }
        .message-box.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .message-box.error {
            background: #fee2e2;
            color: #dc2626;
            display: block;
        }
    </style>
</head>
<body>
<div class="forgot-card">
    <i class="fas fa-unlock-alt" style="font-size: 60px; color: #D4AF37; margin-bottom: 15px;"></i>
    <h2 id="title">استعادة كلمة المرور</h2>
    <p id="subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>
    <div class="input-group"><input type="email" id="resetEmail" placeholder="البريد الإلكتروني"></div>
    <button id="sendResetBtn"><span>إرسال رابط الاستعادة</span> <i class="fas fa-paper-plane"></i></button>
    <div id="resetMessage" class="message-box"></div>
    <div class="back-link"><a href="project-login.html" id="backLink">← العودة إلى تسجيل الدخول</a></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from './config.js';
    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    const translations = {
        ar: {
            title: "استعادة كلمة المرور",
            subtitle: "أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين",
            emailPlaceholder: "البريد الإلكتروني",
            sendBtn: "إرسال رابط الاستعادة",
            backLink: "← العودة إلى تسجيل الدخول",
            emailRequired: "الرجاء إدخال البريد الإلكتروني",
            invalidEmail: "صيغة البريد الإلكتروني غير صالحة",
            successMsg: "✅ تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني",
            errorMsg: "حدث خطأ، يرجى المحاولة لاحقاً"
        },
        en: {
            title: "Reset Password",
            subtitle: "Enter your email and we'll send you a reset link",
            emailPlaceholder: "Email",
            sendBtn: "Send Reset Link",
            backLink: "← Back to login",
            emailRequired: "Please enter your email",
            invalidEmail: "Invalid email format",
            successMsg: "✅ Reset link sent to your email",
            errorMsg: "An error occurred, please try again"
        }
    };

    let currentLang = localStorage.getItem('projectSouqLang') === 'en' ? 'en' : 'ar';
    function t(key) { return translations[currentLang][key] || key; }

    function updateUI() {
        document.getElementById('title').innerText = t('title');
        document.getElementById('subtitle').innerText = t('subtitle');
        document.getElementById('resetEmail').placeholder = t('emailPlaceholder');
        document.getElementById('sendResetBtn').innerHTML = `<span>${t('sendBtn')}</span> <i class="fas fa-paper-plane"></i>`;
        document.getElementById('backLink').innerHTML = t('backLink');
    }

    const sendBtn = document.getElementById('sendResetBtn');
    const emailInput = document.getElementById('resetEmail');
    const messageDiv = document.getElementById('resetMessage');

    sendBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) {
            showMessage(t('emailRequired'), 'error');
            return;
        }
        if (!/^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email)) {
            showMessage(t('invalidEmail'), 'error');
            return;
        }
        sendBtn.disabled = true;
        sendBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> ${currentLang === 'ar' ? 'جاري الإرسال...' : 'Sending...'}`;
        const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password.html' });
        sendBtn.disabled = false;
        sendBtn.innerHTML = `<span>${t('sendBtn')}</span> <i class="fas fa-paper-plane"></i>`;
        if (error) showMessage(t('errorMsg'), 'error');
        else showMessage(t('successMsg'), 'success');
    });

    function showMessage(msg, type) {
        messageDiv.innerText = msg;
        messageDiv.className = `message-box ${type}`;
        setTimeout(() => messageDiv.style.display = 'none', 5000);
    }

    updateUI();
</script>
</body>
</html>
