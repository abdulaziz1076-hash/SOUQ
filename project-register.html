<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from './config.js';

    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    function showError(msg) {
        const errorDiv = document.getElementById('formError');
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
        setTimeout(() => (errorDiv.style.display = 'none'), 6500);
    }

    // التنقل بين الخطوات
    document.getElementById('nextStepBtn').onclick = () => {
        const nameAr = document.getElementById('nameAr').value.trim();
        const nameEn = document.getElementById('nameEn').value.trim();
        const logoFile = document.getElementById('logoImage').files[0];

        if (!nameAr || !nameEn || !logoFile) {
            showError('يرجى ملء جميع الحقول المطلوبة في الخطوة الأولى');
            return;
        }

        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';

        document.getElementById('step1Indicator').classList.remove('active');
        document.getElementById('step2Indicator').classList.add('active');
    };

    document.getElementById('prevStepBtn').onclick = () => {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step1').style.display = 'block';

        document.getElementById('step2Indicator').classList.remove('active');
        document.getElementById('step1Indicator').classList.add('active');
    };

    // دالة رفع الشعار
    async function uploadLogo(file, userId) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${userId}/logo_${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabase.storage
            .from('project-logos')
            .upload(fileName, file);
        if (uploadError) throw new Error('فشل رفع الشعار: ' + uploadError.message);
        const { data: urlData } = supabase.storage
            .from('project-logos')
            .getPublicUrl(fileName);
        return urlData.publicUrl;
    }

    const form = document.getElementById('registerForm');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (window.__registerBusy) return;
        window.__registerBusy = true;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const whatsappRaw = document.getElementById('whatsapp').value.trim();
        const consent = document.getElementById('consent').checked;

        // التحقق
        if (!email || !password || !whatsappRaw) { showError('يرجى ملء جميع الحقول المطلوبة'); window.__registerBusy = false; return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('البريد الإلكتروني غير صالح'); window.__registerBusy = false; return; }
        if (password.length < 6) { showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل'); window.__registerBusy = false; return; }
        if (password !== confirm) { showError('كلمتا المرور غير متطابقتين'); window.__registerBusy = false; return; }
        if (!consent) { showError('يجب الموافقة على الشروط'); window.__registerBusy = false; return; }

        const whatsappDigits = whatsappRaw.replace(/\D/g, '');
        if (whatsappDigits.length < 9 || whatsappDigits.length > 15) { showError('رقم واتساب غير صالح'); window.__registerBusy = false; return; }

        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loader-small"></span> جاري...';

        try {
            // 1) إنشاء حساب المصادقة (سيتم إرسال رابط تأكيد البريد)
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { role: 'project_owner' },
                    emailRedirectTo: window.location.origin + '/auth/callback.html'
                }
            });

            if (authError) {
                const msg = authError.message.toLowerCase();
                if (msg.includes('already registered')) throw new Error('البريد الإلكتروني مسجل مسبقاً');
                if (msg.includes('rate limit')) throw new Error('تم تجاوز حد إرسال الرسائل، انتظر قليلاً');
                throw new Error(authError.message);
            }

            const userId = authData.user.id;

            // 2) رفع الشعار
            const logoFile = document.getElementById('logoImage').files[0];
            const logoUrl = await uploadLogo(logoFile, userId);

            // 3) إنشاء سجل المشروع في قاعدة البيانات (حالة pending)
            const projectPayload = {
                name_ar: document.getElementById('nameAr').value.trim(),
                name_en: document.getElementById('nameEn').value.trim(),
                emirate: document.getElementById('emirate').value,
                description_ar: document.getElementById('descAr').value,
                description_en: document.getElementById('descEn').value,
                long_description_ar: document.getElementById('longDescAr').value,
                long_description_en: document.getElementById('longDescEn').value,
                image: logoUrl,
                coverage: document.getElementById('coverage').value,
                category_ar: document.getElementById('category').value,
                category_en: document.getElementById('category').value,
                adra_license: false,
                status: 'pending',           // ✅ يبقى pending حتى تأكيد البريد
                license_status: 'pending_license',
                display_order: 0,
                owner_user_id: userId,
                created_at: new Date().toISOString()
            };

            const { data: newProject, error: projError } = await supabase
                .from('projects')
                .insert(projectPayload)
                .select()
                .single();

            if (projError) throw projError;

            // 4) إنشاء بيانات التواصل
            const contactPayload = {
                project_id: newProject.id,
                whatsapp: whatsappDigits,
                instagram: document.getElementById('instagram').value.trim() || null,
                email: email
            };
            const { error: contactError } = await supabase
                .from('contacts')
                .insert(contactPayload);
            if (contactError) console.warn('فشل حفظ بيانات التواصل:', contactError);

            // 5) تخزين مؤقت لبيانات إضافية (اختياري)
            localStorage.setItem('pendingProjectId', newProject.id);
            localStorage.setItem('pendingEmail', email);

            // 6) إظهار رسالة نجاح والتوجيه إلى صفحة "تحقق من بريدك"
            submitBtn.innerHTML = '✅ تم إنشاء الحساب بنجاح';
            setTimeout(() => {
                window.location.href = 'check-email.html';
            }, 1500);

        } catch (err) {
            console.error(err);
            showError(err.message || 'حدث خطأ، يرجى المحاولة لاحقاً');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
            window.__registerBusy = false;
        }
    });
</script>
