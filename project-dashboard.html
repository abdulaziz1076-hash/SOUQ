<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>لوحة تحكم المشروع | سوق المشاريع</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
	<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="css/style.css" />

	<style>
		.dashboard-container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
		.dashboard-header { background: white; border-radius: 28px; padding: 20px 30px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: var(--card-shadow); border: 1px solid var(--light-gray); }
		.dashboard-title h1 { font-family: 'Almarai', sans-serif; color: var(--primary-dark); font-size: 24px; }
		.dashboard-title p { color: var(--gray); font-size: 13px; }

		/* أزرار الحساب */
		.account-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
		.btn-danger { background: #C41E3A; color: #fff; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 800; cursor: pointer; transition: 0.2s; }
		.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(196, 30, 58, 0.25); }
		.btn-warning { background: #F59E0B; color: #1A1A1A; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 800; cursor: pointer; transition: 0.2s; }
		.btn-warning:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(245, 158, 11, 0.25); }
		.btn-success { background: #16A34A; color: #fff; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 800; cursor: pointer; transition: 0.2s; }
		.btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(22, 163, 74, 0.25); }

		.stats-grid-dash { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
		.stat-card-dash { background: white; border-radius: 24px; padding: 20px; text-align: center; border: 1px solid var(--light-gray); }
		.stat-card-dash i { font-size: 36px; color: var(--secondary); margin-bottom: 10px; }
		.stat-number-dash { font-size: 28px; font-weight: 800; color: var(--primary-dark); }

		.tabs-container-dash { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; background: white; border-radius: 60px; padding: 6px; border: 1px solid var(--light-gray); }
		.tab-btn-dash { background: transparent; border: none; padding: 12px 28px; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.2s; color: var(--gray); display: flex; align-items: center; gap: 8px; }
		.tab-btn-dash.active { background: var(--primary-gradient); color: white; box-shadow: 0 4px 12px rgba(15,61,46,0.2); }

		.tab-pane-dash { display: none; background: white; border-radius: 28px; padding: 30px; border: 1px solid var(--light-gray); margin-bottom: 30px; }
		.tab-pane-dash.active { display: block; animation: fadeIn 0.3s ease; }

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.form-row { margin-bottom: 20px; }
		.form-row label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--primary-dark); }
		.form-row input, .form-row select, .form-row textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--light-gray); border-radius: 30px; font-family: inherit; background: var(--light); }
		.form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--secondary); background: white; }

		.btn-save { background: var(--primary-gradient); color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.2s; }
		.btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.3); }

		.btn-secondary { background: white; color: var(--primary-dark); border: 1px solid var(--primary-dark); padding: 10px 20px; border-radius: 40px; cursor: pointer; }

		.product-item { background: var(--light); border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
		.product-img-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 16px; background: #f0f0f0; }
		.product-info { flex: 1; }
		.product-actions { display: flex; gap: 10px; }

		.status-badge { display: inline-block; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: 800; }
		.status-active { background: #DCFCE7; color: #15803D; }
		.status-disabled { background: #FEF3C7; color: #D97706; }
		.status-deleted { background: #FEE2E2; color: #DC2626; }

		.warning-banner { background: #FEF3C7; border-right: 4px solid #F59E0B; padding: 12px 20px; border-radius: 16px; margin-bottom: 20px; font-size: 13px; }
		.info-banner { background: #DBEAFE; border-right: 4px solid #3B82F6; padding: 12px 20px; border-radius: 16px; margin-bottom: 20px; font-size: 13px; }

		.preview-img { max-width: 100px; max-height: 100px; margin-top: 5px; border-radius: 12px; border: 1px solid var(--light-gray); }

		@media (max-width: 700px) {
			.tab-btn-dash { padding: 8px 16px; font-size: 12px; }
			.product-item { flex-direction: column; text-align: center; }
			.account-actions { justify-content: center; width: 100%; }
		}
	</style>
</head>

<body>

<header class="app-header">
	<div class="header-container">
		<div class="logo-section" onclick="window.location.href='index.html'">
			<div class="logo-icon">
				<img src="images/logo.png" alt="سوق المشاريع" onerror="this.src='https://placehold.co/60x60/0F3D2E/white?text=SM'">
			</div>
			<div class="logo-text">
				<h1>سوق المشاريع</h1>
				<p>لوحة التحكم</p>
			</div>
		</div>

		<div class="header-actions">
			<div class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i><span>En</span></div>
			<div class="menu-toggle" id="menuToggleBtn"><i class="fas fa-bars"></i></div>
		</div>
	</div>

	<div class="nav-menu" id="navMenu">
		<div class="nav-item" onclick="window.location.href='index.html'"><i class="fas fa-home"></i><span>الرئيسية</span></div>
		<div class="nav-item" onclick="window.location.href='index.html#/projects/emirate/all'"><i class="fas fa-store"></i><span>السوق</span></div>
		<div class="nav-item" onclick="window.location.href='services.html'"><i class="fas fa-cogs"></i><span>الخدمات</span></div>
		<div class="nav-item" onclick="window.location.href='registerr.html'"><i class="fas fa-user-plus"></i><span>تسجيل مشروع</span></div>
	</div>
</header>

<div class="dashboard-container">
	<div class="dashboard-header">
		<div class="dashboard-title">
			<h1 id="dashboardTitle">لوحة تحكم المشروع</h1>
			<p id="dashboardSub">إدارة مشروعك ومنتجاتك وبيانات التواصل</p>
			<div id="accountStatusWrap" style="margin-top:10px;"></div>
		</div>

		<div class="account-actions">
			<button id="reactivateAccountBtn" class="btn-success" style="display:none;">
				<i class="fas fa-play-circle"></i> إعادة تنشيط الحساب
			</button>

			<button id="disableAccountBtn" class="btn-warning">
				<i class="fas fa-pause-circle"></i> تعطيل الحساب
			</button>

			<button id="deleteAccountBtn" class="btn-danger">
				<i class="fas fa-user-slash"></i> حذف الحساب

		</div>
	</div>

	<!-- إحصائيات -->
	<div class="stats-grid-dash" id="statsDashboard"></div>

	<!-- تبويبات -->
	<div class="tabs-container-dash">
		<button class="tab-btn-dash active" data-tab="profile"><i class="fas fa-store"></i> بيانات المشروع</button>
		<button class="tab-btn-dash" data-tab="products"><i class="fas fa-box"></i> المنتجات</button>
		<button class="tab-btn-dash" data-tab="deals"><i class="fas fa-tags"></i> العروض</button>

		<button class="tab-btn-dash" data-tab="license"><i class="fas fa-file-certificate"></i> الرخصة</button>
		<button class="tab-btn-dash" data-tab="support"><i class="fas fa-headset"></i> الدعم الفني</button>

	<!-- بيانات المشروع -->

		<form id="profileForm">
			<div class="form-row"><label>اسم المشروع (عربي)</label><input type="text" id="profileNameAr" required></div>
			<div class="form-row"><label>اسم المشروع (إنجليزي)</label><input type="text" id="profileNameEn" required></div>
			<div class="form-row"><label>الوصف القصير (عربي)</label><textarea id="profileDescAr" rows="2"></textarea></div>
			<div class="form-row"><label>الوصف القصير (إنجليزي)</label><textarea id="profileDescEn" rows="2"></textarea></div>
			<div class="form-row"><label>الوصف الطويل (عربي)</label><textarea id="profileLongAr" rows="4"></textarea></div>
			<div class="form-row"><label>الوصف الطويل (إنجليزي)</label><textarea id="profileLongEn" rows="4"></textarea></div>

			<div class="form-row">
				<label>الإمارة</label>

				<select id="profileCoverage">
					<option>الإمارة فقط</option>

			<button id="addProductBtn" class="btn-save" style="background: var(--secondary); color: var(--primary-dark);">

		</div>

		<!-- مودال المنتج -->

			<div style="background:white; border-radius:32px; max-width:700px; width:90%; padding:25px; max-height:90vh; overflow-y:auto;">

				<form id="productFormModal">
					<input type="hidden" id="productId">

					<div class="form-row"><label>الاسم (عربي)</label><input id="productNameAr" required></div>
					<div class="form-row"><label>الاسم (إنجليزي)</label><input id="productNameEn" required></div>

					<div class="form-row">
						<label>الصورة الرئيسية (رفع ملف - حد أقصى 2 ميجابايت)</label>
						<input type="file" id="productMainImageFile" accept="image/*">
						<div id="mainImagePreview"></div>
					</div>

					<div class="form-row">
						<label>صور إضافية (رفع عدة صور - كل صورة حد أقصى 2 ميجابايت)</label>
						<input type="file" id="productExtraImages" accept="image/*" multiple>
						<div id="extraImagesPreview" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
					</div>

					<div class="form-row"><label>الوصف القصير (عربي)</label><textarea id="productDescAr" rows="2"></textarea></div>
					<div class="form-row"><label>الوصف القصير (إنجليزي)</label><textarea id="productDescEn" rows="2"></textarea></div>

					<div class="form-row"><label>السعر (عربي)</label><input id="productPriceAr" placeholder="50 درهم"></div>
					<div class="form-row"><label>السعر (إنجليزي)</label><input id="productPriceEn" placeholder="50 AED"></div>

					<div class="form-row">
						<label>نوع المنتج (عربي)</label>
						<select id="productTypeAr">
							<option value="">-- اختر --</option>
							<option>أطباق رئيسية</option>
							<option>مشروبات</option>
							<option>حلويات</option>
						</select>
					</div>

					<div class="form-row">
						<label>نوع المنتج (إنجليزي)</label>

							<option value="">-- Select --</option>
							<option>Main Dishes</option>

						<button type="submit" class="btn-save">حفظ</button>
						<button type="button" id="closeProductModal" class="btn-secondary">إلغاء</button>

			<button id="addDealBtn" class="btn-save" style="background: var(--secondary); color: var(--primary-dark);">

					<div style="display:flex; gap:10px;">
						<button type="submit" class="btn-save">إرسال</button>
						<button type="button" id="closeTicketModal" class="btn-secondary">إلغاء</button>
					</div>
				</form>
			</div>
		</div>
	</div>

</div>

<script type="module">
	import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
	import { APP_CONFIG } from './config.js';
	import { uploadFile, validateFileSize } from './js/project-session.js';

	const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
	let projectId = null;

	function normalizeStatus(s) {
		return (s || '').toString().trim().toLowerCase();
	}

	function renderAccountStatus(status) {
		const wrap = document.getElementById('accountStatusWrap');
		const reactivateBtn = document.getElementById('reactivateAccountBtn');
		const disableBtn = document.getElementById('disableAccountBtn');
		const deleteBtn = document.getElementById('deleteAccountBtn');

		const v = normalizeStatus(status);

		let badgeClass = 'status-active';
		let text = 'فعال';

		if (v === 'disabled') { badgeClass = 'status-disabled'; text = 'معطل'; }
		else if (v === 'deleted') { badgeClass = 'status-deleted'; text = 'محذوف'; }

		wrap.innerHTML = `<span class="status-badge ${badgeClass}">حالة الحساب: ${text}</span>`;

		// زر إعادة التنشيط يظهر فقط إذا الحساب معطل
		if (v === 'disabled') reactivateBtn.style.display = 'inline-flex';
		else reactivateBtn.style.display = 'none';

		// إذا محذوف: نقفل الأزرار (اختياري)
		if (v === 'deleted') {
			disableBtn.disabled = true;
			deleteBtn.disabled = true;
			reactivateBtn.disabled = true;
			disableBtn.style.opacity = 0.6;
			deleteBtn.style.opacity = 0.6;
			reactivateBtn.style.opacity = 0.6;
		} else {
			disableBtn.disabled = false;
			deleteBtn.disabled = false;
			reactivateBtn.disabled = false;
			disableBtn.style.opacity = 1;
			deleteBtn.style.opacity = 1;
			reactivateBtn.style.opacity = 1;
		}
	}

	// ============ Session ============
	async function checkSession() {
		const { data: { session } } = await supabase.auth.getSession();
		if (!session) { window.location.href = 'project-login.html'; return null; }

		const { data: project } = await supabase
			.from('projects')
			.select('id')
			.eq('owner_user_id', session.user.id)
			.single();

		if (!project) { window.location.href = 'project-login.html'; return null; }

		projectId = project.id;
		return session;
	}

	// ============ Load data ============
	async function loadProjectData() {
		const { data: project, error } = await supabase
			.from('projects')
			.select('*')
			.eq('id', projectId)
			.single();

		if (error) {
			alert(error.message);
			return;
		}

		if (project) {
			document.getElementById('profileNameAr').value = project.name_ar || '';
			document.getElementById('profileNameEn').value = project.name_en || '';
			document.getElementById('profileDescAr').value = project.description_ar || '';
			document.getElementById('profileDescEn').value = project.description_en || '';
			document.getElementById('profileLongAr').value = project.long_description_ar || '';
			document.getElementById('profileLongEn').value = project.long_description_en || '';
			document.getElementById('profileEmirate').value = project.emirate || 'دبي';
			document.getElementById('profileCoverage').value = project.coverage || 'الإمارة فقط';
			document.getElementById('profileAdraLicense').checked = !!project.adra_license;

			// التصنيف العربي فقط (عندك في الجدول category_ar/category_en)
			if (project.category_ar) document.getElementById('profileCategory').value = project.category_ar;

			if (project.image) {
				document.getElementById('currentLogoHint').innerHTML = `<img src="${project.image}" class="preview-img" style="max-width:100px;">`;
			} else {
				document.getElementById('currentLogoHint').innerHTML = 'لا يوجد شعار حالياً';
			}

			renderAccountStatus(project.status);
		}

		await loadStats();
		await loadProducts();
		await loadDeals();
		await loadContacts();
		await loadTickets();
		await checkLicenseStatus();
	}

	async function loadStats() {
		const { count: productsCount } = await supabase.from('products').select('*', { count: 'exact', head: true }).eq('project_id', projectId);
		const { count: dealsCount } = await supabase.from('deals').select('*', { count: 'exact', head: true }).eq('project_id', projectId);
		const { count: ordersCount } = await supabase.from('admin_order_logs').select('*', { count: 'exact', head: true }).eq('project_id', projectId);

		document.getElementById('statsDashboard').innerHTML = `
			<div class="stat-card-dash"><i class="fas fa-box"></i><div class="stat-number-dash">${productsCount || 0}</div><div>المنتجات</div></div>
			<div class="stat-card-dash"><i class="fas fa-tags"></i><div class="stat-number-dash">${dealsCount || 0}</div><div>العروض</div></div>
			<div class="stat-card-dash"><i class="fas fa-shopping-cart"></i><div class="stat-number-dash">${ordersCount || 0}</div><div>الطلبات</div></div>
		`;
	}

	async function loadProducts() {
		const { data, error } = await supabase.from('products').select('*').eq('project_id', projectId).order('display_order', { ascending: true });
		if (error) { alert(error.message); return; }

		const container = document.getElementById('productsListContainer');
		if (!data || data.length === 0) { container.innerHTML = '<p>لا توجد منتجات. أضف منتجك الأول.</p>'; return; }

		let html = '';
		for (const p of data) {
			const img = p.main_image || 'https://placehold.co/60x60/0F3D2E/white?text=No+Image';
			const price = p.price_ar || 'سعر عند الطلب';
			html += `
				<div class="product-item">
					<img class="product-img-thumb" src="${img}" onerror="this.src='https://placehold.co/60x60'">
					<div class="product-info"><strong>${p.name_ar || ''}</strong><br>${price}</div>
					<div class="product-actions">
						<button class="btn-secondary" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
						<button class="btn-secondary" style="background:#C41E3A;color:white" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
					</div>
				</div>
			`;
		}
		container.innerHTML = html;
	}

	async function loadDeals() {
		const { data, error } = await supabase.from('deals').select('*').eq('project_id', projectId).order('created_at', { ascending: false });
		if (error) { alert(error.message); return; }

		const container = document.getElementById('dealsListContainer');
		if (!data || data.length === 0) { container.innerHTML = '<p>لا توجد عروض.</p>'; return; }

		let html = '';
		for (const d of data) {
			html += `
				<div class="product-item">
					<div><strong>${d.title_ar || ''}</strong><br>${d.expiry_date || ''}</div>
					<div class="product-actions">
						<button class="btn-secondary" onclick="editDeal('${d.id}')"><i class="fas fa-edit"></i></button>
						<button class="btn-secondary" style="background:#C41E3A;color:white" onclick="deleteDeal('${d.id}')"><i class="fas fa-trash"></i></button>
					</div>
				</div>
			`;
		}
		container.innerHTML = html;
	}

	async function loadContacts() {
		const { data, error } = await supabase.from('contacts').select('*').eq('project_id', projectId).single();
		if (error && error.code !== 'PGRST116') { /* no rows */ }
		if (!data) return;

		document.getElementById('contactWhatsapp').value = data.whatsapp || '';
		document.getElementById('contactPhone').value = data.phone || '';
		document.getElementById('contactEmail').value = data.email || '';
		document.getElementById('contactInstagram').value = data.instagram || '';
		document.getElementById('contactTelegram').value = data.telegram || '';
		document.getElementById('contactSnapchat').value = data.snapchat || '';
		document.getElementById('contactTiktok').value = data.tiktok || '';
		document.getElementById('contactFacebook').value = data.facebook || '';
		document.getElementById('contactTwitter').value = data.twitter || '';
		document.getElementById('contactWebsite').value = data.website || '';
	}

	async function loadTickets() {
		const { data, error } = await supabase.from('support_tickets').select('*').eq('project_id', projectId).order('created_at', { ascending: false });
		if (error) { alert(error.message); return; }

		const container = document.getElementById('ticketsListContainer');
		if (!data || data.length === 0) { container.innerHTML = '<p>لا توجد تذاكر دعم.</p>'; return; }

		let html = '<div style="display:flex; flex-direction:column; gap:15px;">';
		for (const t of data) {
			const statusText = t.status === 'open' ? 'مفتوحة' : (t.status === 'in_progress' ? 'قيد المعالجة' : 'مغلقة');
			const badgeClass = (t.status === 'open' || t.status === 'in_progress') ? 'status-disabled' : 'status-active';

			const replyHtml = t.admin_reply
				? `<div style="margin-top:10px; background:white; padding:10px; border-radius:16px;"><strong>رد الإدارة:</strong> ${t.admin_reply}</div>`
				: '';

			const msg = (t.message || '');
			html += `
				<div style="background:var(--light); border-radius:20px; padding:15px;">
					<div><strong>${t.subject || ''}</strong> <span class="status-badge ${badgeClass}">${statusText}</span></div>
					<div style="font-size:12px; color:var(--gray); margin-top:5px;">${t.created_at ? new Date(t.created_at).toLocaleString() : ''}</div>
					<div style="margin-top:10px;">${msg.substring(0, 150)}${msg.length > 150 ? '...' : ''}</div>
					${replyHtml}
				</div>
			`;
		}
		html += '</div>';
		container.innerHTML = html;
	}

	async function checkLicenseStatus() {
		const { data, error } = await supabase.from('projects').select('license_status').eq('id', projectId).single();
		if (error || !data) return;

		const status = data.license_status;
		const alertDiv = document.getElementById('licenseStatusAlert');

		if (status === 'pending_license') {
			alertDiv.innerHTML = `<div class="warning-banner"><i class="fas fa-clock"></i> لم يتم رفع الرخصة بعد. يرجى رفعها لاستمرار ظهور مشروعك.</div>`;
		} else if (status === 'license_uploaded') {
			alertDiv.innerHTML = `<div class="info-banner"><i class="fas fa-hourglass-half"></i> جاري مراجعة الرخصة من قبل الإدارة.</div>`;
		} else if (status === 'license_approved') {
			alertDiv.innerHTML = `<div class="info-banner" style="background:#DCFCE7; border-right-color:#16A34A;"><i class="fas fa-check-circle"></i> معتمد! مشروعك ظاهر في السوق.</div>`;
		} else if (status === 'license_rejected') {
			alertDiv.innerHTML = `<div class="warning-banner" style="background:#FEE2E2; border-right-color:#DC2626;"><i class="fas fa-times-circle"></i> مرفوض: يرجى رفع ملف صحيح.</div>`;
		} else if (status === 'suspended') {
			alertDiv.innerHTML = `<div class="warning-banner" style="background:#FEE2E2; border-right-color:#DC2626;"><i class="fas fa-ban"></i> الحساب موقوف من الإدارة.</div>`;
		} else {
			alertDiv.innerHTML = '';
		}
	}

	// ============ حفظ بيانات المشروع ============
	document.getElementById('profileForm').addEventListener('submit', async (e) => {
		e.preventDefault();

		let logoUrl = null;
		const logoFile = document.getElementById('profileLogo').files[0];

		if (logoFile) {
			if (!validateFileSize(logoFile, 2)) return;
			const ext = logoFile.name.split('.').pop();
			const fileName = `${projectId}/logo_${Date.now()}.${ext}`;
			logoUrl = await uploadFile('project-logos', fileName, logoFile, 2);
		}

		const updates = {
			name_ar: document.getElementById('profileNameAr').value,
			name_en: document.getElementById('profileNameEn').value,
			description_ar: document.getElementById('profileDescAr').value,
			description_en: document.getElementById('profileDescEn').value,
			long_description_ar: document.getElementById('profileLongAr').value,
			long_description_en: document.getElementById('profileLongEn').value,
			emirate: document.getElementById('profileEmirate').value,
			coverage: document.getElementById('profileCoverage').value,
			category_ar: document.getElementById('profileCategory').value,
			adra_license: document.getElementById('profileAdraLicense').checked,
			...(logoUrl ? { image: logoUrl } : {})
		};

		const { error } = await supabase.from('projects').update(updates).eq('id', projectId);
		if (error) { alert(error.message); return; }

		alert('تم حفظ البيانات');
		await loadProjectData();
	});

	// ============ حفظ التواصل ============
	document.getElementById('contactsForm').addEventListener('submit', async (e) => {
		e.preventDefault();

		const payload = {
			project_id: projectId,
			whatsapp: document.getElementById('contactWhatsapp').value,
			phone: document.getElementById('contactPhone').value,
			email: document.getElementById('contactEmail').value,
			instagram: document.getElementById('contactInstagram').value,
			telegram: document.getElementById('contactTelegram').value,
			snapchat: document.getElementById('contactSnapchat').value,
			tiktok: document.getElementById('contactTiktok').value,
			facebook: document.getElementById('contactFacebook').value,
			twitter: document.getElementById('contactTwitter').value,
			website: document.getElementById('contactWebsite').value
		};

		const { error } = await supabase.from('contacts').upsert(payload);
		if (error) { alert(error.message); return; }

		alert('تم حفظ بيانات التواصل');
	});

	// ============ رفع الرخصة ============
	document.getElementById('licenseForm').addEventListener('submit', async (e) => {
		e.preventDefault();

		const file = document.getElementById('licenseFile').files[0];
		if (!file) return;
		if (!validateFileSize(file, 5)) return;

		const ext = file.name.split('.').pop();
		const fileName = `${projectId}/license_${Date.now()}.${ext}`;

		// ملاحظة: خليته نفس الباكيت اللي كنت تستخدمه عندك، إذا عندك باكيت خاص للرخص غيّره هنا
		const licenseUrl = await uploadFile('project-logos', fileName, file, 5);
		if (!licenseUrl) return;

		await supabase.from('project_license_requests').insert({
			project_id: projectId,
			license_file_url: licenseUrl,
			status: 'pending'
		});

		await supabase.from('projects').update({ license_status: 'license_uploaded' }).eq('id', projectId);

		alert('تم رفع الرخصة، جاري المراجعة');
		await checkLicenseStatus();
	});

	// ============ دعم فني ============
	document.getElementById('newTicketBtn').onclick = () => { document.getElementById('ticketModal').style.display = 'flex'; };
	document.getElementById('closeTicketModal').onclick = () => { document.getElementById('ticketModal').style.display = 'none'; };

	document.getElementById('ticketForm').addEventListener('submit', async (e) => {
		e.preventDefault();

		const subject = document.getElementById('ticketSubject').value;
		const message = document.getElementById('ticketMessage').value;

		const { error } = await supabase.from('support_tickets').insert({ project_id: projectId, subject, message, status: 'open' });
		if (error) { alert(error.message); return; }

		alert('تم إرسال التذكرة');
		document.getElementById('ticketModal').style.display = 'none';
		await loadTickets();
	});

	// ============ أزرار الحالة (تعطيل/حذف/إعادة تنشيط) ============
	document.getElementById('disableAccountBtn').addEventListener('click', async () => {
		if (!confirm('هل أنت متأكد؟ سيتم تعطيل المشروع وقد يتوقف ظهوره في السوق.')) return;

		const { error } = await supabase.from('projects').update({ status: 'disabled' }).eq('id', projectId);
		if (error) { alert(error.message); return; }

		alert('تم تعطيل الحساب.');
		await loadProjectData();
	});

	document.getElementById('reactivateAccountBtn').addEventListener('click', async () => {
		if (!confirm('هل تريد إعادة تنشيط الحساب؟')) return;

		const { error } = await supabase.from('projects').update({ status: 'active' }).eq('id', projectId);
		if (error) { alert(error.message); return; }

		alert('تم إعادة تنشيط الحساب.');
		await loadProjectData();
	});

	document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
		const ok = confirm('هل أنت متأكد من حذف الحساب؟ سيتم إخفاء المشروع (حذف ناعم).');
		if (!ok) return;
		const ok2 = confirm('تأكيد أخير: هل تريد حذف الحساب الآن؟');
		if (!ok2) return;

		const { error } = await supabase.from('projects').update({ status: 'deleted' }).eq('id', projectId);
		if (error) { alert(error.message); return; }

		alert('تم حذف الحساب (المشروع).');
		await loadProjectData();
	});

	// ============ Logout ============
	document.getElementById('logoutBtn').onclick = async () => {
		await supabase.auth.signOut();
		window.location.href = 'index.html';
	};

	// ============ Tabs ============
	document.querySelectorAll('.tab-btn-dash').forEach(btn => {
		btn.addEventListener('click', () => {
			document.querySelectorAll('.tab-btn-dash').forEach(b => b.classList.remove('active'));
			btn.classList.add('active');
			document.querySelectorAll('.tab-pane-dash').forEach(p => p.classList.remove('active'));
			document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
		});
	});

	// ============ Init ============
	await checkSession();

	// تعبئة التصنيفات
	const categories = ["أطعمة ومشروبات","الرقميات","روائح وعطور","عناية","حلويات","تجميل","ملابس","يدويات","هدايا","عطارة","فنون","نباتات","ترفيه"];
	const catSelect = document.getElementById('profileCategory');
	catSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

	await loadProjectData();

	// القائمة
	document.getElementById('menuToggleBtn').addEventListener('click', () => document.getElementById('navMenu').classList.toggle('active'));

	// تبديل اللغة (بسيط كما كان عندك)
	let currentLang = localStorage.getItem('projectSouqLang') || 'ar';
	document.getElementById('langToggleBtn').addEventListener('click', () => {
		currentLang = currentLang === 'ar' ? 'en' : 'ar';
		localStorage.setItem('projectSouqLang', currentLang);
		document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
		location.reload();
	});

</script>

</body>
</html>
