<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لوحة تحكم المشرف – سوق المشاريع</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Almarai', 'Tajawal', sans-serif;
            color: #1a2c3e;
            direction: rtl;
        }
        .admin-wrapper { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }
        
        /* شريط علوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 32px;
            padding: 12px 28px;
            margin-bottom: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2edf2;
        }
        .logo-area h1 { font-size: 1.5rem; color: #0a2e25; font-weight: 800; }
        .logo-area i { color: #D4AF37; margin-left: 8px; }
        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logout-btn:hover { background: #c53030; transform: translateY(-2px); }
        
        /* بطاقات إحصائية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.03);
            border: 1px solid #e9f0f5;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .stat-card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1); }
        .stat-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #0b3b2e, #1a5f44);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .stat-icon i { font-size: 28px; color: #D4AF37; }
        .stat-number { font-size: 38px; font-weight: 800; color: #0a2e25; line-height: 1.2; }
        .stat-label { font-size: 14px; color: #5f7f9a; margin-top: 8px; font-weight: 500; }
        
        /* التبويبات */
        .tabs-container {
            background: white;
            border-radius: 60px;
            padding: 6px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2edf2;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #2c4e6e;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .tab-btn i { font-size: 16px; }
        .tab-btn.active { background: #0a2e25; color: white; box-shadow: 0 8px 18px rgba(10,46,37,0.2); }
        .tab-btn:hover:not(.active) { background: #e6f0f5; }
        
        /* المحتوى */
        .content-card { background: white; border-radius: 32px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid #e9f0f5; display: none; }
        .content-card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* شريط الفلاتر */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .filter-bar input, .filter-bar select {
            padding: 10px 18px;
            border: 1px solid #cfdfe9;
            border-radius: 34px;
            background: white;
            font-family: inherit;
            font-size: 13px;
            min-width: 170px;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #1a5f44; outline: none; box-shadow: 0 0 0 3px rgba(26,95,68,0.1); }
        .filter-bar button {
            background: #0a2e25;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .filter-bar button.btn-outline { background: white; color: #0a2e25; border: 1px solid #0a2e25; }
        .filter-bar button.btn-outline:hover { background: #0a2e25; color: white; transform: translateY(-2px); }
        .filter-bar button:hover { transform: translateY(-2px); background: #1a5f44; }
        
        /* الجداول */
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th, .data-table td { padding: 16px 12px; text-align: right; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
        .data-table th { background: #fafcfd; font-weight: 800; color: #0a2e25; }
        .data-table tr:hover td { background-color: #f8fbfe; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 40px; font-size: 12px; font-weight: 700; }
        .badge-pending { background: #fff3e0; color: #c47a2e; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }
        .badge-reviewed { background: #e0f2fe; color: #0369a1; }
        .badge-resolved { background: #d9f99d; color: #3f6212; }
        
        .thumb-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); cursor: pointer; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 12px;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .action-btn.move-up, .action-btn.move-down {
            color: #D4AF37;
            background: #fff8e7;
        }
        .action-btn.move-up:hover, .action-btn.move-down:hover {
            background: #0a2e25;
            color: white;
            transform: scale(1.05);
        }
        .action-btn.edit { color: #2c7da0; background: #eef6fc; }
        .action-btn.edit:hover { background: #c9e6f5; transform: scale(1.05); }
        .action-btn.delete { color: #e53e3e; background: #fee9e9; }
        .action-btn.delete:hover { background: #fccaca; transform: scale(1.05); }
        .view-details-btn {
            background: #D4AF37;
            color: #0a2e25;
            border: none;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        
        /* المودالات */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 44px;
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 40px rgba(0,0,0,0.2);
        }
        .modal-header { padding: 24px 28px; border-bottom: 1px solid #e9f0f5; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.6rem; color: #0a2e25; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #94a3b8; }
        .modal-body { padding: 28px; }
        .form-row { margin-bottom: 24px; }
        .form-row label { display: block; font-weight: 700; margin-bottom: 8px; color: #1e293b; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 12px 18px; border: 1px solid #cfdfe9; border-radius: 24px; font-family: inherit; font-size: 14px; }
        .checkbox-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .btn-save { background: linear-gradient(135deg, #0a2e25, #1a5f44); color: white; width: 100%; padding: 14px; border-radius: 60px; font-weight: 700; border: none; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10,46,37,0.3); }
        
        .variant-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .variant-row input { flex: 1; min-width: 100px; }
        .remove-variant { background: #fee2e2; border: none; border-radius: 30px; width: 34px; height: 34px; cursor: pointer; color: #b91c1c; }
        .btn-outline { background: white; color: #0a2e25; border: 1px solid #0a2e25; padding: 6px 12px; border-radius: 30px; cursor: pointer; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a2e25;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            z-index: 3000;
            font-weight: 500;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 28px; }
        .pagination button { padding: 8px 16px; border-radius: 30px; border: 1px solid #cfdfe9; background: white; cursor: pointer; transition: 0.2s; }
        .pagination button:hover { background: #0a2e25; color: white; border-color: #0a2e25; }
        
        @media (max-width: 700px) {
            .tab-btn { padding: 8px 16px; font-size: 12px; }
            .filter-group { width: 100%; }
            .filter-bar input, .filter-bar select { width: 100%; }
            .data-table th, .data-table td { font-size: 12px; padding: 8px 6px; }
        }
    </style>
</head>
<body>

<div id="loginSection" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#0a2e25,#1a5f44);">
    <div style="background:white; border-radius:48px; padding:42px; width:100%; max-width:420px; text-align:center; box-shadow:0 25px 45px rgba(0,0,0,0.2);">
        <i class="fas fa-chalkboard-user" style="font-size:64px; color:#D4AF37; margin-bottom:20px;"></i>
        <h2 style="color:#0a2e25; margin-bottom:20px;">دخول المشرف</h2>
        <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" value="abdulaziz1076@gmail.com" style="width:100%; padding:14px; margin:12px 0; border-radius:40px; border:1px solid #ccc;">
        <input type="password" id="adminPassword" placeholder="كلمة المرور" style="width:100%; padding:14px; margin-bottom:24px; border-radius:40px; border:1px solid #ccc;">
        <button id="loginBtn" style="background:#0a2e25; color:white; width:100%; padding:14px; border-radius:40px; font-weight:bold; border:none; font-size:16px;">دخول <i class="fas fa-arrow-left"></i></button>
        <div id="loginError" style="color:#dc2626; margin-top:16px;"></div>
        <div style="margin-top: 15px;"><a href="#" id="forgotPasswordLink" style="color: #D4AF37; text-decoration: none; font-size: 13px;">نسيت كلمة المرور؟</a></div>
    </div>
</div>

<div id="adminContent" style="display:none;">
    <div class="admin-wrapper">
        <div class="top-bar">
            <div class="logo-area"><h1><i class="fas fa-store"></i> سوق المشاريع | المشرف المتقدم</h1></div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>

        <div class="stats-grid" id="statsContainer">جاري التحميل...</div>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="registrations"><i class="fas fa-clipboard-list"></i> طلبات التسجيل</button>
            <button class="tab-btn" data-tab="projects"><i class="fas fa-store"></i> المشاريع</button>
            <button class="tab-btn" data-tab="products"><i class="fas fa-box"></i> المنتجات</button>
            <button class="tab-btn" data-tab="deals"><i class="fas fa-tags"></i> العروض</button>
            <button class="tab-btn" data-tab="contacts"><i class="fas fa-address-card"></i> بيانات التواصل</button>
            <button class="tab-btn" data-tab="feedbacks"><i class="fas fa-comment-dots"></i> الشكاوى</button>
            <button class="tab-btn" data-tab="orders"><i class="fas fa-truck"></i> الطلبات</button>
            <!-- تبويب إدارة التراخيص -->
            <button class="tab-btn" data-tab="licenses"><i class="fas fa-file-certificate"></i> إدارة التراخيص</button>
            <!-- تبويب الدعم الفني (جديد) -->
            <button class="tab-btn" data-tab="support"><i class="fas fa-headset"></i> الدعم الفني</button>
        </div>

        <!-- طلبات التسجيل -->
        <div id="registrationsTab" class="content-card active">
            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="regSearch" placeholder="بحث: اسم، واتساب...">
                    <select id="regStatusFilter">
                        <option value="all">كل الحالات</option>
                        <option value="pending">معلق</option>
                        <option value="approved">موافق</option>
                        <option value="rejected">مرفوض</option>
                    </select>
                </div>
                <button id="exportRegBtn" class="btn-outline"><i class="fas fa-file-csv"></i> تصدير CSV</button>
            </div>
            <div id="registrationsTableContainer"></div>
            <div id="registrationsPagination" class="pagination"></div>
        </div>

        <!-- المشاريع -->
        <div id="projectsTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="projectSearch" placeholder="بحث بالاسم...">
                    <select id="projectEmirateFilter"><option value="">كل الإمارات</option></select>
                    <select id="projectStatusFilter"><option value="">كل الحالات</option><option value="pending">معلق</option><option value="approved">موافق</option><option value="rejected">مرفوض</option></select>
                </div>
                <div class="filter-group">
                    <button id="addProjectBtn" class="btn-outline"><i class="fas fa-plus"></i> مشروع جديد</button>
                    <button id="exportProjectsBtn" class="btn-outline"><i class="fas fa-file-csv"></i> تصدير</button>
                    <button id="reorderProjectsBtn" class="btn-outline"><i class="fas fa-sort-amount-down"></i> إعادة ترتيب</button>
                </div>
            </div>
            <div id="projectsTableContainer"></div>
            <div id="projectsPagination" class="pagination"></div>
        </div>

        <!-- المنتجات -->
        <div id="productsTab" class="content-card">
            <div class="filter-bar">
                <select id="productProjectFilter"><option value="">اختر المشروع أولاً</option></select>
                <button id="addProductBtn" class="btn-outline"><i class="fas fa-plus"></i> منتج جديد</button>
                <button id="reorderProductsBtn" class="btn-outline"><i class="fas fa-sort-amount-down"></i> إعادة ترتيب</button>
            </div>
            <div id="productsTableContainer"></div>
        </div>

        <!-- العروض -->
        <div id="dealsTab" class="content-card">
            <div class="filter-bar">
                <select id="dealProjectFilter"><option value="">اختر المشروع</option></select>
                <button id="addDealBtn" class="btn-outline"><i class="fas fa-plus"></i> عرض جديد</button>
            </div>
            <div id="dealsTableContainer"></div>
        </div>

        <!-- جهات الاتصال -->
        <div id="contactsTab" class="content-card">
            <div class="filter-bar">
                <select id="contactProjectFilter"><option value="">اختر المشروع</option></select>
            </div>
            <div id="contactsTableContainer"></div>
        </div>

        <!-- الشكاوى -->
        <div id="feedbacksTab" class="content-card">
            <div class="filter-bar">
                <select id="feedbackStatusFilter">
                    <option value="">كل الحالات</option>
                    <option value="pending">معلق</option>
                    <option value="reviewed">مراجَع</option>
                    <option value="resolved">محلول</option>
                    <option value="rejected">مرفوض</option>
                </select>
            </div>
            <div id="feedbacksTableContainer"></div>
        </div>

        <!-- الطلبات -->
        <div id="ordersTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="ordersSearch" placeholder="بحث: مشروع، واتساب، رقم طلب...">
                    <select id="ordersProjectFilter"><option value="">كل المشاريع</option></select>
                </div>
                <button id="exportOrdersBtn" class="btn-outline"><i class="fas fa-file-csv"></i> تصدير CSV</button>
            </div>
            <div id="ordersTableContainer"></div>
            <div id="ordersPagination" class="pagination"></div>
        </div>

        <!-- تبويب إدارة التراخيص -->
        <div id="licensesTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <select id="licenseStatusFilter">
                        <option value="all">كل الحالات</option>
                        <option value="pending">قيد المراجعة</option>
                        <option value="approved">موافق</option>
                        <option value="rejected">مرفوض</option>
                    </select>
                </div>
                <button id="refreshLicensesBtn" class="btn-outline"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
            <div id="licensesTableContainer"></div>
        </div>

        <!-- ****************** تبويب الدعم الفني (جديد) ****************** -->
        <div id="supportTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <select id="supportStatusFilter">
                        <option value="all">كل الحالات</option>
                        <option value="open">مفتوحة</option>
                        <option value="in_progress">قيد المعالجة</option>
                        <option value="closed">مغلقة</option>
                    </select>
                </div>
                <button id="refreshSupportBtn" class="btn-outline"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
            <div id="supportTicketsContainer"></div>
        </div>
        <!-- ********************************************************** -->

    </div>
</div>

<!-- مودال المشروع -->
<div id="projectModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>مشروع</h3><button class="modal-close" data-modal="projectModal"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="form-row"><label>الاسم (عربي)</label><input id="projectNameAr" required></div>
                <div class="form-row"><label>الاسم (إنجليزي)</label><input id="projectNameEn" required></div>
                <div class="form-row"><label>الإمارة</label><select id="projectEmirate"><option>أبوظبي</option><option>دبي</option><option>الشارقة</option><option>عجمان</option><option>رأس الخيمة</option><option>الفجيرة</option><option>أم القيوين</option></select></div>
                <div class="form-row"><label>الصورة (URL)</label><input id="projectImage" placeholder="رابط الصورة"></div>
                <div class="form-row"><label>التصنيف (عربي)</label><select id="projectCategoryAr"></select></div>
                <div class="form-row"><label>التصنيف (إنجليزي)</label><select id="projectCategoryEn"></select></div>
                <div class="form-row"><label>الوصف القصير (عربي)</label><textarea id="projectDescAr" rows="2"></textarea></div>
                <div class="form-row"><label>الوصف القصير (إنجليزي)</label><textarea id="projectDescEn" rows="2"></textarea></div>
                <div class="form-row"><label>الوصف الطويل (عربي)</label><textarea id="projectLongDescAr" rows="4"></textarea></div>
                <div class="form-row"><label>الوصف الطويل (إنجليزي)</label><textarea id="projectLongDescEn" rows="4"></textarea></div>
                <div class="checkbox-row"><input type="checkbox" id="projectLicense"><label>رخصة أدريا</label></div>
                <div class="form-row"><label>الحالة</label><select id="projectStatus"><option value="pending">معلق</option><option value="approved">موافق</option><option value="rejected">مرفوض</option></select></div>
                <button class="btn-save">حفظ</button>
            </form>
        </div>
    </div>
</div>

<!-- مودال المنتج -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>منتج</h3><button class="modal-close" data-modal="productModal"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
            <form id="productForm">
                <input type="hidden" id="productId">
                <input type="hidden" id="productProjectId">
                <div class="form-row"><label>الاسم (عربي)</label><input id="productNameAr" required></div>
                <div class="form-row"><label>الاسم (إنجليزي)</label><input id="productNameEn" required></div>
                <div class="form-row"><label>الصورة الرئيسية (URL)</label><input id="productMainImage"></div>
                <div class="form-row"><label>صور إضافية (فاصلة)</label><input id="productImages" placeholder="url1,url2"></div>

// ==================== المشاريع ====================
async function loadProjects(page = 1) {
    currentProjectsPage = page;
    let query = supabase.from('projects').select('*', { count: 'exact' }).order('display_order', { ascending: true, nullsFirst: false }).order('id', { ascending: false }).range((page-1)*10, page*10-1);
    const search = document.getElementById('projectSearch').value;
    if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);
    const emirate = document.getElementById('projectEmirateFilter').value;
    if (emirate) query = query.eq('emirate', emirate);
    const statusF = document.getElementById('projectStatusFilter').value;
    if (statusF) query = query.eq('status', statusF);
    const { data, error, count } = await query;
    projectsTotal = count || 0;
    if (error) { showToast(error.message, true); return; }
    let html = `<table class="data-table"><thead><tr><th>الترتيب</th><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>التصنيف</th><th>الإمارة</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
    for (const p of (data || [])) {
        let statusBadge = p.status === 'approved' ? 'badge-approved' : (p.status === 'rejected' ? 'badge-rejected' : 'badge-pending');
        html += `<tr>
            <td style="white-space: nowrap;">
                <input type="number" value="${p.display_order ?? 0}" style="width:70px;" class="project-order-input" data-id="${p.id}">
                <button class="action-btn move-up" onclick="window.swapProjectOrder(${p.id}, 'up')"><i class="fas fa-arrow-up"></i></button>
                <button class="action-btn move-down" onclick="window.swapProjectOrder(${p.id}, 'down')"><i class="fas fa-arrow-down"></i></button>
              </td>
              <td>${p.id}</td>
              <td>${p.image ? `<img src="${p.image}" class="thumb-preview" onclick="window.open('${p.image}')">` : '-'}</td>
              <td>${escapeHtml(p.name_ar)}</td>
              <td>${p.category_ar || '-'}</td>
              <td>${p.emirate}</td>
              <td><span class="badge ${statusBadge}">${p.status === 'approved' ? 'موافق' : (p.status === 'rejected' ? 'مرفوض' : 'معلق')}</span></td>
              <td class="action-buttons">
                  <button class="action-btn edit" onclick="window.editProject(${p.id})"><i class="fas fa-edit"></i></button>
                  <button class="action-btn delete" onclick="window.deleteItem('projects',${p.id})"><i class="fas fa-trash"></i></button>
              </td>
          </tr>`;
    }
    html += `</tbody>`;
    document.getElementById('projectsTableContainer').innerHTML = html;
    document.querySelectorAll('.project-order-input').forEach(inp => {
        inp.addEventListener('change', function() {
            const id = this.dataset.id;
            const newOrder = parseInt(this.value);
            if (!isNaN(newOrder)) updateProjectOrderDirect(id, newOrder);
        });
    });
    let totalPages = Math.ceil(projectsTotal / 10);
    let paginationHtml = '<div class="pagination">';
    for (let i = 1; i <= totalPages; i++) paginationHtml += `<button onclick="window.loadProjects(${i})" ${i === page ? 'style="background:#0a2e25;color:#fff;"' : ''}>${i}</button>`;
    paginationHtml += '</div>';
    document.getElementById('projectsPagination').innerHTML = totalPages > 1 ? paginationHtml : '';
}

window.swapProjectOrder = async (id, direction) => {
    const { data: current } = await supabase.from('projects').select('id, display_order').eq('id', id).single();
    if (!current) return;
    let currentOrder = current.display_order ?? 0;
    let query;
    if (direction === 'up') {
        query = supabase.from('projects').select('id, display_order').lt('display_order', currentOrder).order('display_order', { ascending: false }).limit(1);
    } else {
        query = supabase.from('projects').select('id, display_order').gt('display_order', currentOrder).order('display_order', { ascending: true }).limit(1);
    }
    const { data: neighbor } = await query;
    if (!neighbor || neighbor.length === 0) { showToast(direction === 'up' ? 'هذا بالفعل الأعلى' : 'هذا بالفعل الأسفل'); return; }
    const target = neighbor[0];
    await supabase.from('projects').update({ display_order: target.display_order }).eq('id', current.id);
    await supabase.from('projects').update({ display_order: currentOrder }).eq('id', target.id);
    showToast('تم تبديل الترتيب');
    loadProjects(currentProjectsPage);
};

async function updateProjectOrderDirect(id, newOrder) {
    const { error } = await supabase.from('projects').update({ display_order: newOrder }).eq('id', id);
    if (error) showToast(error.message, true);
    else loadProjects(currentProjectsPage);
}

window.editProduct = async (id) => {
    const { data } = await supabase.from('products').select('*').eq('id', id).single();
    if (data) {
        document.getElementById('productId').value = data.id;
        document.getElementById('productProjectId').value = data.project_id;
        document.getElementById('productNameAr').value = data.name_ar;
        document.getElementById('productNameEn').value = data.name_en;
        document.getElementById('productMainImage').value = data.main_image || '';
        document.getElementById('productImages').value = (data.images || []).join(',');

        document.getElementById('productLongDescAr').value = data.long_description_ar || '';
        document.getElementById('productLongDescEn').value = data.long_description_en || '';

        if (document.getElementById('productTypeAr')) document.getElementById('productTypeAr').value = data.type_ar || '';
        if (document.getElementById('productTypeEn')) document.getElementById('productTypeEn').value = data.type_en || '';
        if (document.getElementById('productCategoryAr')) document.getElementById('productCategoryAr').value = data.category_ar || '';
        if (document.getElementById('productCategoryEn')) document.getElementById('productCategoryEn').value = data.category_en || '';
        document.getElementById('productPriceAr').value = data.price_ar || '';
        document.getElementById('productPriceEn').value = data.price_en || '';
        const { data: variants } = await supabase.from('product_variants').select('*').eq('product_id', id);
        currentVariants = variants || [];
        renderVariants();
        document.getElementById('productModal').classList.add('active');
    }
};

function renderVariants() {
    const container = document.getElementById('variantsContainer');
    if (!container) return;
    container.innerHTML = currentVariants.map((v, idx) => `
        <div class="variant-row">
            <input type="text" placeholder="الاسم (عربي)" value="${escapeHtml(v.label_ar)}" class="variant-label-ar">
            <input type="text" placeholder="الاسم (En)" value="${escapeHtml(v.label_en)}" class="variant-label-en">
            <input type="text" placeholder="السعر (عربي)" value="${escapeHtml(v.price_ar)}" class="variant-price-ar">
            <input type="text" placeholder="السعر (En)" value="${escapeHtml(v.price_en)}" class="variant-price-en">
            <label><input type="checkbox" ${v.is_default ? 'checked' : ''} class="variant-default"> افتراضي</label>
            <button type="button" class="remove-variant" data-idx="${idx}"><i class="fas fa-trash"></i></button>
        </div>
    `).join('');
    document.querySelectorAll('.remove-variant').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const idx = parseInt(btn.dataset.idx);
            currentVariants.splice(idx, 1);
            renderVariants();
        });
    });
}
document.getElementById('addVariantBtn')?.addEventListener('click', () => {
    currentVariants.push({ label_ar: '', label_en: '', price_ar: '', price_en: '', is_default: false });
    renderVariants();
});

async function saveProduct(e) {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const projectId = document.getElementById('productProjectId').value;
    const imagesArr = document.getElementById('productImages').value.split(',').map(s=>s.trim()).filter(Boolean);
    const detailsAr = document.getElementById('productDetailsAr').value.split('\n').filter(l=>l.trim());
    const detailsEn = document.getElementById('productDetailsEn').value.split('\n').filter(l=>l.trim());
    const payload = {
        name_ar: document.getElementById('productNameAr').value,
        name_en: document.getElementById('productNameEn').value,
        main_image: document.getElementById('productMainImage').value,
        images: imagesArr,
        description_ar: document.getElementById('productDescAr').value,
        description_en: document.getElementById('productDescEn').value,
        long_description_ar: document.getElementById('productLongDescAr').value,
        long_description_en: document.getElementById('productLongDescEn').value,
        details_ar: detailsAr,
        details_en: detailsEn,
        price_ar: document.getElementById('productPriceAr').value,
        price_en: document.getElementById('productPriceEn').value,
        type_ar: document.getElementById('productTypeAr').value,
        type_en: document.getElementById('productTypeEn').value,
        category_ar: document.getElementById('productCategoryAr').value,
        category_en: document.getElementById('productCategoryEn').value,
        project_id: projectId
    };
    let productId = id;
    if (!productId) {
        const { data: newProduct, error: insertErr } = await supabase.from('products').insert(payload).select().single();
        if (insertErr) { showToast(insertErr.message, true); return; }
        productId = newProduct.id;
    } else {
        const { error: updateErr } = await supabase.from('products').update(payload).eq('id', productId);
        if (updateErr) { showToast(updateErr.message, true); return; }
    }
    await supabase.from('product_variants').delete().eq('product_id', productId);
    for (let v of currentVariants) {
        if (v.label_ar || v.label_en) {
            await supabase.from('product_variants').insert({
                product_id: productId,
                label_ar: v.label_ar,
                label_en: v.label_en,
                price_ar: v.price_ar,
                price_en: v.price_en,
                is_default: v.is_default
            });
        }
    }
    showToast('تم حفظ المنتج');
    document.getElementById('productModal').classList.remove('active');
    loadProducts();
    loadStats();
}

window.deleteItem = async (table, id) => {
    if (confirm('هل أنت متأكد من الحذف؟')) {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) showToast(error.message, true);
        else { showToast('تم الحذف بنجاح'); if (table === 'projects') loadProjects(); else if (table === 'products') loadProducts(); else if (table === 'deals') loadDeals(); loadStats(); }
    }
};

// ==================== طلبات التسجيل ====================
async function loadRegistrations(page = 1) {
    currentRegPage = page;
    let query = supabase.from('project_registrations').select('*', { count: 'exact' }).order('created_at', { ascending: false }).range((page-1)*10, page*10-1);
    const search = document.getElementById('regSearch')?.value || '';
    if (search) {
        query = query.or(`project_name.ilike.%${search}%,whatsapp.ilike.%${search}%,ip.ilike.%${search}%`);
    }
    const status = document.getElementById('regStatusFilter').value;
    if (status !== 'all') query = query.eq('status', status);
    const { data, error, count } = await query;
    regTotal = count || 0;
    if (error) { showToast(error.message, true); return; }
    let html = `<table class="data-table"><thead><tr><th>#</th><th>اسم المشروع</th><th>واتساب</th><th>الإمارة</th><th>الحالة</th><th>التاريخ</th><th>IP</th><th></th></tr></thead><tbody>`;
    for (const reg of (data || [])) {
        let statusClass = reg.status === 'pending' ? 'badge-pending' : (reg.status === 'approved' ? 'badge-approved' : 'badge-rejected');
        let statusText = reg.status === 'pending' ? 'معلق' : (reg.status === 'approved' ? 'موافق' : 'مرفوض');
        html += `<tr>
            <td>${reg.id}</td>
            <td>${escapeHtml(reg.project_name)}</td>
            <td>${escapeHtml(reg.whatsapp)}</td>
            <td>${escapeHtml(reg.emirate)}</td>
            <td><span class="badge ${statusClass}">${statusText}</span></td>
            <td>${new Date(reg.created_at).toLocaleString()}</td>
            <td>${escapeHtml(reg.ip || '-')}</td>
            <td class="action-buttons">
                <button class="action-btn edit" onclick="window.updateRegStatus(${reg.id}, 'approved')" title="قبول"><i class="fas fa-check-circle"></i></button>
                <button class="action-btn delete" onclick="window.updateRegStatus(${reg.id}, 'rejected')" title="رفض"><i class="fas fa-times-circle"></i></button>
                <button class="view-details-btn" onclick="window.showRegDetails(${reg.id})">تفاصيل</button>
            </td>
        </tr>`;
    }
    html += `</tbody>`;
    document.getElementById('registrationsTableContainer').innerHTML = html;
    let totalPages = Math.ceil(regTotal / 10);
    let paginationHtml = '<div class="pagination">';
    for (let i = 1; i <= totalPages; i++) paginationHtml += `<button onclick="window.loadRegistrations(${i})" ${i === page ? 'style="background:#0a2e25;color:#fff;"' : ''}>${i}</button>`;
    paginationHtml += '</div>';
    document.getElementById('registrationsPagination').innerHTML = totalPages > 1 ? paginationHtml : '';
}

async function loadDeals() {
    const projectId = document.getElementById('dealProjectFilter').value;
    if (!projectId) { document.getElementById('dealsTableContainer').innerHTML = '<p>اختر مشروعاً لعرض عروضه</p>'; return; }
    const { data } = await supabase.from('deals').select('*').eq('project_id', projectId);
    let html = `<table class="data-table"><thead><tr><th>ID</th><th>الصورة</th><th>العنوان</th><th>الإجراءات</th></tr></thead><tbody>`;
    for (const d of (data || [])) {
        html += `<tr>
            <td>${d.id}</td>
            <td>${d.image ? `<img src="${d.image}" class="thumb-preview">` : '-'}</td>
            <td>${escapeHtml(d.title_ar)}</td>
            <td class="action-buttons">
                <button class="action-btn edit" onclick="window.editDeal('${d.id}')"><i class="fas fa-edit"></i></button>
                <button class="action-btn delete" onclick="window.deleteItem('deals','${d.id}')"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    }
    html += `</tbody>`;
    document.getElementById('dealsTableContainer').innerHTML = html;

window.editDeal = async (id) => {
    const { data } = await supabase.from('deals').select('*').eq('id', id).single();
    if (data) {
        document.getElementById('dealId').value = data.id;
        document.getElementById('dealProjectId').value = data.project_id;
        document.getElementById('dealTitleAr').value = data.title_ar;
        document.getElementById('dealTitleEn').value = data.title_en;
        document.getElementById('dealImage').value = data.image || '';
        document.getElementById('dealDescAr').value = data.description_ar || '';
        document.getElementById('dealDescEn').value = data.description_en || '';
        document.getElementById('dealBadgeAr').value = data.badge_ar || '';
        document.getElementById('dealBadgeEn').value = data.badge_en || '';
        document.getElementById('dealExpiry').value = data.expiry_date || '';
        document.getElementById('dealModal').classList.add('active');
    }
};
async function saveDeal(e) {
    e.preventDefault();
    const id = document.getElementById('dealId').value;
    const projectId = document.getElementById('dealProjectId').value;
    const payload = {
        title_ar: document.getElementById('dealTitleAr').value,
        title_en: document.getElementById('dealTitleEn').value,
        image: document.getElementById('dealImage').value,
        description_ar: document.getElementById('dealDescAr').value,
        description_en: document.getElementById('dealDescEn').value,
        badge_ar: document.getElementById('dealBadgeAr').value,
        badge_en: document.getElementById('dealBadgeEn').value,
        expiry_date: document.getElementById('dealExpiry').value,
        project_id: projectId
    };
    let error;
    if (id) error = (await supabase.from('deals').update(payload).eq('id', id)).error;
    else error = (await supabase.from('deals').insert(payload)).error;
    if (error) showToast(error.message, true);
    else { showToast('تم حفظ العرض'); document.getElementById('dealModal').classList.remove('active'); loadDeals(); loadStats(); }
}

async function exportOrdersCSV() {
    const { data } = await supabase.from('admin_order_logs').select('*').order('created_at', { ascending: false });
    if (!data) return;
    let csvRows = [['رقم الطلب','اسم المشروع','رقم واتساب العميل','المواد (JSON)','الإجمالي','التاريخ','جلسة العميل']];
    data.forEach(order => {
        csvRows.push([
            order.order_number,
            order.project_name,
            order.customer_whatsapp,
            JSON.stringify(order.items),
            order.total_price,
            order.created_at,
            order.customer_session
        ]);
    });
    const csvContent = csvRows.map(row => row.join(',')).join('\n');
    const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute('download', 'orders_export.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

async function loadLicenseRequests() {
    const status = document.getElementById('licenseStatusFilter').value;
    let query = supabase
        .from('project_license_requests')
        .select(`
            *,
            projects (
                id,
                name_ar,
                name_en,
                owner_user_id,
                license_status
            )
        `)
        .order('created_at', { ascending: false });
    if (status !== 'all') query = query.eq('status', status);
    const { data, error } = await query;
    if (error) { console.error(error); showToast('خطأ في تحميل طلبات التراخيص', true); return; }
    let html = `<table class="data-table"><thead>
        <tr><th>المشروع</th><th>صاحب المشروع</th><th>ملف الرخصة</th><th>الحالة</th><th>تاريخ الرفع</th><th>الإجراءات</th>
        </tr></thead><tbody>`;
    for (const req of (data || [])) {
        const project = req.projects;
        const projectName = project?.name_ar || 'مشروع محذوف';
        const ownerId = project?.owner_user_id || 'غير معروف';
        let statusText = '';
        let badgeClass = '';
        if (req.status === 'pending') { statusText = 'قيد المراجعة'; badgeClass = 'badge-pending'; }
        else if (req.status === 'approved') { statusText = 'موافق'; badgeClass = 'badge-approved'; }
        else if (req.status === 'rejected') { statusText = 'مرفوض'; badgeClass = 'badge-rejected'; }
        html += `<tr>
            <td>${escapeHtml(projectName)}</td>
            <td>${escapeHtml(ownerId)}</td>
            <td><a href="${req.license_file_url}" target="_blank" class="btn-outline" style="padding:4px 12px; text-decoration:none;">📄 عرض الملف</a></td>
            <td><span class="badge ${badgeClass}">${statusText}</span></td>
            <td>${new Date(req.created_at).toLocaleString()}</td>
            <td class="action-buttons">
                <button class="action-btn edit" onclick="window.reviewLicense('${req.id}', 'approve')" title="قبول"><i class="fas fa-check-circle"></i></button>
                <button class="action-btn delete" onclick="window.reviewLicense('${req.id}', 'reject')" title="رفض"><i class="fas fa-times-circle"></i></button>
            </td>
        </tr>`;
    }
    html += `</tbody>`;
    document.getElementById('licensesTableContainer').innerHTML = html;
}

window.reviewLicense = async (requestId, action) => {
    const newStatus = (action === 'approve') ? 'approved' : 'rejected';
    const projectLicenseStatus = (action === 'approve') ? 'license_approved' : 'license_rejected';
    // تحديث حالة الطلب
    const { error: updateReq } = await supabase
        .from('project_license_requests')
        .update({ status: newStatus })
        .eq('id', requestId);
    if (updateReq) { showToast(updateReq.message, true); return; }
    // الحصول على project_id
    const { data: reqData } = await supabase
        .from('project_license_requests')
        .select('project_id')
        .eq('id', requestId)
        .single();
    if (reqData && reqData.project_id) {
        await supabase
            .from('projects')
            .update({ license_status: projectLicenseStatus })
            .eq('id', reqData.project_id);
    }
    showToast(`تم ${action === 'approve' ? 'قبول' : 'رفض'} الرخصة بنجاح`);
    loadLicenseRequests();
    loadStats();  // تحديث الإحصائيات
};

            <p><strong>المشروع:</strong> ${escapeHtml(ticket.projects?.name_ar || '?')}</p>
            <p><strong>الموضوع:</strong> ${escapeHtml(ticket.subject)}</p>
            <p><strong>الرسالة:</strong><br>${escapeHtml(ticket.message)}</p>
            <p><strong>التاريخ:</strong> ${new Date(ticket.created_at).toLocaleString()}</p>
            ${ticket.admin_reply ? `<div style="background:#f0f0f0; padding:12px; border-radius:16px; margin-top:15px;"><strong>رد الإدارة السابق:</strong><br>${escapeHtml(ticket.admin_reply)}</div>` : ''}
        </div>
        <div class="form-row"><label>الرد الجديد (اتركه فارغاً إذا لم ترد)</label><textarea id="ticketReplyText" rows="4"></textarea></div>
        <div class="form-row"><label>تغيير الحالة</label>
            <select id="ticketStatusSelect">
                <option value="open" ${ticket.status === 'open' ? 'selected' : ''}>مفتوحة</option>
                <option value="in_progress" ${ticket.status === 'in_progress' ? 'selected' : ''}>قيد المعالجة</option>
                <option value="closed" ${ticket.status === 'closed' ? 'selected' : ''}>مغلقة</option>
            </select>
        </div>
        <div class="action-buttons">
            <button class="btn-save" onclick="submitTicketReply('${ticket.id}')">حفظ التغييرات</button>
        </div>
    `;
    document.getElementById('ticketReplyBody').innerHTML = replyHtml;
    document.getElementById('ticketReplyModal').classList.add('active');
};

window.submitTicketReply = async (id) => {
    const reply = document.getElementById('ticketReplyText').value;
    const newStatus = document.getElementById('ticketStatusSelect').value;
    const updateData = { status: newStatus };
    if (reply.trim()) updateData.admin_reply = reply;
    const { error } = await supabase.from('support_tickets').update(updateData).eq('id', id);
    if (error) { showToast(error.message, true); return; }
    showToast('تم تحديث التذكرة');
    document.getElementById('ticketReplyModal').classList.remove('active');
    loadSupportTickets();
};

// ==================== تهيئة القوائم ====================
async function initEmirateFilter() {
    const { data } = await supabase.from('projects').select('emirate');
    const unique = [...new Set((data||[]).map(p=>p.emirate).filter(Boolean))];
    const select = document.getElementById('projectEmirateFilter');
    select.innerHTML = '<option value="">كل الإمارات</option>';
    unique.forEach(e => { let opt = document.createElement('option'); opt.value = e; opt.textContent = e; select.appendChild(opt); });
}
async function initProjectSelects() {
    const { data } = await supabase.from('projects').select('id, name_ar');
    if (!data) return;
    const fillSelect = (id) => {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">اختر المشروع</option>';
        data.forEach(p => { let opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name_ar; sel.appendChild(opt); });
    };
    fillSelect('productProjectFilter');
    fillSelect('dealProjectFilter');
    fillSelect('contactProjectFilter');
    const ordersFilter = document.getElementById('ordersProjectFilter');
    if (ordersFilter) {
        ordersFilter.innerHTML = '<option value="">كل المشاريع</option>';
        data.forEach(p => { let opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name_ar; ordersFilter.appendChild(opt); });
    }
}
function fillCategoryDropdowns() {
    const projectCatAr = document.getElementById('projectCategoryAr');
    const projectCatEn = document.getElementById('projectCategoryEn');
    if (projectCatAr) projectCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c => `<option value="${c}">${c}</option>`).join('');
    if (projectCatEn) projectCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c => `<option value="${c}">${c}</option>`).join('');
    const prodCatAr = document.getElementById('productCategoryAr');
    const prodCatEn = document.getElementById('productCategoryEn');
    if (prodCatAr) prodCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c => `<option value="${c}">${c}</option>`).join('');
    if (prodCatEn) prodCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c => `<option value="${c}">${c}</option>`).join('');
}
function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }

function attachTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.content-card').forEach(c=>c.classList.remove('active'));
            const tabId = btn.dataset.tab;
            document.getElementById(tabId + 'Tab').classList.add('active');
            if (tabId === 'projects') loadProjects(1);
            else if (tabId === 'products') loadProducts();
            else if (tabId === 'deals') loadDeals();
            else if (tabId === 'contacts') loadContacts();
            else if (tabId === 'feedbacks') loadFeedbacks();
            else if (tabId === 'registrations') loadRegistrations(1);
            else if (tabId === 'orders') loadOrders(1);
            else if (tabId === 'licenses') loadLicenseRequests();
            else if (tabId === 'support') loadSupportTickets();
        });
    });
}

async function saveProject(e) {
    e.preventDefault();
    const id = document.getElementById('projectId').value;
    const payload = {
        name_ar: document.getElementById('projectNameAr').value,
        name_en: document.getElementById('projectNameEn').value,
        emirate: document.getElementById('projectEmirate').value,
        image: document.getElementById('projectImage').value,
        description_ar: document.getElementById('projectDescAr').value,
        description_en: document.getElementById('projectDescEn').value,
        long_description_ar: document.getElementById('projectLongDescAr').value,
        long_description_en: document.getElementById('projectLongDescEn').value,
        adra_license: document.getElementById('projectLicense').checked,
        status: document.getElementById('projectStatus').value,
        category_ar: document.getElementById('projectCategoryAr').value,
        category_en: document.getElementById('projectCategoryEn').value
    };
    let error;
    if (id) error = (await supabase.from('projects').update(payload).eq('id', id)).error;
    else error = (await supabase.from('projects').insert(payload)).error;
    if (error) showToast(error.message, true);
    else { showToast('تم حفظ المشروع'); document.getElementById('projectModal').classList.remove('active'); loadProjects(); loadStats(); }
}

async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session && session.user.email === ALLOWED_EMAIL) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        fillCategoryDropdowns();
        await initEmirateFilter();
        await initProjectSelects();
        await loadStats();
        await loadProjects(1);
        await loadRegistrations(1);
        await loadProducts();
        await loadDeals();
        await loadContacts();
        await loadFeedbacks();
        await loadOrders(1);
        await loadLicenseRequests();
        await loadSupportTickets();
        attachTabs();
    }
}

    const email = document.getElementById('adminEmail').value;
    const pwd = document.getElementById('adminPassword').value;
    const { error, data } = await supabase.auth.signInWithPassword({ email, password: pwd });
    if (error || data.user.email !== ALLOWED_EMAIL) document.getElementById('loginError').innerText = 'بيانات الدخول غير صحيحة';
    else checkSession();
};

document.getElementById('forgotPasswordLink')?.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    if (!email || !email.includes('@')) { alert('الرجاء إدخال البريد الإلكتروني أولاً'); return; }
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: 'https://souqalmasharie.onrender.com/reset-password.html' });
    if (error) alert('حدث خطأ: ' + error.message);
    else alert('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
