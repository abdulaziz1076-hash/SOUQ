                document.getElementById('licensesPagination').innerHTML = totalPages > 1 ? pagHtml : '';

            } catch (e) {
                showToast(e.message, true);
                console.error('loadLicenseRequests error:', e);
            } finally {
                state.isLoading = false;
            }
        }

        window.reviewLicense = async (requestId, action) => {
            const newStatus = (action === 'approve') ? 'approved' : 'rejected';
            const { error: updateReq } = await supabase.from('project_license_requests').update({ status: newStatus }).eq('id',
                requestId);
            if (updateReq) { showToast(updateReq.message, true); return; }

            const { data: reqData, error: reqFetchError } = await supabase.from('project_license_requests').select('project_id')
                .eq('id', requestId)
                .single();
            if (reqFetchError) { showToast(reqFetchError.message, true); return; }
            if (reqData && reqData.project_id) {
                const projectLicenseStatus = (action === 'approve') ? 'license_approved' : 'license_rejected';
                const projUpdate = {
                    license_status: projectLicenseStatus,
                    license_reviewed_at: new Date().toISOString()
                };
                if (action === 'reject') {
                    const reason = prompt('سبب الرفض (اختياري):') || '';
                    projUpdate.rejection_reason = reason.trim() || null;
                } else {
                    projUpdate.rejection_reason = null;
                }
                const { error: projErr } = await supabase.from('projects').update(projUpdate).eq('id', reqData.project_id);
                if (projErr) { showToast(projErr.message, true); return; }
            }
            showToast(`تم ${action === 'approve' ? 'قبول' : 'رفض'} الرخصة بنجاح`);
            await loadLicenseRequests(state.currentLicensesPage);
            await loadProjects(state.currentProjectsPage);
            await loadStats();
        };

        // ===== LOAD SUPPORT TICKETS =====
        async function loadSupportTickets(page = 1) {
            if (state.isLoading) return;
            state.isLoading = true;
            state.currentSupportPage = page;
            try {
                const status = document.getElementById('supportStatusFilter').value;
                let query = supabase
                    .from('support_tickets')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                if (status !== 'all') query = query.eq('status', status);

                const { data, error, count } = await query;
                if (error) throw error;
                state.supportTotal = count || 0;
                const container = document.getElementById('supportTicketsContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-data">لا توجد تذاكر دعم</div>';
                    document.getElementById('supportPagination').innerHTML = '';
                    return;
                }

                const projectIds = [...new Set(data.map(t => t.project_id))];
                const { data: projectsData } = await supabase.from('projects').select('id, name_ar').in('id', projectIds);
                const projectMap = {};
                if (projectsData) {
                    projectsData.forEach(p => { projectMap[p.id] = p.name_ar; });
                }

                let html = `<div class="table-wrapper"><table class="data-table"><thead><tr>
                    <th>#</th><th>المشروع</th><th>الموضوع</th><th>الحالة</th><th>التاريخ</th><th>الإجراءات</th>
                </tr></thead><tbody>`;
                for (const ticket of data) {
                    const projectName = projectMap[ticket.project_id] || 'غير معروف';
                    const statusClass = ticket.status === 'open' ? 'badge-pending' : (ticket.status === 'in_progress' ?
                        'badge-in_progress' : 'badge-closed');
                    const statusText = ticket.status === 'open' ? 'مفتوحة' : (ticket.status === 'in_progress' ?
                        'قيد المعالجة' : 'مغلقة');

                    html += `<tr>
                        <td>${escapeHtml(ticket.id)}</td>
                        <td>${escapeHtml(projectName)}</td>
                        <td>${escapeHtml(ticket.subject)}</td>
                        <td><span class="badge ${statusClass}">${statusText}</span></td>
                        <td>${ticket.created_at ? new Date(ticket.created_at).toLocaleString() : '-'}</td>
                        <td><button class="view-details-btn" onclick="window.viewSupportTicket('${escapeHtml(ticket.id)}')">رد/عرض</button></td>
                    </tr>`;
                }
                html += `</tbody></table></div>`;
                container.innerHTML = html;

                const totalPages = Math.ceil(state.supportTotal / LIMIT);
                let pagHtml = '<div class="pagination">';
                for (let i = 1; i <= totalPages; i++) pagHtml +=
                    `<button onclick="window.loadSupportTickets(${i})" ${i === page ? 'class="active"' : ''}>${i}</button>`;
                pagHtml += '</div>';
                document.getElementById('supportPagination').innerHTML = totalPages > 1 ? pagHtml : '';

            } catch (e) {
                showToast(e.message, true);
                console.error('loadSupportTickets error:', e);
            } finally {
                state.isLoading = false;
            }
        }

        window.viewSupportTicket = async (id) => {
            const { data: ticket, error } = await supabase.from('support_tickets').select('*').eq('id', id).single();
            if (error || !ticket) { showToast('خطأ في جلب التذكرة', true); return; }
            document.getElementById('ticketReplyBody').innerHTML = `
                <div style="margin-bottom:20px;">
                    <p><strong>Project ID:</strong> ${escapeHtml(ticket.project_id || '?')}</p>
                    <p><strong>الموضوع:</strong> ${escapeHtml(ticket.subject)}</p>
                    <p><strong>الرسالة:</strong><br>${escapeHtml(ticket.message)}</p>
                    <p><strong>التاريخ:</strong> ${ticket.created_at ? new Date(ticket.created_at).toLocaleString() : '-'}</p>
                    ${ticket.admin_reply ? `<div style="background:#f0f0f0; padding:12px; border-radius:16px; margin-top:15px;"><strong>رد الإدارة السابق:</strong><br>${escapeHtml(ticket.admin_reply)}</div>` : ''}
                </div>
                <div style="display:grid; gap:10px;">
                    <textarea id="ticketReplyText" rows="4" placeholder="الرد الجديد (اتركه فارغاً إذا لم ترد)" style="padding:12px 16px; border-radius:20px; border:1px solid #dce5ec; font-family:inherit;"></textarea>
                    <select id="ticketStatusSelect" style="padding:12px 16px; border-radius:60px; border:1px solid #dce5ec; font-family:inherit;">
                        <option value="open" ${ticket.status === 'open' ? 'selected' : ''}>مفتوحة</option>
                        <option value="in_progress" ${ticket.status === 'in_progress' ? 'selected' : ''}>قيد المعالجة</option>
                        <option value="closed" ${ticket.status === 'closed' ? 'selected' : ''}>مغلقة</option>
                    </select>
                </div>
                <button class="login-btn" style="width:100%; margin-top:12px;" onclick="window.submitTicketReply('${escapeHtml(ticket.id)}')">حفظ التغييرات</button>
            `;
            document.getElementById('ticketReplyModal').classList.add('active');
        };

        window.submitTicketReply = async (id) => {
            const reply = document.getElementById('ticketReplyText').value;
            const newStatus = document.getElementById('ticketStatusSelect').value;
            const updateData = { status: newStatus };
            if (reply.trim()) updateData.admin_reply = reply;
            const { error } = await supabase.from('support_tickets').update(updateData).eq('id', id);
            if (error) { showToast(error.message, true); return; }
            showToast('تم تحديث التذكرة');
            document.getElementById('ticketReplyModal').classList.remove('active');
            loadSupportTickets(state.currentSupportPage);
        };

        // ===== INIT FILTERS =====
        async function initEmirateFilter() {
            const { data } = await supabase.from('projects').select('emirate');
            const unique = [...new Set((data || []).map(p => p.emirate).filter(Boolean))];
            const select = document.getElementById('projectEmirateFilter');
            select.innerHTML = '<option value="">كل الإمارات</option>';
            unique.forEach(e => { const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                select.appendChild(opt); });
        }

        async function initProjectSelects() {
            const { data } = await supabase.from('projects').select('id, name_ar').order('id', { ascending: false });
            if (!data) return;
            const fillSelect = (id) => {
                const sel = document.getElementById(id);
                if (!sel) return;
                sel.innerHTML = '<option value="">اختر المشروع</option>';
                data.forEach(p => { const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name_ar;
                    sel.appendChild(opt); });
            };
            fillSelect('productProjectFilter');
            fillSelect('dealProjectFilter');
            fillSelect('contactProjectFilter');
            const ordersFilter = document.getElementById('ordersProjectFilter');
            if (ordersFilter) {
                ordersFilter.innerHTML = '<option value="">كل المشاريع</option>';
                data.forEach(p => { const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name_ar;
                    ordersFilter.appendChild(opt); });
            }
        }

        function fillCategoryDropdowns() {
            const projectCatAr = document.getElementById('projectCategoryAr');
            const projectCatEn = document.getElementById('projectCategoryEn');
            if (projectCatAr) projectCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c =>
                `<option value="${c}">${c}</option>`).join(
                '');
            if (projectCatEn) projectCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c =>
                `<option value="${c}">${c}</option>`)
                .join('');
            const prodCatAr = document.getElementById('productCategoryAr');
            const prodCatEn = document.getElementById('productCategoryEn');
            if (prodCatAr) prodCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c =>
                `<option value="${c}">${c}</option>`).join(
                '');
            if (prodCatEn) prodCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c =>
                `<option value="${c}">${c}</option>`)
                .join('');
        }

        // ===== TABS =====
        function attachTabs() {
            const tabMap = {
                'projects': () => loadProjects(1),
                'products': loadProducts,
                'deals': loadDeals,
                'contacts': loadContacts,
                'feedbacks': loadFeedbacks,
                'orders': () => loadOrders(1),
                'licenses': loadLicenseRequests,
                'support': loadSupportTickets
            };
            const refreshMap = {
                'refreshProjectsBtn': () => loadProjects(1),
                'refreshProductsBtn': loadProducts,
                'refreshDealsBtn': loadDeals,
                'refreshContactsBtn': loadContacts,
                'refreshFeedbacksBtn': loadFeedbacks,
                'refreshOrdersBtn': () => loadOrders(1),
                'refreshLicensesBtn': loadLicenseRequests,
                'refreshSupportBtn': loadSupportTickets
            };

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.content-card').forEach(c => c.classList.remove('active'));
                    const tabId = btn.dataset.tab;
                    document.getElementById(tabId + 'Tab').classList.add('active');
                    state.currentTab = tabId;
                    const loadFn = tabMap[tabId];
                    if (loadFn) loadFn();
                });
            });

            Object.keys(refreshMap).forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', () => { const fn = refreshMap[id]; if (fn) fn(); });
            });

            // Export buttons
            const exportMap = {
                'exportOrdersBtn': exportOrdersCSV,
                'exportProjectsBtn': exportProjectsCSV,
                'exportProductsBtn': exportProductsCSV,
                'exportDealsBtn': exportDealsCSV,
                'exportLicensesBtn': exportLicensesCSV,
                'exportSupportBtn': exportSupportCSV
            };
            Object.keys(exportMap).forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', () => { const fn = exportMap[id]; if (fn) fn(); });
            });
        }

        // ===== SAVE PROJECT =====
        async function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const payload = {
                name_ar: document.getElementById('projectNameAr').value,
                name_en: document.getElementById('projectNameEn').value,
                emirate: document.getElementById('projectEmirate').value,
                image: document.getElementById('projectImage').value,
                description_ar: document.getElementById('projectDescAr').value,
                description_en: document.getElementById('projectDescEn').value,
                long_description_ar: document.getElementById('projectLongDescAr').value,
                long_description_en: document.getElementById('projectLongDescEn').value,
                adra_license: document.getElementById('projectLicense').checked,
                status: document.getElementById('projectStatus').value,
                category_ar: document.getElementById('projectCategoryAr').value,
                category_en: document.getElementById('projectCategoryEn').value
            };
            let error;
            if (id) error = (await supabase.from('projects').update(payload).eq('id', id)).error;
            else error = (await supabase.from('projects').insert(payload)).error;
            if (error) showToast(error.message, true);
            else { showToast('تم حفظ المشروع');
                document.getElementById('projectModal').classList.remove('active');
                loadProjects(state.currentProjectsPage);
                loadStats();
                initProjectSelects(); }
        }

        // ===== EVENTS =====
        document.getElementById('addProjectBtn').onclick = () => {
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            document.getElementById('projectStatus').value = 'active';
            document.getElementById('projectModal').classList.add('active');
        };
        document.getElementById('addProductBtn').onclick = () => {
            const pid = document.getElementById('productProjectFilter').value;
            if (!pid) { showToast('اختر مشروعاً أولاً', true); return; }
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productProjectId').value = pid;
            state.currentVariants = [];
            renderVariants();
            document.getElementById('productModal').classList.add('active');
        };
        document.getElementById('addDealBtn').onclick = () => {
            const pid = document.getElementById('dealProjectFilter').value;
            if (!pid) { showToast('اختر مشروعاً', true); return; }
            document.getElementById('dealForm').reset();
            document.getElementById('dealId').value = '';
            document.getElementById('dealProjectId').value = pid;
            document.getElementById('dealModal').classList.add('active');
        };
        document.getElementById('reorderProductsBtn').onclick = () => window.reorderAllProducts();

        document.getElementById('productProjectFilter').addEventListener('change', () => loadProducts());
        document.getElementById('dealProjectFilter').addEventListener('change', () => loadDeals());
        document.getElementById('contactProjectFilter').addEventListener('change', () => loadContacts());

        document.getElementById('projectSearch').addEventListener('input', () => loadProjects(1));
        document.getElementById('projectEmirateFilter').addEventListener('change', () => loadProjects(1));
        document.getElementById('projectStatusFilter').addEventListener('change', () => loadProjects(1));
        document.getElementById('feedbackStatusFilter').addEventListener('change', () => loadFeedbacks());
        document.getElementById('ordersSearch').addEventListener('input', () => loadOrders(1));
        document.getElementById('ordersProjectFilter').addEventListener('change', () => loadOrders(1));
        document.getElementById('licenseStatusFilter').addEventListener('change', () => loadLicenseRequests(1));
        document.getElementById('supportStatusFilter').addEventListener('change', () => loadSupportTickets(1));

        document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', () => {
            document.getElementById(btn.dataset.modal).classList.remove('active');
        }));
        window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.classList.remove('active'); };

        document.getElementById('projectForm').addEventListener('submit', saveProject);
        document.getElementById('productForm').addEventListener('submit', saveProduct);
        document.getElementById('dealForm').addEventListener('submit', saveDeal);

        // ===== REFRESH ALL =====
        document.getElementById('refreshAllBtn').addEventListener('click', () => {
            loadStats();
            loadProjects(state.currentProjectsPage);
            loadOrders(state.currentOrdersPage);
            loadProducts();
            loadDeals();
            loadContacts();
            loadFeedbacks();
            loadLicenseRequests(state.currentLicensesPage);
            loadSupportTickets(state.currentSupportPage);
            showToast('تم تحديث جميع البيانات');
        });

        // ===== LOGIN =====
        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value;
            const pwd = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerText = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                if (error) throw new Error(error.message);
                if (data?.user?.email !== ALLOWED_EMAIL) {
                    await supabase.auth.signOut();
                    throw new Error('غير مصرح لك بالدخول إلى لوحة التحكم');
                }

                // التحقق من وجود المستخدم في جدول admin_users
                const { data: adminCheck, error: adminError } = await supabase
                    .from('admin_users')
                    .select('user_id')
                    .eq('user_id', data.user.id)
                    .maybeSingle();

                if (adminError) {
                    console.warn('Admin check error:', adminError);
                }

                if (!adminCheck) {
                    const { error: insertError } = await supabase
                        .from('admin_users')
                        .insert({ user_id: data.user.id });
                    if (insertError) {
                        console.warn('Failed to auto-add admin user:', insertError);
                    } else {
                        showToast('✅ تم تسجيلك كمسؤول بنجاح');
                    }
                }

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';

                fillCategoryDropdowns();
                await loadProjectsMap();
                await initEmirateFilter();
                await initProjectSelects();
                await loadStats();
                await loadProjects(1);
                await loadProducts();
                await loadDeals();
                await loadContacts();
                await loadFeedbacks();
                await loadOrders(1);
                await loadLicenseRequests(1);
                await loadSupportTickets(1);
                attachTabs();

            } catch (err) {
                errorDiv.innerText = err.message || 'بيانات الدخول غير صحيحة';
                console.error('Login error:', err);
            }
        };

        document.getElementById('logoutBtn').onclick = async () => {
            await supabase.auth.signOut();
            location.reload();
        };

        document.getElementById('forgotPasswordLink')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            if (!email || !email.includes('@')) { alert('الرجاء إدخال البريد الإلكتروني أولاً'); return; }
            const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin +
                    '/reset-password.html' });
            if (error) alert('حدث خطأ: ' + error.message);
            else alert('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
        });

        // ===== SESSION CHECK =====
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user?.email === ALLOWED_EMAIL) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                fillCategoryDropdowns();
                await loadProjectsMap();
                await initEmirateFilter();
                await initProjectSelects();
                await loadStats();
                await loadProjects(1);
                await loadProducts();
                await loadDeals();
                await loadContacts();
                await loadFeedbacks();
                await loadOrders(1);
                await loadLicenseRequests(1);
                await loadSupportTickets(1);
                attachTabs();
            }
        }

        checkSession();

        // ===== GLOBAL EXPOSURE =====
        window.loadProjects = loadProjects;
        window.loadProducts = loadProducts;
        window.loadOrders = loadOrders;
        window.loadLicenseRequests = loadLicenseRequests;
        window.loadSupportTickets = loadSupportTickets;
        window.editProject = editProject;
        window.editProduct = editProduct;
        window.editDeal = editDeal;
        window.deleteItem = deleteItem;
        window.updateFeedbackStatus = updateFeedbackStatus;
        window.reviewLicense = reviewLicense;
        window.showOrderDetails = showOrderDetails;
        window.viewSupportTicket = viewSupportTicket;
        window.submitTicketReply = submitTicketReply;
        window.reorderAllProducts = reorderAllProducts;
        window.updateOrderStatus = updateOrderStatus;
        window.saveNewOrder = saveNewOrder;
        window.togglePaid = togglePaid;
        window.toggleStatus = toggleStatus;

        // ===== EDIT PROJECT =====
        window.editProject = async (id) => {
            const { data } = await supabase.from('projects').select('*').eq('id', id).single();
            if (!data) return;
            document.getElementById('projectId').value = data.id;
            document.getElementById('projectNameAr').value = data.name_ar || '';
            document.getElementById('projectNameEn').value = data.name_en || '';
            document.getElementById('projectEmirate').value = data.emirate || '';
            document.getElementById('projectImage').value = data.image || '';
            document.getElementById('projectDescAr').value = data.description_ar || '';
            document.getElementById('projectDescEn').value = data.description_en || '';
            document.getElementById('projectLongDescAr').value = data.long_description_ar || '';
            document.getElementById('projectLongDescEn').value = data.long_description_en || '';
            document.getElementById('projectStatus').value = data.status || 'active';
            document.getElementById('projectLicense').checked = data.adra_license || false;
            if (document.getElementById('projectCategoryAr')) document.getElementById('projectCategoryAr').value = data.category_ar ||
                '';
            if (document.getElementById('projectCategoryEn')) document.getElementById('projectCategoryEn').value = data.category_en ||
                '';
            document.getElementById('projectModal').classList.add('active');
        };
    </script>
</body>
</html>
