<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>لوحة تحكم المشرف – سوق المشاريع</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=El+Messiri:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f4f7fb;
            font-family: 'Almarai', 'Tajawal', sans-serif;
            color: #1a2e3f;
            direction: rtl;
            min-height: 100vh;
        }
        .admin-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ===== LOGIN ===== */
        #loginSection {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0a2e25, #1a5f44);
            position: relative;
        }
        #loginSection::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4AF37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        .login-card {
            background: #ffffff;
            border-radius: 60px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.25);
            position: relative;
            z-index: 1;
        }
        .login-card .icon {
            font-size: 64px;
            color: #D4AF37;
            margin-bottom: 16px;
        }
        .login-card h2 {
            color: #0a2e25;
            font-size: 26px;
            font-weight: 800;
        }
        .login-card p {
            color: #5f7f9a;
            margin-bottom: 28px;
        }
        .login-card input {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border-radius: 60px;
            border: 1px solid #dce5ec;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
            background: #f9fcff;
        }
        .login-card input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }
        .login-btn {
            background: linear-gradient(135deg, #0a2e25, #1a5f44);
            color: #fff;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 700;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #D4AF37;
        }
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
        .login-error {
            color: #dc2626;
            margin-top: 16px;
            font-size: 13px;
        }
        .forgot-link {
            color: #D4AF37;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-top: 14px;
        }

        /* ===== HEADER ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border-radius: 60px;
            padding: 14px 32px;
            margin-bottom: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #e6edf2;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-area .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0a2e25, #1a5f44);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            font-size: 24px;
            border: 1px solid #D4AF37;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0a2e25;
            letter-spacing: -0.5px;
        }
        .logo-area span {
            font-size: 12px;
            color: #5f7f9a;
            font-weight: 400;
            display: block;
            margin-top: -2px;
        }
        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary {
            background: #0a2e25;
            color: #fff;
            border: 1px solid #D4AF37;
        }
        .btn-primary:hover {
            background: #1a5f44;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(10, 46, 37, 0.2);
        }
        .btn-gold {
            background: #D4AF37;
            color: #0a2e25;
            border: 1px solid #D4AF37;
        }
        .btn-gold:hover {
            background: #c49b2a;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
            border: 1px solid #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #0a2e25;
            border: 1px solid #0a2e25;
        }
        .btn-outline:hover {
            background: #0a2e25;
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 22px 20px;
            border: 1px solid #e6edf2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            border-color: #D4AF37;
        }
        .stat-card .icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #0a2e25, #1a5f44);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .stat-card .icon i {
            font-size: 26px;
            color: #D4AF37;
        }
        .stat-number {
            font-size: 34px;
            font-weight: 800;
            color: #0a2e25;
            line-height: 1.1;
        }
        .stat-label {
            font-size: 14px;
            color: #5f7f9a;
            margin-top: 4px;
            font-weight: 500;
        }
        .stat-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(212, 175, 55, 0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 10px;
            font-weight: 700;
            color: #0a2e25;
        }

        /* ===== TABS ===== */
        .tabs-container {
            background: #ffffff;
            border-radius: 60px;
            padding: 6px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border: 1px solid #e6edf2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            color: #2c4e6e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            font-family: inherit;
        }
        .tab-btn i {
            font-size: 15px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #0a2e25, #1a5f44);
            color: #fff;
            box-shadow: 0 8px 20px rgba(10, 46, 37, 0.2);
        }
        .tab-btn:hover:not(.active) {
            background: #eef5f9;
        }

        /* ===== CONTENT CARDS ===== */
        .content-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 28px 24px;
            border: 1px solid #e6edf2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .content-card.active {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .filter-bar input,
        .filter-bar select {
            padding: 8px 16px;
            border: 1px solid #dce5ec;
            border-radius: 60px;
            background: #f9fcff;
            font-family: inherit;
            font-size: 13px;
            min-width: 140px;
            transition: 0.2s;
        }
        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: #D4AF37;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            background: #fff;
        }
        .filter-bar .btn {
            padding: 8px 18px;
            font-size: 13px;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            overflow-x: auto;
            margin: 0 -4px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 700px;
        }
        .data-table th,
        .data-table td {
            padding: 14px 12px;
            text-align: right;
            border-bottom: 1px solid #eef3f7;
            vertical-align: middle;
        }
        .data-table th {
            background: #f8fbfd;
            font-weight: 800;
            color: #0a2e25;
            font-size: 12px;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .data-table tr:hover td {
            background: #fafdff;
        }
        .data-table .no-data {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        /* ===== BADGES ===== */
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }
        .badge-reviewed { background: #dbeafe; color: #1e40af; }
        .badge-resolved { background: #d9f99d; color: #3f6212; }
        .badge-open { background: #fef3c7; color: #d97706; }
        .badge-closed { background: #e5e7eb; color: #4b5563; }
        .badge-in_progress { background: #dbeafe; color: #1d4ed8; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-disabled { background: #fee2e2; color: #991b1b; }
        .badge-deleted { background: #e5e7eb; color: #4b5563; }

        /* ===== THUMBNAILS ===== */
        .thumb-preview {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: 0.2s;
        }
        .thumb-preview:hover {
            transform: scale(1.08);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            border-radius: 12px;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .action-btn.approve { color: #065f46; background: #d1fae5; }
        .action-btn.approve:hover { background: #a7f3d0; transform: scale(1.05); }
        .action-btn.reject { color: #991b1b; background: #fee2e2; }
        .action-btn.reject:hover { background: #fecaca; transform: scale(1.05); }
        .action-btn.edit { color: #1e40af; background: #dbeafe; }
        .action-btn.edit:hover { background: #bfdbfe; transform: scale(1.05); }
        .action-btn.delete { color: #dc2626; background: #fee9e9; }
        .action-btn.delete:hover { background: #fccaca; transform: scale(1.05); }
        .action-btn.view { color: #0a2e25; background: #f1f5f9; }
        .action-btn.view:hover { background: #e2e8f0; transform: scale(1.05); }

        /* ===== TOGGLE STATUS ===== */
        .toggle-status-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .toggle-status {
            position: relative;
            width: 50px;
            height: 26px;
            background: #dce5ec;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid #dce5ec;
            flex-shrink: 0;
        }
        .toggle-status.active {
            background: #0a2e25;
            border-color: #D4AF37;
        }
        .toggle-status .slider {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-status.active .slider {
            right: 24px;
            background: #D4AF37;
        }
        .toggle-status-label {
            font-size: 11px;
            font-weight: 700;
            color: #5f7f9a;
            min-width: 30px;
        }
        .toggle-status.active + .toggle-status-label {
            color: #0a2e25;
        }

        /* ===== DRAG & DROP ===== */
        .sortable-row {
            cursor: grab;
            transition: background 0.2s;
        }
        .sortable-row:active { cursor: grabbing; }
        .sortable-row.sortable-chosen {
            background: #fef9e6 !important;
            border: 1px solid #D4AF37;
        }
        .sortable-row.sortable-ghost { opacity: 0.4; }
        .drag-handle {
            cursor: grab;
            color: #D4AF37;
            font-size: 18px;
            padding: 0 6px;
            user-select: none;
            display: inline-block;
            vertical-align: middle;
        }
        .drag-handle:active { cursor: grabbing; }

        .save-order-btn {
            background: #0a2e25;
            color: #fff;
            border: 1px solid #D4AF37;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .save-order-btn:hover {
            background: #1a5f44;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(10, 46, 37, 0.15);
        }
        .save-order-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .order-status {
            margin-right: 16px;
            font-size: 13px;
            color: #5f7f9a;
        }

        .view-details-btn {
            background: #D4AF37;
            color: #0a2e25;
            border: none;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }
        .view-details-btn:hover {
            background: #c49b2a;
            transform: scale(1.05);
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #dce5ec;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
        }
        .pagination button:hover {
            background: #0a2e25;
            color: #fff;
            border-color: #0a2e25;
        }
        .pagination button.active {
            background: #0a2e25;
            color: #fff;
            border-color: #0a2e25;
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 36px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2);
            animation: fadeScale 0.25s ease;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 20px 28px;
            border-bottom: 1px solid #eef3f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 10;
            border-radius: 36px 36px 0 0;
        }
        .modal-header h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0a2e25;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-header h3 i {
            color: #D4AF37;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.2s;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .modal-close:hover {
            background: #f1f5f9;
            color: #0a2e25;
        }
        .modal-body {
            padding: 28px;
        }
        .modal-body p { margin-bottom: 8px; line-height: 1.7; }
        .modal-body strong { color: #0a2e25; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a2e25;
            color: #fff;
            padding: 14px 32px;
            border-radius: 60px;
            z-index: 3000;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: fadeUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
            border: 1px solid #D4AF37;
        }
        .toast.error {
            background: #dc2626;
            border-color: #dc2626;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .admin-wrapper { padding: 16px 12px; }
            .top-bar { flex-direction: column; align-items: stretch; text-align: center; }
            .top-actions { justify-content: center; }
            .tabs-container { border-radius: 30px; }
            .tab-btn { padding: 6px 14px; font-size: 11px; }
            .tab-btn i { font-size: 12px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; }
            .filter-bar input, .filter-bar select { width: 100%; min-width: unset; }
            .data-table th, .data-table td { font-size: 11px; padding: 8px 6px; }
            .stat-card .stat-number { font-size: 26px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .modal-content { max-width: 100%; border-radius: 24px; }
            .modal-body { padding: 16px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-card .stat-number { font-size: 22px; }
            .stat-card .icon { width: 40px; height: 40px; }
            .stat-card .icon i { font-size: 20px; }
            .login-card { padding: 30px 20px; }
        }

        .helper-text {
            font-size: 12px;
            color: #5f7f9a;
            margin-top: 8px;
        }
        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .gap-8 { gap: 8px; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
    </style>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';
        import { APP_CONFIG } from './config.js';

        const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
        const ALLOWED_EMAIL = 'abdulaziz1076@gmail.com';
        const LIMIT = 10;

        // ===== STATE =====
        const state = {
            currentProjectsPage: 1,
            projectsTotal: 0,
            currentOrdersPage: 1,
            ordersTotal: 0,
            currentLicensesPage: 1,
            licensesTotal: 0,
            currentSupportPage: 1,
            supportTotal: 0,
            currentVariants: [],
            currentTab: 'projects',
            isLoading: false,
            projectsMap: {}
        };

        const CATEGORIES_AR = ["أطعمة ومشروبات", "الرقميات", "روائح وعطور", "عناية", "حلويات", "تجميل", "ملابس", "يدويات", "هدايا", "عطارة", "فنون", "نباتات", "ترفيه"];
        const CATEGORIES_EN = ["Food & Beverages", "IT", "Scents & Perfumes", "Care", "Sweets", "Beauty", "Clothes", "Handmade", "Gifts", "Apothecary", "Arts", "Plants", "Entertainment"];

        // ===== TOAST =====
        function showToast(msg, isErr = false) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast' + (isErr ? ' error' : '');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeStatus(s) { return (s || '').toString().trim().toLowerCase(); }

        function mapProjectStatusToBadgeAndText(status) {
            const v = normalizeStatus(status);
            if (v === 'active') return { badge: 'badge-active', text: 'فعال' };
            if (v === 'disabled' || v === 'inactive') return { badge: 'badge-disabled', text: 'معطل' };
            if (v === 'deleted' || v === 'archived') return { badge: 'badge-deleted', text: 'محذوف' };
            if (v === 'pending') return { badge: 'badge-pending', text: 'معلق' };
            return { badge: 'badge-active', text: 'فعال' };
        }

        // ===== LOAD PROJECTS MAP =====
        async function loadProjectsMap() {
            const { data, error } = await supabase.from('projects').select('id, name_ar');
            if (error) {
                console.error('خطأ في جلب أسماء المشاريع:', error);
                return;
            }
            state.projectsMap = {};
            data.forEach(p => { state.projectsMap[p.id] = p.name_ar; });
        }

        // ===== LOAD STATS =====
        async function loadStats() {
            try {
                const [projects, products, feedbacks, orders] = await Promise.all([
                    supabase.from('projects').select('*', { count: 'exact', head: true }),
                    supabase.from('products').select('*', { count: 'exact', head: true }),
                    supabase.from('feedbacks').select('*', { count: 'exact', head: true }),
                    supabase.from('admin_order_logs').select('*', { count: 'exact', head: true })
                ]);

                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-card"><div class="icon"><i class="fas fa-store"></i></div><div class="stat-number">${projects.count||0}</div><div class="stat-label">المشاريع</div><span class="stat-badge">نشطة</span></div>
                    <div class="stat-card"><div class="icon"><i class="fas fa-box"></i></div><div class="stat-number">${products.count||0}</div><div class="stat-label">المنتجات</div><span class="stat-badge">معروضة</span></div>
                    <div class="stat-card"><div class="icon"><i class="fas fa-comment-dots"></i></div><div class="stat-number">${feedbacks.count||0}</div><div class="stat-label">الشكاوى</div><span class="stat-badge">وارد</span></div>
                    <div class="stat-card"><div class="icon"><i class="fas fa-truck"></i></div><div class="stat-number">${orders.count||0}</div><div class="stat-label">الطلبات</div><span class="stat-badge">مطلوب</span></div>
                `;
            } catch (e) {
                console.error('Stats error:', e);
                document.getElementById('statsContainer').innerHTML = `<div class="stat-card"><div class="icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-number">!</div><div class="stat-label">خطأ في التحميل</div></div>`;
            }
        }

        // ===== LOAD PROJECTS =====
        async function loadProjects(page = 1) {
            if (state.isLoading) return;
            state.isLoading = true;
            state.currentProjectsPage = page;

            try {
                let query = supabase
                    .from('projects')
                    .select('*', { count: 'exact' })
                    .order('display_order', { ascending: true, nullsFirst: false })
                    .order('id', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                const search = document.getElementById('projectSearch').value;
                if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);

                const emirate = document.getElementById('projectEmirateFilter').value;
                if (emirate) query = query.eq('emirate', emirate);

                const statusF = document.getElementById('projectStatusFilter').value;
                if (statusF) query = query.eq('status', statusF);

                const { data, error, count } = await query;
                if (error) throw error;

                state.projectsTotal = count || 0;
                const container = document.getElementById('projectsTableContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="no-data">لا توجد مشاريع</div>`;
                    document.getElementById('projectsPagination').innerHTML = '';
                    return;
                }

                let html = `<div class="table-wrapper"><table class="data-table"><thead><tr>
                    <th style="width:50px;">#</th>
                    <th>الصورة</th>
                    <th>الاسم (عربي)</th>
                    <th>التصنيف</th>
                    <th>الإمارة</th>
                    <th>الحالة</th>
                    <th>الترخيص</th>
                    <th>مميز</th>
                    <th>تفعيل</th>
                    <th>الإجراءات</th>
                </tr></thead><tbody id="projects-tbody">`;

                data.forEach((p, idx) => {
                    const st = mapProjectStatusToBadgeAndText(p.status);
                    const licenseStatusMap = {
                        'pending_license': 'قيد المراجعة',
                        'license_uploaded': 'تم الرفع',
                        'license_approved': 'معتمد',
                        'license_rejected': 'مرفوض',
                        'suspended': 'معلق'
                    };
                    const licenseDisplay = licenseStatusMap[p.license_status] || p.license_status || '-';
                    const isPaid = p.is_paid === true;
                    const isActive = p.status === 'active';

                    html += `<tr class="sortable-row" data-project-id="${p.id}">
                        <td>
                            <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                            <span class="order-number">${idx+1}</span>
                        </td>
                        <td>${p.image ? `<img src="${escapeHtml(p.image)}" class="thumb-preview" onclick="window.open('${escapeHtml(p.image)}')">` : '-'}</td>
                        <td>${escapeHtml(p.name_ar)}</td>
                        <td>${escapeHtml(p.category_ar || '-')}</td>
                        <td>${escapeHtml(p.emirate)}</td>
                        <td><span class="badge ${st.badge}">${st.text}</span></td>
                        <td><span class="badge ${p.license_status === 'license_approved' ? 'badge-approved' : 'badge-pending'}">${licenseDisplay}</span></td>
                        <td>
                            <div class="toggle-wrap">
                                <div class="toggle ${isPaid ? 'active' : ''}" 
                                     onclick="window.togglePaid('${p.id}')" 
                                     id="toggle_${p.id}">
                                    <div class="slider"></div>
                                </div>
                                <span class="toggle-label" id="label_${p.id}">${isPaid ? 'مميز' : 'عادي'}</span>
                            </div>
                        </td>
                        <td>
                            <div class="toggle-status-wrap">
                                <div class="toggle-status ${isActive ? 'active' : ''}" 
                                     onclick="window.toggleStatus('${p.id}')" 
                                     id="togglestatus_${p.id}">
                                    <div class="slider"></div>
                                </div>
                                <span class="toggle-status-label" id="statuslabel_${p.id}">${isActive ? 'فعال' : 'معطل'}</span>
                            </div>
                        </td>
                        <td class="action-buttons">
                            <button class="action-btn edit" onclick="window.editProject(${p.id})" title="تعديل"><i class="fas fa-edit"></i></button>
                            <button class="action-btn delete" onclick="window.deleteItem('projects',${p.id})" title="حذف نهائي"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML = html;

                // ===== Sortable =====
                const tbody = document.getElementById('projects-tbody');
                if (tbody) {
                    new Sortable(tbody, {
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        onEnd: function(evt) {
                            const rows = tbody.querySelectorAll('tr');
                            rows.forEach((row, index) => {
                                const td = row.querySelector('td:first-child');
                                if (td) {
                                    const handle = td.querySelector('.drag-handle');
                                    const numSpan = td.querySelector('.order-number');
                                    if (handle && numSpan) {
                                        td.innerHTML = '';
                                        td.appendChild(handle);
                                        td.appendChild(document.createTextNode(' '));
                                        const newSpan = document.createElement('span');
                                        newSpan.className = 'order-number';
                                        newSpan.textContent = index + 1;
                                        td.appendChild(newSpan);
                                    }
                                }
                            });
                        }
                    });
                }

                // ===== Pagination =====
                const totalPages = Math.ceil(state.projectsTotal / LIMIT);
                let pagHtml = '<div class="pagination">';
                for (let i = 1; i <= totalPages; i++) {
                    pagHtml += `<button onclick="window.loadProjects(${i})" ${i === page ? 'class="active"' : ''}>${i}</button>`;
                }
                pagHtml += '</div>';
                document.getElementById('projectsPagination').innerHTML = totalPages > 1 ? pagHtml : '';

            } catch (e) {
                showToast(e.message, true);
                console.error('loadProjects error:', e);
            } finally {
                state.isLoading = false;
            }
        }

        // ===== TOGGLE PAID =====
        window.togglePaid = async (id) => {
            const toggle = document.getElementById(`toggle_${id}`);
            const label = document.getElementById(`label_${id}`);
            if (!toggle || !label) return;
            const isActive = toggle.classList.contains('active');
            const newVal = !isActive;
            if (newVal) { toggle.classList.add('active');
                label.textContent = 'مميز'; } else { toggle.classList.remove('active');
                label.textContent = 'عادي'; }
            try {
                const { error } = await supabase.from('projects').update({ is_paid: newVal }).eq('id', id);
                if (error) throw error;
                showToast(`تم ${newVal ? 'تفعيل' : 'إلغاء'} التميز`);
                loadStats();
            } catch (err) {
                showToast(err.message, true);
                if (newVal) { toggle.classList.remove('active');
                    label.textContent = 'عادي'; } else { toggle.classList.add('active');
                    label.textContent = 'مميز'; }
            }
        };

        // ===== TOGGLE STATUS (Enable/Disable) =====
        window.toggleStatus = async (id) => {
            const toggle = document.getElementById(`togglestatus_${id}`);
            const label = document.getElementById(`statuslabel_${id}`);
            if (!toggle || !label) return;
            const isActive = toggle.classList.contains('active');
            const newStatus = isActive ? 'disabled' : 'active';
            const newLabel = isActive ? 'معطل' : 'فعال';
            if (isActive) {
                toggle.classList.remove('active');
                label.textContent = 'معطل';
            } else {
                toggle.classList.add('active');
                label.textContent = 'فعال';
            }
            try {
                const { error } = await supabase.from('projects').update({ status: newStatus }).eq('id', id);
                if (error) throw error;
                showToast(`تم ${newStatus === 'active' ? 'تفعيل' : 'تعطيل'} المشروع`);
                loadStats();
                // تحديث الصف مباشرة لتغيير شارة الحالة
                const row = document.querySelector(`tr[data-project-id="${id}"]`);
                if (row) {
                    const statusCell = row.querySelectorAll('td')[5];
                    if (statusCell) {
                        const st = mapProjectStatusToBadgeAndText(newStatus);
                        statusCell.innerHTML = `<span class="badge ${st.badge}">${st.text}</span>`;
                    }
                }
            } catch (err) {
                showToast(err.message, true);
                if (newStatus === 'active') {
                    toggle.classList.remove('active');
                    label.textContent = 'معطل';
                } else {
                    toggle.classList.add('active');
                    label.textContent = 'فعال';
                }
            }
        };

        // ===== SAVE ORDER =====
        async function saveNewOrder() {
            const tbody = document.getElementById('projects-tbody');
            if (!tbody) return;
            const rows = tbody.querySelectorAll('tr');
            if (rows.length === 0) return;
            const updates = [];
            rows.forEach((row, index) => {
                const id = row.dataset.projectId;
                if (id) updates.push({ id: parseInt(id), display_order: index + 1 });
            });
            if (updates.length === 0) return;
            const saveBtn = document.getElementById('saveOrderBtn');
            const statusSpan = document.getElementById('orderStatus');
            saveBtn.disabled = true;
            statusSpan.textContent = '⏳ جاري الحفظ...';
            try {
                const promises = updates.map(u => supabase.from('projects').update({ display_order: u.display_order }).eq('id',
                u.id));
                const results = await Promise.all(promises);
                const errors = results.filter(r => r.error);
                if (errors.length) throw new Error(errors[0].error.message);
                statusSpan.textContent = '✅ تم حفظ الترتيب!';
                showToast('تم تحديث ترتيب المشاريع');
                setTimeout(() => loadProjects(state.currentProjectsPage), 500);
            } catch (err) {
                statusSpan.textContent = '❌ فشل الحفظ: ' + err.message;
                showToast(err.message, true);
            } finally {
                saveBtn.disabled = false;
                setTimeout(() => { statusSpan.textContent = ''; }, 5000);
            }
        }
        document.getElementById('saveOrderBtn')?.addEventListener('click', saveNewOrder);

        // ===== DELETE ITEM =====
        window.deleteItem = async (table, id) => {
            if (!confirm(`⚠️ هل أنت متأكد من حذف هذا العنصر نهائياً؟\nلا يمكن التراجع عن هذا الإجراء.`)) return;
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) showToast(error.message, true);
            else {
                showToast('🗑️ تم الحذف النهائي بنجاح');
                if (table === 'projects') loadProjects(state.currentProjectsPage);
                else if (table === 'products') loadProducts();
                else if (table === 'deals') loadDeals();
                loadStats();
            }
        };

        // ===== LOAD PRODUCTS =====
        async function loadProducts() {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) {
                document.getElementById('productsTableContainer').innerHTML =
                    '<div class="no-data">✏️ اختر مشروعاً أولاً من القائمة</div>';
                return;
            }
            const { data, error } = await supabase.from('products').select('*').eq('project_id', projectId).order(
                'display_order', { ascending: true, nullsFirst: false });
            if (error) return showToast(error.message, true);
            const container = document.getElementById('productsTableContainer');
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="no-data">لا توجد منتجات لهذا المشروع</div>';
                return;
            }
            let html = `<div class="table-wrapper"><table class="data-table"><thead><tr><th>الترتيب</th><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>التصنيف</th><th>النوع</th><th>السعر</th><th>الإجراءات</th></tr></thead><tbody>`;
            for (const p of data) {
                html += `<tr>
                    <td style="white-space:nowrap;">
                        <input type="number" value="${p.display_order ?? 0}" style="width:60px; padding:4px 8px; border-radius:30px; border:1px solid #dce5ec; font-family:inherit; font-size:12px;" class="product-order-input" data-id="${p.id}">
                        <button class="action-btn edit" onclick="window.swapProductOrder('${p.id}', 'up')" title="رفع"><i class="fas fa-arrow-up"></i></button>
                        <button class="action-btn edit" onclick="window.swapProductOrder('${p.id}', 'down')" title="خفض"><i class="fas fa-arrow-down"></i></button>
                    </td>
                    <td>${escapeHtml(p.id)}</td>
                    <td>${p.main_image ? `<img src="${escapeHtml(p.main_image)}" class="thumb-preview">` : '-'}</td>
                    <td>${escapeHtml(p.name_ar)}</td>
                    <td>${escapeHtml(p.category_ar || '-')}</td>
                    <td>${escapeHtml(p.type_ar || '-')}</td>
                    <td>${escapeHtml(p.price_ar || '-')}</td>
                    <td class="action-buttons">
                        <button class="action-btn edit" onclick="window.editProduct('${p.id}')" title="تعديل"><i class="fas fa-edit"></i></button>
                        <button class="action-btn delete" onclick="window.deleteItem('products','${p.id}')" title="حذف"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }
            html += `</tbody></table></div>`;
            container.innerHTML = html;

            document.querySelectorAll('.product-order-input').forEach(inp => {
                inp.addEventListener('change', function() {
                    const id = this.dataset.id;
                    const newOrder = parseInt(this.value);
                    if (!isNaN(newOrder)) updateProductOrderDirect(id, newOrder);
                });
            });
        }

        window.swapProductOrder = async (id, direction) => {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) return;
            const { data: current } = await supabase.from('products').select('id, display_order').eq('id', id).single();
            if (!current) return;
            let currentOrder = current.display_order ?? 0;
            let query = direction === 'up' ?
                supabase.from('products').select('id, display_order').eq('project_id', projectId).lt('display_order',
                    currentOrder).order('display_order', { ascending: false }).limit(1) :
                supabase.from('products').select('id, display_order').eq('project_id', projectId).gt('display_order',
                    currentOrder).order('display_order', { ascending: true }).limit(1);
            const { data: neighbor } = await query;
            if (!neighbor?.length) return showToast(direction === 'up' ? 'هذا بالفعل الأعلى' : 'هذا بالفعل الأسفل');
            const target = neighbor[0];
            await supabase.from('products').update({ display_order: target.display_order }).eq('id', current.id);
            await supabase.from('products').update({ display_order: currentOrder }).eq('id', target.id);
            showToast('تم تبديل الترتيب');
            loadProducts();
        };

        async function updateProductOrderDirect(id, newOrder) {
            const { error } = await supabase.from('products').update({ display_order: newOrder }).eq('id', id);
            if (error) showToast(error.message, true);
            else loadProducts();
        }

        window.reorderAllProducts = async () => {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) return showToast('اختر مشروعاً أولاً', true);
            const { data } = await supabase.from('products').select('id').eq('project_id', projectId).order('display_order',
                { ascending: true, nullsFirst: false }).order('id', { ascending: true });
            if (!data) return;
            for (let i = 0; i < data.length; i++) {
                await supabase.from('products').update({ display_order: i + 1 }).eq('id', data[i].id);
            }
            showToast('تم إعادة ترتيب المنتجات');
            loadProducts();
        };

        window.editProduct = async (id) => {
            const { data } = await supabase.from('products').select('*').eq('id', id).single();
            if (!data) return;
            document.getElementById('productId').value = data.id;
            document.getElementById('productProjectId').value = data.project_id;
            document.getElementById('productNameAr').value = data.name_ar || '';
            document.getElementById('productNameEn').value = data.name_en || '';
            document.getElementById('productMainImage').value = data.main_image || '';
            document.getElementById('productImages').value = (data.images || []).join(',');
            document.getElementById('productDescAr').value = data.description_ar || '';
            document.getElementById('productDescEn').value = data.description_en || '';
            document.getElementById('productLongDescAr').value = data.long_description_ar || '';
            document.getElementById('productLongDescEn').value = data.long_description_en || '';
            document.getElementById('productDetailsAr').value = (data.details_ar || []).join('\n');
            document.getElementById('productDetailsEn').value = (data.details_en || []).join('\n');
            if (document.getElementById('productTypeAr')) document.getElementById('productTypeAr').value = data.type_ar || '';
            if (document.getElementById('productTypeEn')) document.getElementById('productTypeEn').value = data.type_en || '';
            if (document.getElementById('productCategoryAr')) document.getElementById('productCategoryAr').value = data.category_ar ||
                '';
            if (document.getElementById('productCategoryEn')) document.getElementById('productCategoryEn').value = data.category_en ||
                '';
            document.getElementById('productPriceAr').value = data.price_ar || '';
            document.getElementById('productPriceEn').value = data.price_en || '';
            const { data: variants } = await supabase.from('product_variants').select('*').eq('product_id', id);
            state.currentVariants = variants || [];
            renderVariants();
            document.getElementById('productModal').classList.add('active');
        };

        function renderVariants() {
            const container = document.getElementById('variantsContainer');
            if (!container) return;
            container.innerHTML = state.currentVariants.map((v, idx) => `
                <div class="variant-row" style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center;">
                    <input type="text" placeholder="الاسم (عربي)" value="${escapeHtml(v.label_ar || '')}" class="variant-label-ar" style="flex:1; min-width:80px; padding:8px 12px; border:1px solid #dce5ec; border-radius:20px; font-family:inherit; font-size:13px;">
                    <input type="text" placeholder="الاسم (En)" value="${escapeHtml(v.label_en || '')}" class="variant-label-en" style="flex:1; min-width:80px; padding:8px 12px; border:1px solid #dce5ec; border-radius:20px; font-family:inherit; font-size:13px;">
                    <input type="text" placeholder="السعر (عربي)" value="${escapeHtml(v.price_ar || '')}" class="variant-price-ar" style="flex:1; min-width:80px; padding:8px 12px; border:1px solid #dce5ec; border-radius:20px; font-family:inherit; font-size:13px;">
                    <input type="text" placeholder="السعر (En)" value="${escapeHtml(v.price_en || '')}" class="variant-price-en" style="flex:1; min-width:80px; padding:8px 12px; border:1px solid #dce5ec; border-radius:20px; font-family:inherit; font-size:13px;">
                    <label style="display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600;">
                        <input type="checkbox" ${v.is_default ? 'checked' : ''} class="variant-default"> افتراضي
                    </label>
                    <button type="button" class="remove-variant" data-idx="${idx}" style="background:#fee2e2; border:none; border-radius:30px; width:32px; height:32px; cursor:pointer; color:#b91c1c; display:flex; align-items:center; justify-content:center; transition:0.2s;" title="حذف الخيار">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
            document.querySelectorAll('.remove-variant').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    state.currentVariants.splice(idx, 1);
                    renderVariants();
                });
            });
        }

        document.getElementById('addVariantBtn')?.addEventListener('click', () => {
            state.currentVariants.push({ label_ar: '', label_en: '', price_ar: '', price_en: '', is_default: false });
            renderVariants();
        });

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const projectId = document.getElementById('productProjectId').value;
            const imagesArr = document.getElementById('productImages').value.split(',').map(s => s.trim()).filter(Boolean);
            const detailsAr = document.getElementById('productDetailsAr').value.split('\n').map(s => s.trim()).filter(Boolean);
            const detailsEn = document.getElementById('productDetailsEn').value.split('\n').map(s => s.trim()).filter(Boolean);
            const payload = {
                name_ar: document.getElementById('productNameAr').value,
                name_en: document.getElementById('productNameEn').value,
                main_image: document.getElementById('productMainImage').value,
                images: imagesArr,
                description_ar: document.getElementById('productDescAr').value,
                description_en: document.getElementById('productDescEn').value,
                long_description_ar: document.getElementById('productLongDescAr').value,
                long_description_en: document.getElementById('productLongDescEn').value,
                details_ar: detailsAr,
                details_en: detailsEn,
                price_ar: document.getElementById('productPriceAr').value,
                price_en: document.getElementById('productPriceEn').value,
                type_ar: document.getElementById('productTypeAr').value,
                type_en: document.getElementById('productTypeEn').value,
                category_ar: document.getElementById('productCategoryAr').value,
                category_en: document.getElementById('productCategoryEn').value,
                project_id: projectId
            };
            let productId = id;
            let err;
            if (!productId) {
                const { data: newProduct, error: insertErr } = await supabase.from('products').insert(payload).select().single();
                if (insertErr) { showToast(insertErr.message, true); return; }
                productId = newProduct.id;
            } else {
                err = (await supabase.from('products').update(payload).eq('id', productId)).error;
                if (err) { showToast(err.message, true); return; }
            }
            await supabase.from('product_variants').delete().eq('product_id', productId);
            for (let i = 0; i < state.currentVariants.length; i++) {
                const rowEl = document.querySelectorAll('#variantsContainer .variant-row')[i];
                if (!rowEl) continue;
                const v = {
                    label_ar: rowEl.querySelector('.variant-label-ar')?.value || '',
                    label_en: rowEl.querySelector('.variant-label-en')?.value || '',
                    price_ar: rowEl.querySelector('.variant-price-ar')?.value || '',
                    price_en: rowEl.querySelector('.variant-price-en')?.value || '',
                    is_default: !!rowEl.querySelector('.variant-default')?.checked
                };
                if (v.label_ar || v.label_en) {
                    await supabase.from('product_variants').insert({
                        product_id: productId,
                        label_ar: v.label_ar,
                        label_en: v.label_en,
                        price_ar: v.price_ar,
                        price_en: v.price_en,
                        is_default: v.is_default
                    });
                }
            }
            showToast('تم حفظ المنتج');
            document.getElementById('productModal').classList.remove('active');
            loadProducts();
            loadStats();
        }

        // ===== LOAD DEALS =====
        async function loadDeals() {
            const projectId = document.getElementById('dealProjectFilter').value;
            if (!projectId) {
                document.getElementById('dealsTableContainer').innerHTML = '<div class="no-data">اختر مشروعاً لعرض عروضه</div>';

                    `project_name.ilike.%${search}%,customer_whatsapp.ilike.%${search}%,order_number.ilike.%${search}%`);

        function downloadCSV(rows, filename) {
            const csvContent = rows.map(row => row.join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `${filename}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('تم التصدير بنجاح');
        }
