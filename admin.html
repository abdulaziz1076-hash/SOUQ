        // ===== LICENSES =====
        async function loadLicenseRequests(page = 1) {
            if (state.isLoading) return;
            state.isLoading = true;
            state.currentLicensesPage = page;
            try {
                const status = document.getElementById('licenseStatusFilter').value;
                let query = supabase
                    .from('project_license_requests')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                if (status !== 'all') query = query.eq('status', status);

                const { data, error, count } = await query;
                if (error) throw error;
                state.licensesTotal = count || 0;
                const container = document.getElementById('licensesTableContainer');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-data">لا توجد طلبات تراخيص</div>';
                    document.getElementById('licensesPagination').innerHTML = '';
                    return;
                }

                const projectIds = [...new Set(data.map(req => req.project_id))];
                const { data: projectsData } = await supabase.from('projects').select('id, name_ar').in('id', projectIds);
                const projectMap = {};
                if (projectsData) {
                    projectsData.forEach(p => { projectMap[p.id] = p.name_ar; });
                }

                let html =
                    `<div class="table-wrapper"><table class="data-table"><thead><tr><th>المشروع</th><th>ملف الرخصة</th><th>حالة الطلب</th><th>تاريخ الرفع</th><th>الإجراءات</th></tr></thead><tbody>`;
                for (const req of data) {
                    const projectName = projectMap[req.project_id] || 'مشروع محذوف';
                    let statusText = '',
                        badgeClass = '';
                    if (req.status === 'pending') { statusText = 'قيد المراجعة';
                        badgeClass = 'badge-pending'; } else if (req.status === 'approved') { statusText = 'موافق';
                        badgeClass = 'badge-approved'; } else if (req.status === 'rejected') { statusText = 'مرفوض';
                        badgeClass = 'badge-rejected'; } else { statusText = escapeHtml(req.status || '-');
                        badgeClass = 'badge-reviewed'; }

                    html += `<tr>
                                <td>${escapeHtml(projectName)}</td>
                                <td>${req.license_file_url ? `<a href="${escapeHtml(req.license_file_url)}" target="_blank" style="padding:4px 14px; border:1px solid var(--gold); border-radius:var(--radius-full); font-size:0.7rem; font-weight:600; color:var(--primary); text-decoration:none; display:inline-block;">📄 عرض الملف</a>` : '-'}</td>
                                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                                <td>${req.created_at ? new Date(req.created_at).toLocaleString() : '-'}</td>
                                <td class="action-buttons">
                                    <button class="action-btn approve" onclick="window.reviewLicense('${req.id}', 'approve')" title="قبول"><i class="fas fa-check-circle"></i></button>
                                    <button class="action-btn reject" onclick="window.reviewLicense('${req.id}', 'reject')" title="رفض"><i class="fas fa-times-circle"></i></button>
                                </td>
                            </tr>`;
                }
                html += `</tbody></table></div>`;
                container.innerHTML = html;

                const totalPages = Math.ceil(state.licensesTotal / LIMIT);
                let pagHtml = '<div class="pagination">';
                for (let i = 1; i <= totalPages; i++) pagHtml +=
                    `<button onclick="window.loadLicenseRequests(${i})" ${i === page ? 'class="active"' : ''}>${i}</button>`;
                pagHtml += '</div>';
                document.getElementById('licensesPagination').innerHTML = totalPages > 1 ? pagHtml : '';

            } catch (e) {
                showToast(e.message, 'error');
                console.error('loadLicenseRequests error:', e);
            } finally {
                state.isLoading = false;
            }
        }

        window.reviewLicense = async (requestId, action) => {
            const newStatus = (action === 'approve') ? 'approved' : 'rejected';
            const { error: updateReq } = await supabase.from('project_license_requests').update({ status: newStatus }).eq(
                'id', requestId);
            if (updateReq) { showToast(updateReq.message, 'error'); return; }

            const { data: reqData, error: reqFetchError } = await supabase.from('project_license_requests').select(
                'project_id').eq('id', requestId).single();
            if (reqFetchError) { showToast(reqFetchError.message, 'error'); return; }
            if (reqData && reqData.project_id) {
                const projectLicenseStatus = (action === 'approve') ? 'license_approved' : 'license_rejected';
                const projUpdate = { license_status: projectLicenseStatus, license_reviewed_at: new Date().toISOString() };
                if (action === 'reject') {
                    const reason = prompt('سبب الرفض (اختياري):') || '';
                    projUpdate.rejection_reason = reason.trim() || null;
                } else {
                    projUpdate.rejection_reason = null;
                }
                const { error: projErr } = await supabase.from('projects').update(projUpdate).eq('id', reqData.project_id);
                if (projErr) { showToast(projErr.message, 'error'); return; }
            }
            showToast(`تم ${action === 'approve' ? 'قبول' : 'رفض'} الرخصة`);
            await loadLicenseRequests(state.currentLicensesPage);
            await loadProjects(state.currentProjectsPage);
            await loadStats();
        };

                                <td><button class="action-btn view" onclick="window.viewSupportTicket('${escapeHtml(ticket.id)}')" title="رد/عرض"><i class="fas fa-reply"></i></button></td>
                            </tr>`;
                }
                html += `</tbody></table></div>`;
                container.innerHTML = html;

                const totalPages = Math.ceil(state.supportTotal / LIMIT);
                let pagHtml = '<div class="pagination">';
                for (let i = 1; i <= totalPages; i++) pagHtml +=
                    `<button onclick="window.loadSupportTickets(${i})" ${i === page ? 'class="active"' : ''}>${i}</button>`;
                pagHtml += '</div>';
                document.getElementById('supportPagination').innerHTML = totalPages > 1 ? pagHtml : '';

            } catch (e) {
                showToast(e.message, 'error');
                console.error('loadSupportTickets error:', e);
            } finally {
                state.isLoading = false;
            }
        }

        window.submitTicketReply = async (id) => {

            const { error } = await supabase.from('support_tickets').update(updateData).eq('id', id);
            if (error) { showToast(error.message, 'error'); return; }
            showToast('تم تحديث التذكرة');

        function downloadCSV(rows, filename) {
            const csvContent = rows.map(row => row.join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `${filename}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('تم التصدير بنجاح');
        }

            const { data } = await supabase.from('projects').select('emirate');

            const select = document.getElementById('projectEmirateFilter');
            select.innerHTML = '<option value="">كل الإمارات</option>';
            unique.forEach(e => { const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                select.appendChild(opt); });
        }

        async function initProjectSelects() {
            const { data } = await supabase.from('projects').select('id, name_ar').order('id', { ascending: false });
            if (!data) return;
            const fillSelect = (id) => {
                const sel = document.getElementById(id);
                if (!sel) return;
                sel.innerHTML = '<option value="">اختر المشروع</option>';
                data.forEach(p => { const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name_ar;
                    sel.appendChild(opt); });
            };
            fillSelect('productProjectFilter');
            fillSelect('dealProjectFilter');
            fillSelect('contactProjectFilter');
            const ordersFilter = document.getElementById('ordersProjectFilter');
            if (ordersFilter) {
                ordersFilter.innerHTML = '<option value="">كل المشاريع</option>';
                data.forEach(p => { const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name_ar;
                    ordersFilter.appendChild(opt); });
            }
        }

        // ===== NAVIGATION / TABS =====
        function navigateTo(tabId) {
            // تحديث القائمة الجانبية
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tabId);
            });

            // تحديث المحتوى
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            const target = document.getElementById(tabId + 'Tab');
            if (target) target.classList.add('active');

            // تحديث عنوان الصفحة
            const titles = {
                'dashboard': 'لوحة المعلومات',
                'registrations': 'طلبات التسجيل',
                'projects': 'المشاريع',
                'products': 'المنتجات',
                'deals': 'العروض',
                'contacts': 'بيانات التواصل',
                'feedbacks': 'الشكاوى',
                'orders': 'الطلبات',
                'licenses': 'التراخيص',
                'support': 'الدعم الفني'
            };
            document.getElementById('pageTitle').textContent = titles[tabId] || tabId;

            state.currentTab = tabId;

            // تحميل البيانات حسب التبويب
            const loadMap = {
                'dashboard': () => { loadStats(); },
                'registrations': () => loadRegistrations(1),
                'projects': () => loadProjects(1),
                'products': () => loadProducts(),
                'deals': () => loadDeals(),
                'contacts': () => loadContacts(),
                'feedbacks': () => loadFeedbacks(),
                'orders': () => loadOrders(1),
                'licenses': () => loadLicenseRequests(1),
                'support': () => loadSupportTickets(1)
            };
            const fn = loadMap[tabId];
            if (fn) fn();

            // إغلاق السايدبار في الجوال
            document.getElementById('sidebar').classList.remove('open');
        }

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value;
            const pwd = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.innerText = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                if (error) throw new Error(error.message);
                if (data?.user?.email !== ALLOWED_EMAIL) {
                    await supabase.auth.signOut();
                    throw new Error('غير مصرح لك بالدخول إلى لوحة التحكم');
                }

                // التحقق من وجود المستخدم في جدول admin_users
                const { data: adminCheck, error: adminError } = await supabase
                    .from('admin_users')
                    .select('user_id')
                    .eq('user_id', data.user.id)
                    .maybeSingle();

                if (!adminCheck) {
                    await supabase.from('admin_users').insert({ user_id: data.user.id });
                }

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';

                fillCategoryDropdowns();
                await loadProjectsMap();
                await initEmirateFilter();

                await loadRegistrations(1);
                await loadProducts();
                await loadDeals();
                await loadContacts();
                await loadFeedbacks();
                await loadOrders(1);
                await loadLicenseRequests(1);
                await loadSupportTickets(1);

                // تعيين التبويب النشط
                document.querySelector('.sidebar-nav .nav-item[data-tab="dashboard"]')?.classList.add('active');

            } catch (err) {
                errorDiv.innerText = err.message || 'بيانات الدخول غير صحيحة';

            }
        };

        document.getElementById('forgotPasswordLink')?.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            if (!email || !email.includes('@')) { alert('الرجاء إدخال البريد الإلكتروني أولاً'); return; }
            const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin +

            if (error) alert('حدث خطأ: ' + error.message);
            else alert('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
        });

        // ===== SESSION CHECK =====
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user?.email === ALLOWED_EMAIL) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                fillCategoryDropdowns();
                await loadProjectsMap();
                await initEmirateFilter();
                await initProjectSelects();
                await loadStats();
                await loadProjects(1);
                await loadRegistrations(1);
                await loadProducts();
                await loadDeals();
                await loadContacts();
                await loadFeedbacks();
                await loadOrders(1);
                await loadLicenseRequests(1);
                await loadSupportTickets(1);
                document.querySelector('.sidebar-nav .nav-item[data-tab="dashboard"]')?.classList.add('active');
            }
        }

        checkSession();

        // ===== GLOBAL EXPOSURE =====
