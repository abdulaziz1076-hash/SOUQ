<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
	<title>لوحة تحكم المشرف – سوق المشاريع</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
	<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

	<style>
		/* ===== إعادة تعيين وتحسينات عامة ===== */
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: #f0f4f8;
			font-family: 'Almarai', 'Tajawal', sans-serif;
			color: #1a2c3e;
			direction: rtl;
		}
		.admin-wrapper { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }

		/* ===== شريط علوي محسن ===== */
		.top-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: white;
			border-radius: 32px;
			padding: 12px 28px;
			margin-bottom: 32px;
			box-shadow: 0 8px 20px rgba(0,0,0,0.05);
			border: 1px solid #e2edf2;
			flex-wrap: wrap;
			gap: 10px;
		}
		.logo-area h1 { font-size: 1.5rem; color: #0a2e25; font-weight: 800; }
		.logo-area i { color: #D4AF37; margin-left: 8px; }
		.top-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
		.refresh-all-btn {
			background: #0a2e25;
			color: white;
			border: none;
			padding: 8px 18px;
			border-radius: 40px;
			font-weight: 600;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			transition: all 0.2s;
		}
		.refresh-all-btn:hover { background: #1a5f44; transform: translateY(-2px); }
		.logout-btn {
			background: #e53e3e;
			color: white;
			border: none;
			padding: 8px 24px;
			border-radius: 40px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.logout-btn:hover { background: #c53030; transform: translateY(-2px); }

		/* ===== بطاقات إحصائية محسنة ===== */
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 20px;
			margin-bottom: 40px;
		}
		.stat-card {
			background: white;
			border-radius: 28px;
			padding: 22px;
			box-shadow: 0 6px 14px rgba(0,0,0,0.03);
			border: 1px solid #e9f0f5;
			transition: transform 0.25s, box-shadow 0.25s;
			position: relative;
			overflow: hidden;
		}
		.stat-card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1); }
		.stat-card .stat-icon {
			width: 56px;
			height: 56px;
			background: linear-gradient(145deg, #0b3b2e, #1a5f44);
			border-radius: 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 16px;
		}
		.stat-card .stat-icon i { font-size: 28px; color: #D4AF37; }
		.stat-card .stat-number { font-size: 38px; font-weight: 800; color: #0a2e25; line-height: 1.2; }
		.stat-card .stat-label { font-size: 14px; color: #5f7f9a; margin-top: 6px; font-weight: 500; }
		.stat-card .stat-badge {
			position: absolute;
			top: 12px;
			left: 12px;
			background: rgba(212, 175, 55, 0.15);
			color: #0a2e25;
			padding: 4px 12px;
			border-radius: 30px;
			font-size: 11px;
			font-weight: 700;
		}
		[dir="ltr"] .stat-card .stat-badge { left: auto; right: 12px; }

		/* ===== التبويبات ===== */
		.tabs-container {
			background: white;
			border-radius: 60px;
			padding: 6px;
			margin-bottom: 28px;
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			box-shadow: 0 2px 6px rgba(0,0,0,0.02);
			border: 1px solid #e2edf2;
		}
		.tab-btn {
			background: transparent;
			border: none;
			padding: 12px 24px;
			border-radius: 50px;
			font-weight: 700;
			font-size: 14px;
			cursor: pointer;
			transition: 0.2s;
			color: #2c4e6e;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			flex: 0 0 auto;
		}
		.tab-btn i { font-size: 16px; }
		.tab-btn.active { background: #0a2e25; color: white; box-shadow: 0 8px 18px rgba(10,46,37,0.2); }
		.tab-btn:hover:not(.active) { background: #e6f0f5; }

		/* ===== المحتوى ===== */
		.content-card {
			background: white;
			border-radius: 32px;
			padding: 28px;
			box-shadow: 0 8px 24px rgba(0,0,0,0.04);
			border: 1px solid #e9f0f5;
			display: none;
			animation: fadeIn 0.3s ease;
		}
		.content-card.active { display: block; }
		@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

		/* ===== شريط الفلاتر ===== */
		.filter-bar {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			margin-bottom: 24px;
			align-items: center;
			justify-content: space-between;
		}
		.filter-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
		.filter-bar input, .filter-bar select {
			padding: 10px 16px;
			border: 1px solid #cfdfe9;
			border-radius: 34px;
			background: white;
			font-family: inherit;
			font-size: 13px;
			min-width: 160px;
			transition: 0.2s;
		}
		.filter-bar input:focus, .filter-bar select:focus {
			border-color: #1a5f44;
			outline: none;
			box-shadow: 0 0 0 3px rgba(26,95,68,0.1);
		}
		.filter-bar button {
			background: #0a2e25;
			color: white;
			border: none;
			padding: 10px 22px;
			border-radius: 40px;
			font-weight: 600;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			transition: 0.2s;
			font-family: inherit;
			font-size: 13px;
		}
		.filter-bar button.btn-outline {
			background: white;
			color: #0a2e25;
			border: 1px solid #0a2e25;
		}
		.filter-bar button.btn-outline:hover {
			background: #0a2e25;
			color: white;
			transform: translateY(-2px);
		}
		.filter-bar button:hover {
			transform: translateY(-2px);
			background: #1a5f44;
		}
		.filter-bar .refresh-btn {
			background: #D4AF37;
			color: #0a2e25;
		}
		.filter-bar .refresh-btn:hover { background: #c49b2a; }

		/* ===== الجداول ===== */
		.table-wrapper { overflow-x: auto; }
		.data-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 14px;
			min-width: 700px;
		}
		.data-table th, .data-table td {
			padding: 14px 12px;
			text-align: right;
			border-bottom: 1px solid #edf2f7;
			vertical-align: middle;
		}
		.data-table th {
			background: #fafcfd;
			font-weight: 800;
			color: #0a2e25;
			position: sticky;
			top: 0;
			z-index: 5;
		}
		.data-table tr:hover td { background-color: #f8fbfe; }
		.data-table .no-data { text-align: center; padding: 30px; color: #94a3b8; }

		/* ===== الشارات ===== */
		.badge {
			display: inline-block;
			padding: 4px 12px;
			border-radius: 40px;
			font-size: 12px;
			font-weight: 700;
			white-space: nowrap;
		}
		.badge-pending { background: #fff3e0; color: #c47a2e; }
		.badge-approved { background: #dcfce7; color: #15803d; }
		.badge-rejected { background: #fee2e2; color: #b91c1c; }
		.badge-reviewed { background: #e0f2fe; color: #0369a1; }
		.badge-resolved { background: #d9f99d; color: #3f6212; }
		.badge-open { background: #fef3c7; color: #d97706; }
		.badge-closed { background: #e5e7eb; color: #4b5563; }

		/* ===== معاينة الصور ===== */
		.thumb-preview {
			width: 45px;
			height: 45px;
			object-fit: cover;
			border-radius: 12px;
			box-shadow: 0 2px 6px rgba(0,0,0,0.1);
			cursor: pointer;
			transition: 0.2s;
		}
		.thumb-preview:hover { transform: scale(1.1); }

		/* ===== أزرار الإجراءات ===== */
		.action-buttons {
			display: flex;
			gap: 6px;
			flex-wrap: wrap;
		}
		.action-btn {
			background: none;
			border: none;
			cursor: pointer;
			font-size: 16px;
			padding: 6px;
			border-radius: 12px;
			width: 34px;
			height: 34px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			transition: 0.2s;
		}
		.action-btn.move-up, .action-btn.move-down { color: #D4AF37; background: #fff8e7; }
		.action-btn.move-up:hover, .action-btn.move-down:hover { background: #0a2e25; color: white; transform: scale(1.05); }
		.action-btn.edit { color: #2c7da0; background: #eef6fc; }
		.action-btn.edit:hover { background: #c9e6f5; transform: scale(1.05); }
		.action-btn.delete { color: #e53e3e; background: #fee9e9; }
		.action-btn.delete:hover { background: #fccaca; transform: scale(1.05); }
		.action-btn.approve { color: #15803d; background: #dcfce7; }
		.action-btn.approve:hover { background: #bbf7d0; transform: scale(1.05); }
		.action-btn.reject { color: #b91c1c; background: #fee2e2; }
		.action-btn.reject:hover { background: #fecaca; transform: scale(1.05); }

		.view-details-btn {
			background: #D4AF37;
			color: #0a2e25;
			border: none;
			padding: 4px 12px;
			border-radius: 20px;
			font-size: 11px;
			cursor: pointer;
			font-weight: 700;
			transition: 0.2s;
		}
		.view-details-btn:hover { background: #c49b2a; transform: scale(1.05); }

		/* ===== المودالات ===== */
		.modal {
			display: none;
			position: fixed;
			top: 0; left: 0;
			width: 100%; height: 100%;
			background: rgba(0,0,0,0.5);
			backdrop-filter: blur(4px);
			z-index: 2000;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.modal.active { display: flex; }
		.modal-content {
			background: white;
			border-radius: 44px;
			max-width: 800px;
			width: 100%;
			max-height: 85vh;
			overflow-y: auto;
			box-shadow: 0 30px 40px rgba(0,0,0,0.2);
			animation: fadeScale 0.25s ease;
		}
		@keyframes fadeScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
		.modal-header {
			padding: 24px 28px;
			border-bottom: 1px solid #e9f0f5;
			display: flex;
			justify-content: space-between;
			align-items: center;
			position: sticky;
			top: 0;
			background: white;
			z-index: 10;
			border-radius: 44px 44px 0 0;
		}
		.modal-header h3 { font-size: 1.6rem; color: #0a2e25; font-weight: 800; }
		.modal-close {
			background: none;
			border: none;
			font-size: 28px;
			cursor: pointer;
			color: #94a3b8;
			transition: 0.2s;
			width: 44px;
			height: 44px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
		}
		.modal-close:hover { background: #f1f5f9; color: #0a2e25; }
		.modal-body { padding: 28px; }
		.form-row { margin-bottom: 20px; }
		.form-row label { display: block; font-weight: 700; margin-bottom: 6px; color: #1e293b; font-size: 14px; }
		.form-row input, .form-row select, .form-row textarea {
			width: 100%;
			padding: 12px 18px;
			border: 1px solid #cfdfe9;
			border-radius: 24px;
			font-family: inherit;
			font-size: 14px;
			transition: 0.2s;
		}
		.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
			border-color: #1a5f44;
			outline: none;
			box-shadow: 0 0 0 3px rgba(26,95,68,0.1);
		}
		.checkbox-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
		.btn-save {
			background: linear-gradient(135deg, #0a2e25, #1a5f44);
			color: white;
			width: 100%;
			padding: 14px;
			border-radius: 60px;
			font-weight: 700;
			border: none;
			cursor: pointer;
			font-size: 16px;
			transition: 0.2s;
		}
		.btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10,46,37,0.3); }
		.btn-outline {
			background: white;
			color: #0a2e25;
			border: 1px solid #0a2e25;
			padding: 6px 16px;
			border-radius: 30px;
			cursor: pointer;
			font-weight: 600;
			transition: 0.2s;
			font-family: inherit;
			font-size: 13px;
		}
		.btn-outline:hover { background: #0a2e25; color: white; }

		/* ===== صفوف المتغيرات ===== */
		.variant-row {
			display: flex;
			gap: 10px;
			margin-bottom: 10px;
			align-items: center;
			flex-wrap: wrap;
		}
		.variant-row input { flex: 1; min-width: 80px; padding: 8px 12px; border: 1px solid #cfdfe9; border-radius: 20px; font-family: inherit; }
		.remove-variant {
			background: #fee2e2;
			border: none;
			border-radius: 30px;
			width: 34px;
			height: 34px;
			cursor: pointer;
			color: #b91c1c;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: 0.2s;
		}
		.remove-variant:hover { background: #fecaca; transform: scale(1.05); }

		/* ===== التنبيهات (Toast) ===== */
		.toast {
			position: fixed;
			bottom: 30px;
			left: 50%;
			transform: translateX(-50%);
			background: #0a2e25;
			color: white;
			padding: 14px 32px;
			border-radius: 60px;
			z-index: 3000;
			font-weight: 500;
			box-shadow: 0 6px 14px rgba(0,0,0,0.15);
			animation: fadeUp 0.25s ease;
			max-width: 90%;
			text-align: center;
		}
		.toast.error { background: #dc2626; }
		@keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

		/* ===== الترقيم ===== */
		.pagination {
			display: flex;
			justify-content: center;
			gap: 8px;
			margin-top: 24px;
			flex-wrap: wrap;
		}
		.pagination button {
			padding: 8px 16px;
			border-radius: 30px;
			border: 1px solid #cfdfe9;
			background: white;
			cursor: pointer;
			transition: 0.2s;
			font-family: inherit;
			font-weight: 600;
		}
		.pagination button:hover { background: #0a2e25; color: white; border-color: #0a2e25; }
		.pagination button.active { background: #0a2e25; color: white; border-color: #0a2e25; }

		/* ===== استجابة ===== */
		@media (max-width: 700px) {
			.admin-wrapper { padding: 16px 12px; }
			.tab-btn { padding: 8px 14px; font-size: 12px; }
			.filter-group { width: 100%; }
			.filter-bar input, .filter-bar select { width: 100%; min-width: unset; }
			.data-table th, .data-table td { font-size: 12px; padding: 8px 6px; }
			.stat-card .stat-number { font-size: 28px; }
			.top-bar { flex-direction: column; align-items: stretch; text-align: center; }
			.top-actions { justify-content: center; }
			.modal-content { max-width: 100%; border-radius: 28px; }
			.modal-body { padding: 20px; }
		}
		@media (max-width: 480px) {
			.tabs-container { border-radius: 30px; padding: 4px; gap: 4px; }
			.tab-btn { padding: 6px 12px; font-size: 11px; }
			.tab-btn i { font-size: 13px; }
		}
	</style>
</head>
<body>

	<!-- ===== صفحة تسجيل الدخول ===== -->
	<div id="loginSection" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#0a2e25,#1a5f44);">
		<div style="background:white; border-radius:48px; padding:42px; width:100%; max-width:420px; text-align:center; box-shadow:0 25px 45px rgba(0,0,0,0.2);">
			<i class="fas fa-chalkboard-user" style="font-size:64px; color:#D4AF37; margin-bottom:20px;"></i>
			<h2 style="color:#0a2e25; margin-bottom:8px;">دخول المشرف</h2>
			<p style="color:#64748b; margin-bottom:24px;">سوق المشاريع – لوحة التحكم المتقدمة</p>

			<input type="email" id="adminEmail" placeholder="البريد الإلكتروني" value="abdulaziz1076@gmail.com" style="width:100%; padding:14px; margin:10px 0; border-radius:40px; border:1px solid #cfdfe9; font-family:inherit; font-size:14px;">
			<input type="password" id="adminPassword" placeholder="كلمة المرور" style="width:100%; padding:14px; margin-bottom:24px; border-radius:40px; border:1px solid #cfdfe9; font-family:inherit; font-size:14px;">

			<button id="loginBtn" style="background:#0a2e25; color:white; width:100%; padding:14px; border-radius:40px; font-weight:bold; border:none; font-size:16px; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px;">
				دخول <i class="fas fa-arrow-left"></i>
			</button>

			<div id="loginError" style="color:#dc2626; margin-top:16px; font-size:13px;"></div>

			<div style="margin-top: 16px;">
				<a href="#" id="forgotPasswordLink" style="color: #D4AF37; text-decoration: none; font-size: 13px; font-weight:600;">نسيت كلمة المرور؟</a>
			</div>
		</div>
	</div>

	<!-- ===== لوحة التحكم ===== -->
	<div id="adminContent" style="display:none;">
		<div class="admin-wrapper">

			<!-- الشريط العلوي -->
			<div class="top-bar">
				<div class="logo-area"><h1><i class="fas fa-store"></i> سوق المشاريع | المشرف المتقدم</h1></div>
				<div class="top-actions">
					<button id="refreshAllBtn" class="refresh-all-btn"><i class="fas fa-sync-alt"></i> تحديث الكل</button>
					<button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
				</div>
			</div>

			<!-- الإحصائيات -->
			<div class="stats-grid" id="statsContainer"><div class="stat-card"><div class="stat-icon"><i class="fas fa-spinner fa-spin"></i></div><div class="stat-number">...</div><div class="stat-label">جاري التحميل</div></div></div>

			<!-- التبويبات -->
			<div class="tabs-container">
				<button class="tab-btn active" data-tab="registrations"><i class="fas fa-clipboard-list"></i> طلبات التسجيل</button>
				<button class="tab-btn" data-tab="projects"><i class="fas fa-store"></i> المشاريع</button>
				<button class="tab-btn" data-tab="products"><i class="fas fa-box"></i> المنتجات</button>
				<button class="tab-btn" data-tab="deals"><i class="fas fa-tags"></i> العروض</button>
				<button class="tab-btn" data-tab="contacts"><i class="fas fa-address-card"></i> بيانات التواصل</button>
				<button class="tab-btn" data-tab="feedbacks"><i class="fas fa-comment-dots"></i> الشكاوى</button>
				<button class="tab-btn" data-tab="orders"><i class="fas fa-truck"></i> الطلبات</button>
				<button class="tab-btn" data-tab="licenses"><i class="fas fa-file-certificate"></i> إدارة التراخيص</button>
				<button class="tab-btn" data-tab="support"><i class="fas fa-headset"></i> الدعم الفني</button>
			</div>

			<!-- ====== طلبات التسجيل ====== -->
			<div id="registrationsTab" class="content-card active">
				<div class="filter-bar">
					<div class="filter-group">
						<input type="text" id="regSearch" placeholder="بحث: اسم، واتساب...">
						<select id="regStatusFilter">
							<option value="all">كل الحالات</option>
							<option value="pending">معلق</option>
							<option value="approved">موافق</option>
							<option value="rejected">مرفوض</option>
						</select>

	<!-- ====== السكربت ====== -->
	<script type="module">
		import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
		import { APP_CONFIG } from './config.js';

		const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
		const ALLOWED_EMAIL = 'abdulaziz1076@gmail.com';

		// ===== حالة التطبيق =====
		const state = {
			currentProjectsPage: 1,
			projectsTotal: 0,
			currentOrdersPage: 1,
			ordersTotal: 0,
			currentRegPage: 1,
			regTotal: 0,
			currentVariants: [],
			currentTab: 'registrations',
			isLoading: false
		};

		const CATEGORIES_AR = ["أطعمة ومشروبات","الرقميات","روائح وعطور","عناية","حلويات","تجميل","ملابس","يدويات","هدايا","عطارة","فنون","نباتات","ترفيه"];
		const CATEGORIES_EN = ["Food & Beverages","IT","Scents & Perfumes","Care","Sweets","Beauty","Clothes","Handmade","Gifts","Apothecary","Arts","Plants","Entertainment"];

		// ===== أدوات مساعدة =====
		function showToast(msg, isErr = false) {
			const existing = document.querySelector('.toast');
			if (existing) existing.remove();
			const toast = document.createElement('div');
			toast.className = 'toast' + (isErr ? ' error' : '');
			toast.innerText = msg;
			document.body.appendChild(toast);
			setTimeout(() => toast.remove(), 3000);
		}

		function escapeHtml(str) {
			if (str === null || str === undefined) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function normalizeStatus(s) { return (s || '').toString().trim().toLowerCase(); }

		function mapProjectStatusToBadgeAndText(status) {
			const v = normalizeStatus(status);
			if (v === 'disabled' || v === 'inactive') return { badge: 'badge-pending', text: 'معطل' };
			if (v === 'deleted' || v === 'archived') return { badge: 'badge-rejected', text: 'محذوف' };
			if (v === 'pending') return { badge: 'badge-pending', text: 'معلق' };
			return { badge: 'badge-approved', text: 'فعال' };
		}

		// ===== تحميل الإحصائيات =====
		async function loadStats() {
			try {
				const [projects, products, feedbacks, totalRegs, pendingRegs, orders] = await Promise.all([
					supabase.from('projects').select('*', { count: 'exact', head: true }),
					supabase.from('products').select('*', { count: 'exact', head: true }),
					supabase.from('feedbacks').select('*', { count: 'exact', head: true }),
					supabase.from('project_registrations').select('*', { count: 'exact', head: true }),
					supabase.from('project_registrations').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
					supabase.from('admin_order_logs').select('*', { count: 'exact', head: true })
				]);

				document.getElementById('statsContainer').innerHTML = `
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-store"></i></div><div class="stat-number">${projects.count||0}</div><div class="stat-label">المشاريع</div><span class="stat-badge">نشطة</span></div>
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-box"></i></div><div class="stat-number">${products.count||0}</div><div class="stat-label">المنتجات</div><span class="stat-badge">معروضة</span></div>
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div><div class="stat-number">${totalRegs.count||0}</div><div class="stat-label">إجمالي الطلبات</div><span class="stat-badge">تسجيل</span></div>
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-number">${pendingRegs.count||0}</div><div class="stat-label">طلبات معلقة</div><span class="stat-badge">بحاجة مراجعة</span></div>
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-comment-dots"></i></div><div class="stat-number">${feedbacks.count||0}</div><div class="stat-label">الشكاوى</div><span class="stat-badge">وارد</span></div>
					<div class="stat-card"><div class="stat-icon"><i class="fas fa-truck"></i></div><div class="stat-number">${orders.count||0}</div><div class="stat-label">الطلبات (السلة)</div><span class="stat-badge">مطلوب</span></div>
				`;
			} catch (e) {
				console.error('Stats error:', e);
				document.getElementById('statsContainer').innerHTML = `<div class="stat-card"><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-number">!</div><div class="stat-label">خطأ في التحميل</div></div>`;
			}
		}

		// ===== تحديث حالة الترخيص من المشاريع =====
		window.updateProjectLicenseStatus = async (projectId, newStatus) => {
			const payload = {
				license_status: newStatus,
				license_reviewed_at: new Date().toISOString()
			};
			if (newStatus === 'license_rejected') {
				const reason = prompt('سبب الرفض (اختياري):') || '';
				payload.rejection_reason = reason.trim() || null;
			} else {
				payload.rejection_reason = null;
			}
			const { error } = await supabase.from('projects').update(payload).eq('id', projectId);
			if (error) return showToast(error.message, true);
			showToast('تم تحديث حالة الترخيص');
			await loadProjects(state.currentProjectsPage);
			await loadStats();
		};

		// ===== المشاريع =====
		async function loadProjects(page = 1) {
			if (state.isLoading) return;
			state.isLoading = true;
			state.currentProjectsPage = page;

			try {
				let query = supabase
					.from('projects')
					.select('*', { count: 'exact' })
					.order('display_order', { ascending: true, nullsFirst: false })
					.order('id', { ascending: false })
					.range((page - 1) * 10, page * 10 - 1);

				const search = document.getElementById('projectSearch').value;
				if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);

				const emirate = document.getElementById('projectEmirateFilter').value;
				if (emirate) query = query.eq('emirate', emirate);

				const statusF = document.getElementById('projectStatusFilter').value;
				if (statusF) query = query.eq('status', statusF);

				const { data, error, count } = await query;
				if (error) throw error;

				state.projectsTotal = count || 0;
				const container = document.getElementById('projectsTableContainer');
				if (!data || data.length === 0) {
					container.innerHTML = `<div class="no-data">لا توجد مشاريع</div>`;
					document.getElementById('projectsPagination').innerHTML = '';
					return;
				}

				let html = `<div class="table-wrapper"><table class="data-table"><thead><tr>
					<th>الترتيب</th><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>التصنيف</th><th>الإمارة</th><th>الحالة</th><th>حالة الترخيص</th><th>الإجراءات</th>
				</tr></thead><tbody>`;

				for (const p of data) {
					const st = mapProjectStatusToBadgeAndText(p.status);
					html += `<tr>
						<td style="white-space:nowrap;">
							<input type="number" value="${p.display_order ?? 0}" style="width:65px; padding:4px 8px; border-radius:30px; border:1px solid #cfdfe9;" class="project-order-input" data-id="${p.id}">
							<button class="action-btn move-up" onclick="window.swapProjectOrder(${p.id}, 'up')"><i class="fas fa-arrow-up"></i></button>

		async function saveProduct(e) {
			e.preventDefault();
			const id = document.getElementById('productId').value;
			const projectId = document.getElementById('productProjectId').value;
			const imagesArr = document.getElementById('productImages').value.split(',').map(s => s.trim()).filter(Boolean);
			const detailsAr = document.getElementById('productDetailsAr').value.split('\n').map(s => s.trim()).filter(Boolean);
			const detailsEn = document.getElementById('productDetailsEn').value.split('\n').map(s => s.trim()).filter(Boolean);
			const payload = {
				name_ar: document.getElementById('productNameAr').value,
				name_en: document.getElementById('productNameEn').value,
				main_image: document.getElementById('productMainImage').value,
				images: imagesArr,
				description_ar: document.getElementById('productDescAr').value,
				description_en: document.getElementById('productDescEn').value,
				long_description_ar: document.getElementById('productLongDescAr').value,
				long_description_en: document.getElementById('productLongDescEn').value,
				details_ar: detailsAr,
				details_en: detailsEn,
				price_ar: document.getElementById('productPriceAr').value,
				price_en: document.getElementById('productPriceEn').value,
				type_ar: document.getElementById('productTypeAr').value,
				type_en: document.getElementById('productTypeEn').value,
				category_ar: document.getElementById('productCategoryAr').value,
				category_en: document.getElementById('productCategoryEn').value,
				project_id: projectId
			};
			let productId = id;
			let err;
			if (!productId) {
				const { data: newProduct, error: insertErr } = await supabase.from('products').insert(payload).select().single();
				if (insertErr) { showToast(insertErr.message, true); return; }
				productId = newProduct.id;
			} else {
				err = (await supabase.from('products').update(payload).eq('id', productId)).error;
				if (err) { showToast(err.message, true); return; }
			}
			await supabase.from('product_variants').delete().eq('product_id', productId);
			for (let i = 0; i < state.currentVariants.length; i++) {
				const rowEl = document.querySelectorAll('#variantsContainer .variant-row')[i];
				if (!rowEl) continue;
				const v = {
					label_ar: rowEl.querySelector('.variant-label-ar')?.value || '',
					label_en: rowEl.querySelector('.variant-label-en')?.value || '',
					price_ar: rowEl.querySelector('.variant-price-ar')?.value || '',
					price_en: rowEl.querySelector('.variant-price-en')?.value || '',
					is_default: !!rowEl.querySelector('.variant-default')?.checked
				};
				if (v.label_ar || v.label_en) {
					await supabase.from('product_variants').insert({
						product_id: productId,
						label_ar: v.label_ar,
						label_en: v.label_en,
						price_ar: v.price_ar,
						price_en: v.price_en,
						is_default: v.is_default
					});
				}
			}
			showToast('تم حفظ المنتج');
			document.getElementById('productModal').classList.remove('active');
			loadProducts();
			loadStats();
		}

				let query = supabase
					.from('project_registrations')
					.select('*', { count: 'exact' })
					.order('created_at', { ascending: false })

				if (search) query = query.or(`project_name.ilike.%${search}%,whatsapp.ilike.%${search}%,ip.ilike.%${search}%`);

				if (status !== 'all') query = query.eq('status', status);

				if (error) throw error;
				state.regTotal = count || 0;
				const container = document.getElementById('registrationsTableContainer');

		async function loadOrders(page = 1) {

			try {
				let query = supabase
					.from('admin_order_logs')
					.select('*', { count: 'exact' })
					.order('created_at', { ascending: false })
					.range((page - 1) * 10, page * 10 - 1);

				const projectFilter = document.getElementById('ordersProjectFilter').value;

				const { data, error, count } = await query;
				if (error) throw error;
				state.ordersTotal = count || 0;
				const container = document.getElementById('ordersTableContainer');
				if (!data || data.length === 0) { container.innerHTML = '<div class="no-data">لا توجد طلبات</div>'; document.getElementById('ordersPagination').innerHTML = ''; return; }

				for (const order of data) {
					let itemsPreview = '';
					if (order.items && Array.isArray(order.items)) {
						itemsPreview = order.items.map(it => `${it.productName} × ${it.quantity}`).join(', ');
					}
					html += `<tr>
						<td class="order-id">${escapeHtml(order.order_number)}</td>

				let pagHtml = '<div class="pagination">';
				for (let i = 1; i <= totalPages; i++) pagHtml += `<button onclick="window.loadOrders(${i})" ${i === page ? 'class="active"' : ''}>${i}</button>`;

				showToast(e.message, true);

				state.isLoading = false;

		function downloadCSV(rows, filename) {
			const csvContent = rows.map(row => row.join(',')).join('\n');
			const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
			const link = document.createElement('a');
			const url = URL.createObjectURL(blob);
			link.href = url;
			link.setAttribute('download', `${filename}.csv`);
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
			URL.revokeObjectURL(url);
			showToast('تم التصدير بنجاح');
		}

		// ===== التراخيص =====
		async function loadLicenseRequests() {
			const status = document.getElementById('licenseStatusFilter').value;
			let query = supabase
				.from('project_license_requests')
				.select('*, projects(id, name_ar, name_en, owner_user_id, license_status)')
				.order('created_at', { ascending: false });
			if (status !== 'all') query = query.eq('status', status);
			const { data, error } = await query;
			if (error) { console.error(error); showToast('خطأ في تحميل طلبات التراخيص', true); return; }
			const container = document.getElementById('licensesTableContainer');
			if (!data || data.length === 0) { container.innerHTML = '<div class="no-data">لا توجد طلبات تراخيص</div>'; return; }
			let html = `<div class="table-wrapper"><table class="data-table"><thead><tr>
				<th>المشروع</th><th>صاحب المشروع</th><th>ملف الرخصة</th><th>حالة الطلب</th><th>حالة الترخيص</th><th>تاريخ الرفع</th><th>الإجراءات</th>
			</tr></thead><tbody>`;
			for (const req of data) {
				const project = req.projects;
				const projectName = project?.name_ar || 'مشروع محذوف';
				const ownerId = project?.owner_user_id || 'غير معروف';
				let statusText = '', badgeClass = '';
				if (req.status === 'pending') { statusText = 'قيد المراجعة'; badgeClass = 'badge-pending'; }
				else if (req.status === 'approved') { statusText = 'موافق'; badgeClass = 'badge-approved'; }
				else if (req.status === 'rejected') { statusText = 'مرفوض'; badgeClass = 'badge-rejected'; }
				else { statusText = escapeHtml(req.status || '-'); badgeClass = 'badge-reviewed'; }
				const licenseStatus = project?.license_status || '-';
				let licenseBadgeClass = 'badge-reviewed';
				let licenseStatusText = licenseStatus;
				if (licenseStatus === 'license_approved') licenseBadgeClass = 'badge-approved';
				else if (licenseStatus === 'license_rejected') licenseBadgeClass = 'badge-rejected';
				else if (licenseStatus === 'pending_license' || licenseStatus === 'license_uploaded') licenseBadgeClass = 'badge-pending';
				else if (licenseStatus === 'suspended') licenseBadgeClass = 'badge-rejected';
				html += `<tr>
					<td>${escapeHtml(projectName)}</td>
					<td>${escapeHtml(ownerId)}</td>
					<td>${req.license_file_url ? `<a href="${escapeHtml(req.license_file_url)}" target="_blank" class="btn-outline" style="padding:4px 12px; text-decoration:none;">📄 عرض الملف</a>` : '-'}</td>
					<td><span class="badge ${badgeClass}">${statusText}</span></td>
					<td><span class="badge ${licenseBadgeClass}">${escapeHtml(licenseStatusText)}</span></td>
					<td>${req.created_at ? new Date(req.created_at).toLocaleString() : '-'}</td>
					<td class="action-buttons">
						<button class="action-btn approve" onclick="window.reviewLicense('${req.id}', 'approve')" title="قبول"><i class="fas fa-check-circle"></i></button>
						<button class="action-btn reject" onclick="window.reviewLicense('${req.id}', 'reject')" title="رفض"><i class="fas fa-times-circle"></i></button>
					</td>
				</tr>`;
			}
			html += `</tbody></table></div>`;
			container.innerHTML = html;
		}

		window.reviewLicense = async (requestId, action) => {
			const newStatus = (action === 'approve') ? 'approved' : 'rejected';
			const projectLicenseStatus = (action === 'approve') ? 'license_approved' : 'license_rejected';
			const { error: updateReq } = await supabase.from('project_license_requests').update({ status: newStatus }).eq('id', requestId);
			if (updateReq) { showToast(updateReq.message, true); return; }
			const { data: reqData, error: reqFetchError } = await supabase.from('project_license_requests').select('project_id').eq('id', requestId).single();
			if (reqFetchError) { showToast(reqFetchError.message, true); return; }
			if (reqData && reqData.project_id) {
				const projUpdate = { license_status: projectLicenseStatus, license_reviewed_at: new Date().toISOString() };
				if (action === 'reject') {
					const reason = prompt('سبب الرفض (اختياري):') || '';
					projUpdate.rejection_reason = reason.trim() || null;
				} else {
					projUpdate.rejection_reason = null;
				}
				const { error: projErr } = await supabase.from('projects').update(projUpdate).eq('id', reqData.project_id);
				if (projErr) { showToast(projErr.message, true); return; }
			}
			showToast(`تم ${action === 'approve' ? 'قبول' : 'رفض'} الرخصة بنجاح`);
			await loadLicenseRequests();
			await loadProjects(state.currentProjectsPage);
			await loadStats();
		};

		// ===== الدعم الفني =====
		async function loadSupportTickets() {
			const status = document.getElementById('supportStatusFilter').value;
			let query = supabase.from('support_tickets').select('*, projects(name_ar)').order('created_at', { ascending: false });
			if (status !== 'all') query = query.eq('status', status);
			const { data, error } = await query;
			if (error) { showToast(error.message, true); return; }
			const container = document.getElementById('supportTicketsContainer');
			if (!data || data.length === 0) { container.innerHTML = '<div class="no-data">لا توجد تذاكر دعم</div>'; return; }
			let html = `<div class="table-wrapper"><table class="data-table"><thead><tr><th>#</th><th>المشروع</th><th>الموضوع</th><th>الحالة</th><th>التاريخ</th><th>الإجراءات</th></tr></thead><tbody>`;
			for (const ticket of data) {
				const statusClass = ticket.status === 'open' ? 'badge-pending' : (ticket.status === 'in_progress' ? 'badge-pending' : 'badge-approved');
				const statusText = ticket.status === 'open' ? 'مفتوحة' : (ticket.status === 'in_progress' ? 'قيد المعالجة' : 'مغلقة');
				html += `<tr>
					<td>${escapeHtml(ticket.id)}</td>
					<td>${escapeHtml(ticket.projects?.name_ar || '?')}</td>
					<td>${escapeHtml(ticket.subject)}</td>
					<td><span class="badge ${statusClass}">${statusText}</span></td>
					<td>${ticket.created_at ? new Date(ticket.created_at).toLocaleString() : '-'}</td>
					<td><button class="view-details-btn" onclick="window.viewSupportTicket('${escapeHtml(ticket.id)}')">رد/عرض</button></td>
				</tr>`;
			}
			html += `</tbody></table></div>`;
			container.innerHTML = html;
		}

		window.viewSupportTicket = async (id) => {
			const { data: ticket, error } = await supabase.from('support_tickets').select('*').eq('id', id).single();
			if (error || !ticket) { showToast('خطأ في جلب التذكرة', true); return; }
			document.getElementById('ticketReplyBody').innerHTML = `
				<div style="margin-bottom:20px;">
					<p><strong>Project ID:</strong> ${escapeHtml(ticket.project_id || '?')}</p>
					<p><strong>الموضوع:</strong> ${escapeHtml(ticket.subject)}</p>
					<p><strong>الرسالة:</strong><br>${escapeHtml(ticket.message)}</p>
					<p><strong>التاريخ:</strong> ${ticket.created_at ? new Date(ticket.created_at).toLocaleString() : '-'}</p>
					${ticket.admin_reply ? `<div style="background:#f0f0f0; padding:12px; border-radius:16px; margin-top:15px;"><strong>رد الإدارة السابق:</strong><br>${escapeHtml(ticket.admin_reply)}</div>` : ''}
				</div>
				<div class="form-row"><label>الرد الجديد (اتركه فارغاً إذا لم ترد)</label><textarea id="ticketReplyText" rows="4"></textarea></div>
				<div class="form-row"><label>تغيير الحالة</label><select id="ticketStatusSelect"><option value="open" ${ticket.status === 'open' ? 'selected' : ''}>مفتوحة</option><option value="in_progress" ${ticket.status === 'in_progress' ? 'selected' : ''}>قيد المعالجة</option><option value="closed" ${ticket.status === 'closed' ? 'selected' : ''}>مغلقة</option></select></div>
				<div class="action-buttons"><button class="btn-save" onclick="window.submitTicketReply('${escapeHtml(ticket.id)}')">حفظ التغييرات</button></div>
			`;
			document.getElementById('ticketReplyModal').classList.add('active');
		};

		window.submitTicketReply = async (id) => {
			const reply = document.getElementById('ticketReplyText').value;
			const newStatus = document.getElementById('ticketStatusSelect').value;
			const updateData = { status: newStatus };
			if (reply.trim()) updateData.admin_reply = reply;
			const { error } = await supabase.from('support_tickets').update(updateData).eq('id', id);
			if (error) { showToast(error.message, true); return; }
			showToast('تم تحديث التذكرة');
			document.getElementById('ticketReplyModal').classList.remove('active');
			loadSupportTickets();
		};

		// ===== تهيئة القوائم =====
		async function initEmirateFilter() {
			const { data } = await supabase.from('projects').select('emirate');
			const unique = [...new Set((data || []).map(p => p.emirate).filter(Boolean))];
			const select = document.getElementById('projectEmirateFilter');
			select.innerHTML = '<option value="">كل الإمارات</option>';
			unique.forEach(e => { const opt = document.createElement('option'); opt.value = e; opt.textContent = e; select.appendChild(opt); });
		}

		async function initProjectSelects() {
			const { data } = await supabase.from('projects').select('id, name_ar').order('id', { ascending: false });
			if (!data) return;
			const fillSelect = (id) => {
				const sel = document.getElementById(id);
				if (!sel) return;
				sel.innerHTML = '<option value="">اختر المشروع</option>';
				data.forEach(p => { const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name_ar; sel.appendChild(opt); });
			};
			fillSelect('productProjectFilter');
			fillSelect('dealProjectFilter');
			fillSelect('contactProjectFilter');
			const ordersFilter = document.getElementById('ordersProjectFilter');
			if (ordersFilter) {
				ordersFilter.innerHTML = '<option value="">كل المشاريع</option>';
				data.forEach(p => { const opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name_ar; ordersFilter.appendChild(opt); });
			}
		}

		function fillCategoryDropdowns() {
			const projectCatAr = document.getElementById('projectCategoryAr');
			const projectCatEn = document.getElementById('projectCategoryEn');
			if (projectCatAr) projectCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c => `<option value="${c}">${c}</option>`).join('');
			if (projectCatEn) projectCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c => `<option value="${c}">${c}</option>`).join('');
			const prodCatAr = document.getElementById('productCategoryAr');
			const prodCatEn = document.getElementById('productCategoryEn');
			if (prodCatAr) prodCatAr.innerHTML = '<option value="">-- اختر --</option>' + CATEGORIES_AR.map(c => `<option value="${c}">${c}</option>`).join('');
			if (prodCatEn) prodCatEn.innerHTML = '<option value="">-- Select --</option>' + CATEGORIES_EN.map(c => `<option value="${c}">${c}</option>`).join('');
		}

		// ===== التبويبات =====
		function attachTabs() {
			const tabMap = {
				'registrations': loadRegistrations,
				'projects': () => loadProjects(1),
				'products': loadProducts,
				'deals': loadDeals,
				'contacts': loadContacts,
				'feedbacks': loadFeedbacks,
				'orders': () => loadOrders(1),
				'licenses': loadLicenseRequests,
				'support': loadSupportTickets
			};
			const refreshMap = {
				'refreshRegBtn': loadRegistrations,
				'refreshProjectsBtn': () => loadProjects(1),
				'refreshProductsBtn': loadProducts,
				'refreshDealsBtn': loadDeals,
				'refreshContactsBtn': loadContacts,
				'refreshFeedbacksBtn': loadFeedbacks,
				'refreshOrdersBtn': () => loadOrders(1),
				'refreshLicensesBtn': loadLicenseRequests,
				'refreshSupportBtn': loadSupportTickets
			};

			document.querySelectorAll('.tab-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
					btn.classList.add('active');
					document.querySelectorAll('.content-card').forEach(c => c.classList.remove('active'));
					const tabId = btn.dataset.tab;
					document.getElementById(tabId + 'Tab').classList.add('active');
					state.currentTab = tabId;
					const loadFn = tabMap[tabId];
					if (loadFn) loadFn();
				});
			});

			// أزرار التحديث
			Object.keys(refreshMap).forEach(id => {
				const btn = document.getElementById(id);
				if (btn) btn.addEventListener('click', () => { const fn = refreshMap[id]; if (fn) fn(); });
			});

			// أزرار التصدير
			const exportMap = {
				'exportRegBtn': exportRegistrationsCSV,
				'exportOrdersBtn': exportOrdersCSV,
				'exportProjectsBtn': exportProjectsCSV,
				'exportProductsBtn': exportProductsCSV,
				'exportDealsBtn': exportDealsCSV,
				'exportLicensesBtn': exportLicensesCSV,
				'exportSupportBtn': exportSupportCSV
			};
			Object.keys(exportMap).forEach(id => {
				const btn = document.getElementById(id);
				if (btn) btn.addEventListener('click', () => { const fn = exportMap[id]; if (fn) fn(); });
			});
		}

		// ===== حفظ المشروع =====
		async function saveProject(e) {
			e.preventDefault();
			const id = document.getElementById('projectId').value;
			const payload = {
				name_ar: document.getElementById('projectNameAr').value,
				name_en: document.getElementById('projectNameEn').value,
				emirate: document.getElementById('projectEmirate').value,
				image: document.getElementById('projectImage').value,
				description_ar: document.getElementById('projectDescAr').value,
				description_en: document.getElementById('projectDescEn').value,
				long_description_ar: document.getElementById('projectLongDescAr').value,
				long_description_en: document.getElementById('projectLongDescEn').value,
				adra_license: document.getElementById('projectLicense').checked,
				status: document.getElementById('projectStatus').value,
				category_ar: document.getElementById('projectCategoryAr').value,
				category_en: document.getElementById('projectCategoryEn').value
			};
			let error;
			if (id) error = (await supabase.from('projects').update(payload).eq('id', id)).error;
			else error = (await supabase.from('projects').insert(payload)).error;
			if (error) showToast(error.message, true);
			else { showToast('تم حفظ المشروع'); document.getElementById('projectModal').classList.remove('active'); loadProjects(state.currentProjectsPage); loadStats(); initProjectSelects(); }
		}

		// ===== أحداث =====
		document.getElementById('addProjectBtn').onclick = () => {
			document.getElementById('projectForm').reset();
			document.getElementById('projectId').value = '';
			document.getElementById('projectStatus').value = 'active';
			document.getElementById('projectModal').classList.add('active');
		};
		document.getElementById('addProductBtn').onclick = () => {
			const pid = document.getElementById('productProjectFilter').value;
			if (!pid) { showToast('اختر مشروعاً أولاً', true); return; }
			document.getElementById('productForm').reset();
			document.getElementById('productId').value = '';
			document.getElementById('productProjectId').value = pid;
			state.currentVariants = [];
			renderVariants();
			document.getElementById('productModal').classList.add('active');
		};
		document.getElementById('addDealBtn').onclick = () => {
			const pid = document.getElementById('dealProjectFilter').value;
			if (!pid) { showToast('اختر مشروعاً', true); return; }
			document.getElementById('dealForm').reset();
			document.getElementById('dealId').value = '';
			document.getElementById('dealProjectId').value = pid;
			document.getElementById('dealModal').classList.add('active');
		};
		document.getElementById('reorderProjectsBtn').onclick = () => window.reorderAllProjects();
		document.getElementById('reorderProductsBtn').onclick = () => window.reorderAllProducts();

		document.getElementById('productProjectFilter').addEventListener('change', () => loadProducts());
		document.getElementById('dealProjectFilter').addEventListener('change', () => loadDeals());
		document.getElementById('contactProjectFilter').addEventListener('change', () => loadContacts());

		document.getElementById('projectSearch').addEventListener('input', () => loadProjects(1));
		document.getElementById('projectEmirateFilter').addEventListener('change', () => loadProjects(1));
		document.getElementById('projectStatusFilter').addEventListener('change', () => loadProjects(1));
		document.getElementById('feedbackStatusFilter').addEventListener('change', () => loadFeedbacks());
		document.getElementById('regStatusFilter').addEventListener('change', () => loadRegistrations(1));
		document.getElementById('regSearch').addEventListener('input', () => loadRegistrations(1));
		document.getElementById('ordersSearch').addEventListener('input', () => loadOrders(1));
		document.getElementById('ordersProjectFilter').addEventListener('change', () => loadOrders(1));
		document.getElementById('licenseStatusFilter').addEventListener('change', () => loadLicenseRequests());
		document.getElementById('supportStatusFilter').addEventListener('change', () => loadSupportTickets());

		document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', () => {
			document.getElementById(btn.dataset.modal).classList.remove('active');
		}));
		window.onclick = (e) => { if (e.target.classList.contains('modal')) e.target.classList.remove('active'); };

		document.getElementById('projectForm').addEventListener('submit', saveProject);
		document.getElementById('productForm').addEventListener('submit', saveProduct);
		document.getElementById('dealForm').addEventListener('submit', saveDeal);

		// زر تحديث الكل
		document.getElementById('refreshAllBtn').addEventListener('click', () => {
			loadStats();
			loadProjects(state.currentProjectsPage);
			loadRegistrations(state.currentRegPage);
			loadOrders(state.currentOrdersPage);
			loadProducts();
			loadDeals();
			loadContacts();
			loadFeedbacks();
			loadLicenseRequests();
			loadSupportTickets();
			showToast('تم تحديث جميع البيانات');
		});

		// ===== تسجيل الدخول =====
		document.getElementById('loginBtn').onclick = async () => {
			const email = document.getElementById('adminEmail').value;
			const pwd = document.getElementById('adminPassword').value;
			const { error, data } = await supabase.auth.signInWithPassword({ email, password: pwd });
			if (error || data?.user?.email !== ALLOWED_EMAIL) {
				document.getElementById('loginError').innerText = 'بيانات الدخول غير صحيحة';
			} else {
				document.getElementById('loginError').innerText = '';
				await checkSession();
			}
		};

		document.getElementById('logoutBtn').onclick = async () => {
			await supabase.auth.signOut();
			location.reload();
		};

		document.getElementById('forgotPasswordLink')?.addEventListener('click', async (e) => {
			e.preventDefault();
			const email = document.getElementById('adminEmail').value;
			if (!email || !email.includes('@')) { alert('الرجاء إدخال البريد الإلكتروني أولاً'); return; }
			const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: 'https://souqalmasharie.onrender.com/reset-password.html' });
			if (error) alert('حدث خطأ: ' + error.message);
			else alert('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
		});

		// ===== التحقق من الجلسة =====
		async function checkSession() {
			const { data: { session } } = await supabase.auth.getSession();
			if (session && session.user?.email === ALLOWED_EMAIL) {
				document.getElementById('loginSection').style.display = 'none';
				document.getElementById('adminContent').style.display = 'block';
				fillCategoryDropdowns();
				await initEmirateFilter();
				await initProjectSelects();
				await loadStats();
				await loadProjects(1);
				await loadRegistrations(1);
				await loadProducts();
				await loadDeals();
				await loadContacts();
				await loadFeedbacks();
				await loadOrders(1);
				await loadLicenseRequests();
				await loadSupportTickets();
				attachTabs();
			}
		}

		checkSession();

		// ===== ربط الدوال العامة =====
		window.loadProjects = loadProjects;
		window.loadProducts = loadProducts;
		window.loadOrders = loadOrders;
		window.loadRegistrations = loadRegistrations;
		window.loadLicenseRequests = loadLicenseRequests;
		window.loadSupportTickets = loadSupportTickets;
		window.editProject = editProject;
		window.editProduct = editProduct;
		window.editDeal = editDeal;
		window.deleteItem = deleteItem;
		window.updateRegStatus = updateRegStatus;
		window.updateFeedbackStatus = updateFeedbackStatus;
		window.updateProjectLicenseStatus = updateProjectLicenseStatus;
		window.reviewLicense = reviewLicense;
		window.showOrderDetails = showOrderDetails;
		window.showRegDetails = showRegDetails;
		window.viewSupportTicket = viewSupportTicket;
		window.submitTicketReply = submitTicketReply;
		window.swapProjectOrder = swapProjectOrder;
		window.swapProductOrder = swapProductOrder;
		window.reorderAllProjects = reorderAllProjects;
		window.reorderAllProducts = reorderAllProducts;
	</script>

</body>
</html>
