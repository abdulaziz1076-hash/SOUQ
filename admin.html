<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

                <div><label class="block font-semibold mb-1">العنوان (إنجليزي)</label><input id="dealTitleEn" required class="w-full border rounded-xl p-3"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { APP_CONFIG } from './config.js';
        
        const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
        const ALLOWED_EMAIL = 'abdulaziz1076@gmail.com';
        let charts = {};

        // ============ TOOLS ============
        function showToast(msg, isErr = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 left-1/2 transform -translate-x-1/2 ${isErr ? 'bg-red-500' : 'bg-teal-700'} text-white px-6 py-3 rounded-full shadow-lg z-50 toast`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('modal-active');
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('modal-active');
        }

        window.closeModal = closeModal;

        // ============ LOAD STATS ============
        async function loadStats() {
            const { count: projectsCount } = await supabase.from('projects').select('*', { count: 'exact', head: true });
            const { count: productsCount } = await supabase.from('products').select('*', { count: 'exact', head: true });
            const { count: feedbacksCount } = await supabase.from('feedbacks').select('*', { count: 'exact', head: true });
            const { count: totalRegs } = await supabase.from('project_registrations').select('*', { count: 'exact', head: true });
            const { count: pendingRegs } = await supabase.from('project_registrations').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            
            document.getElementById('statsContainer').innerHTML = `
                <div class="bg-white rounded-2xl p-4 shadow-sm"><i class="fas fa-store text-2xl text-teal-600 mb-2"></i><div class="text-2xl font-bold">${projectsCount||0}</div><div class="text-gray-500">مشاريع</div></div>
                <div class="bg-white rounded-2xl p-4 shadow-sm"><i class="fas fa-box text-2xl text-teal-600 mb-2"></i><div class="text-2xl font-bold">${productsCount||0}</div><div class="text-gray-500">منتجات</div></div>
                <div class="bg-white rounded-2xl p-4 shadow-sm"><i class="fas fa-clipboard-list text-2xl text-teal-600 mb-2"></i><div class="text-2xl font-bold">${totalRegs||0}</div><div class="text-gray-500">طلبات</div></div>
                <div class="bg-white rounded-2xl p-4 shadow-sm"><i class="fas fa-clock text-2xl text-orange-500 mb-2"></i><div class="text-2xl font-bold">${pendingRegs||0}</div><div class="text-gray-500">معلقة</div></div>
                <div class="bg-white rounded-2xl p-4 shadow-sm"><i class="fas fa-comment-dots text-2xl text-teal-600 mb-2"></i><div class="text-2xl font-bold">${feedbacksCount||0}</div><div class="text-gray-500">شكاوى</div></div>
            `;
        }

        // ============ ANALYTICS ============
        async function loadAnalytics() {
            const { data: events, error } = await supabase.from('analytics_events').select('*').order('created_at', { ascending: false }).limit(200);
            if (error || !events) return;

            // زيارات لكل دقيقة
            const byMinute = {};
            events.forEach(ev => { let key = ev.created_at?.slice(0,16); if(key) byMinute[key] = (byMinute[key]||0)+1; });
            const labels = Object.keys(byMinute).slice(-10).map(k => k.slice(11,16));
            const dataPoints = labels.map((_,i) => Object.values(byMinute).slice(-10)[i] || 0);
            if (charts.visitsChart) charts.visitsChart.destroy();
            charts.visitsChart = new Chart(document.getElementById('visitsChart'), { type: 'line', data: { labels, datasets: [{ label: 'زيارات', data: dataPoints, borderColor: '#0f766e', tension: 0.3 }] } });

            // المصادر
            const sources = { 'مباشر':0, 'جوجل':0, 'وسائل تواصل':0, 'آخر':0 };
            events.forEach(ev => {
                let ref = ev.referrer || '';
                if (ref.includes('google')) sources['جوجل']++;
                else if (ref.includes('facebook') || ref.includes('instagram') || ref.includes('x.com')) sources['وسائل تواصل']++;
                else if (ref === '' || ref === 'direct') sources['مباشر']++;
                else sources['آخر']++;
            });
            if (charts.sourcesChart) charts.sourcesChart.destroy();
            charts.sourcesChart = new Chart(document.getElementById('sourcesChart'), { type: 'doughnut', data: { labels: Object.keys(sources), datasets: [{ data: Object.values(sources), backgroundColor: ['#0f766e','#facc15','#3b82f6','#9ca3af'] }] } });

            // الأجهزة
            const devices = { 'حاسوب':0, 'جوال':0, 'تابلت':0 };
            events.forEach(ev => {
                if (ev.device?.includes('Mobile')) devices['جوال']++;
                else if (ev.device?.includes('Tablet')) devices['تابلت']++;
                else devices['حاسوب']++;
            });
            if (charts.devicesChart) charts.devicesChart.destroy();
            charts.devicesChart = new Chart(document.getElementById('devicesChart'), { type: 'bar', data: { labels: Object.keys(devices), datasets: [{ data: Object.values(devices), backgroundColor: '#0f766e' }] } });

            // الإمارات (بتحليل ذكي من الصفحات)
            const geo = {};
            events.forEach(ev => {
                const match = ev.page?.match(/emirate\/([^/]+)/);
                if (match) {
                    const em = decodeURIComponent(match[1]);
                    if (em && em !== 'all') geo[em] = (geo[em] || 0) + 1;
                }
            });
            const geoLabels = Object.keys(geo);
            const geoData = Object.values(geo);
            if (charts.geoChart) charts.geoChart.destroy();
            charts.geoChart = new Chart(document.getElementById('geoChart'), { 
                type: 'pie', 
                data: { 
                    labels: geoLabels.length ? geoLabels : ['غير متوفر'], 
                    datasets: [{ data: geoData.length ? geoData : [1], backgroundColor: ['#0f766e','#facc15','#3b82f6','#ef4444','#8b5cf6'] }] 
                } 
            });

            // الجدول الزمني
            document.querySelector('#recentVisitsTable tbody').innerHTML = events.slice(0,20).map(ev => `
                <tr class="border-b hover:bg-gray-50"><td class="py-2">${ev.page || '-'}</td><td>${ev.referrer || 'مباشر'}</td><td>${ev.device || '-'}</td><td>${new Date(ev.created_at).toLocaleString()}</td></tr>
            `).join('');
        }

        // ============ REGISTRATIONS ============
        async function loadRegistrations() {
            const status = document.getElementById('regStatusFilter').value;
            let query = supabase.from('project_registrations').select('*').order('created_at', { ascending: false });
            if (status !== 'all') query = query.eq('status', status);
            const { data } = await query;
            const container = document.getElementById('registrationsTableContainer');
            if (!data?.length) { container.innerHTML = '<p class="text-gray-500 p-4">لا توجد طلبات.</p>'; return; }
            container.innerHTML = `<table class="w-full text-sm"><thead><tr class="border-b"><th>اسم المشروع</th><th>الإمارة</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${data.map(reg => `
                <tr class="border-b"><td>${reg.project_name}</td><td>${reg.emirate}</td><td><span class="px-2 py-1 rounded-full text-xs ${reg.status==='approved'?'bg-green-100 text-green-700':reg.status==='rejected'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${reg.status}</span></td><td>${new Date(reg.created_at).toLocaleString()}</td>
                <td class="flex gap-2"><button class="text-green-600" onclick="window.updateRegStatus(${reg.id}, 'approved')"><i class="fas fa-check"></i></button><button class="text-red-600" onclick="window.updateRegStatus(${reg.id}, 'rejected')"><i class="fas fa-times"></i></button></td></tr>
            `).join('')}</tbody></table>`;
        }
        window.updateRegStatus = async (id, status) => { await supabase.from('project_registrations').update({ status }).eq('id', id); loadRegistrations(); loadStats(); };

        // ============ PROJECTS ============
        let projectsPage = 1;
        async function loadProjects(page = 1) {
            projectsPage = page;
            const search = document.getElementById('projectSearch').value;
            const emirate = document.getElementById('projectEmirateFilter').value;
            let query = supabase.from('projects').select('*', { count: 'exact' }).order('id', { ascending: false }).range((page-1)*10, page*10-1);
            if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);
            if (emirate) query = query.eq('emirate', emirate);
            const { data, count } = await query;
            const container = document.getElementById('projectsTableContainer');
            container.innerHTML = `<table class="w-full text-sm"><thead><tr class="border-b"><th>ID</th><th>صورة</th><th>الاسم</th><th>الإمارة</th><th>إجراءات</th></tr></thead><tbody>${(data||[]).map(p => `
                <tr class="border-b"><td>${p.id}</td><td>${p.image?`<img src="${p.image}" class="w-10 h-10 rounded-lg object-cover">`:'-'}</td><td>${p.name_ar}</td><td>${p.emirate}</td>
                <td class="flex gap-2"><button class="text-blue-600" onclick="window.editProject(${p.id})"><i class="fas fa-edit"></i></button><button class="text-red-600" onclick="window.deleteItem('projects',${p.id})"><i class="fas fa-trash"></i></button></td></tr>
            `).join('')}</tbody></table>`;
            document.getElementById('projectsPagination').innerHTML = Array.from({length: Math.ceil(count/10)}, (_,i)=> `<button class="px-3 py-1 rounded ${i+1===page?'bg-teal-700 text-white':'bg-gray-200'}" onclick="window.loadProjects(${i+1})">${i+1}</button>`).join('');
        }
        window.loadProjects = loadProjects;
        window.editProject = async (id) => {
            const { data } = await supabase.from('projects').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('projectId').value = data.id;
                document.getElementById('projectNameAr').value = data.name_ar;
                document.getElementById('projectNameEn').value = data.name_en;
                document.getElementById('projectEmirate').value = data.emirate;
                document.getElementById('projectImage').value = data.image||'';
                document.getElementById('projectLicense').checked = data.adra_license;
                document.getElementById('projectStatus').value = data.status;
                openModal('projectModal');
            }
        };
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const payload = {
                name_ar: document.getElementById('projectNameAr').value,
                name_en: document.getElementById('projectNameEn').value,
                emirate: document.getElementById('projectEmirate').value,
                image: document.getElementById('projectImage').value,
                adra_license: document.getElementById('projectLicense').checked,
                status: document.getElementById('projectStatus').value
            };
            if (id) {
                await supabase.from('projects').update(payload).eq('id', id);
            } else {
                // إذا كان id bigint غير تلقائي، نرسل null وسيحدث خطأ. الحل: نتحقق إن كان bigserial أم لا.
                // لكن لتجنب التعقيد، نستخدم supabase ونعتمد على auto-increment إن وجد.
                const { error } = await supabase.from('projects').insert(payload);
                if (error) showToast(error.message, true);
            }
            closeModal('projectModal');
            loadProjects(projectsPage);
            loadStats();
            showToast('تم الحفظ');
        });

        // ============ DELETE ============
        window.deleteItem = async (table, id) => {
            if (confirm('تأكيد الحذف؟')) {
                await supabase.from(table).delete().eq('id', id);
                showToast('تم الحذف');
                if (table === 'projects') loadProjects(projectsPage);
                else if (table === 'products') loadProducts();
                else if (table === 'deals') loadDeals();
                loadStats();
            }
        };

        // ============ PRODUCTS ============
        async function loadProducts() {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) return;
            const { data } = await supabase.from('products').select('*').eq('project_id', projectId);
            document.getElementById('productsTableContainer').innerHTML = `<table class="w-full text-sm"><thead><tr class="border-b"><th>صورة</th><th>الاسم</th><th>السعر</th><th>إجراءات</th></tr></thead><tbody>${(data||[]).map(p => `
                <tr class="border-b"><td>${p.main_image?`<img src="${p.main_image}" class="w-10 h-10 rounded-lg">`:'-'}</td><td>${p.name_ar}</td><td>${p.price_ar||'-'}</td>
                <td class="flex gap-2"><button class="text-blue-600" onclick="window.editProduct('${p.id}')"><i class="fas fa-edit"></i></button><button class="text-red-600" onclick="window.deleteItem('products','${p.id}')"><i class="fas fa-trash"></i></button></td></tr>
            `).join('')}</tbody></table>`;
        }
        window.editProduct = async (id) => {
            const { data } = await supabase.from('products').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('productId').value = data.id;
                document.getElementById('productProjectId').value = data.project_id;
                document.getElementById('productNameAr').value = data.name_ar;
                document.getElementById('productNameEn').value = data.name_en;
                document.getElementById('productMainImage').value = data.main_image||'';
                document.getElementById('productImages').value = (data.images||[]).join(',');
                document.getElementById('productPriceAr').value = data.price_ar||'';
                document.getElementById('productPriceEn').value = data.price_en||'';
                document.getElementById('productDetailsAr').value = (data.details_ar||[]).join('\n');
                openModal('productModal');
            }
        };
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const projectId = document.getElementById('productProjectId').value;
            const payload = {
                name_ar: document.getElementById('productNameAr').value,
                name_en: document.getElementById('productNameEn').value,
                main_image: document.getElementById('productMainImage').value,
                images: document.getElementById('productImages').value.split(',').map(s=>s.trim()).filter(Boolean),
                price_ar: document.getElementById('productPriceAr').value,
                price_en: document.getElementById('productPriceEn').value,
                details_ar: document.getElementById('productDetailsAr').value.split('\n'),
                project_id: projectId
            };
            if (id) {
                await supabase.from('products').update(payload).eq('id', id);
            } else {
                // توليد ID فريد تلقائياً لتجنب null
                payload.id = crypto.randomUUID();
                await supabase.from('products').insert(payload);
            }
            closeModal('productModal');
            loadProducts();
            loadStats();
            showToast('تم الحفظ');
        });

        // ============ DEALS ============
        async function loadDeals() {
            const projectId = document.getElementById('dealProjectFilter').value;
            if (!projectId) return;
            const { data } = await supabase.from('deals').select('*').eq('project_id', projectId);
            document.getElementById('dealsTableContainer').innerHTML = `<table class="w-full text-sm"><thead><tr class="border-b"><th>صورة</th><th>العنوان</th><th>إجراءات</th></tr></thead><tbody>${(data||[]).map(d => `
                <tr class="border-b"><td>${d.image?`<img src="${d.image}" class="w-10 h-10 rounded-lg">`:'-'}</td><td>${d.title_ar}</td>
                <td class="flex gap-2"><button class="text-blue-600" onclick="window.editDeal('${d.id}')"><i class="fas fa-edit"></i></button><button class="text-red-600" onclick="window.deleteItem('deals','${d.id}')"><i class="fas fa-trash"></i></button></td></tr>
            `).join('')}</tbody></table>`;
        }
        window.editDeal = async (id) => {
            const { data } = await supabase.from('deals').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('dealId').value = data.id;
                document.getElementById('dealProjectId').value = data.project_id;
                document.getElementById('dealTitleAr').value = data.title_ar;
                document.getElementById('dealTitleEn').value = data.title_en;
                document.getElementById('dealImage').value = data.image||'';
                document.getElementById('dealDescAr').value = data.description_ar||'';
                openModal('dealModal');
            }
        };
        document.getElementById('dealForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('dealId').value;
            const projectId = document.getElementById('dealProjectId').value;
            const payload = {
                title_ar: document.getElementById('dealTitleAr').value,
                title_en: document.getElementById('dealTitleEn').value,
                image: document.getElementById('dealImage').value,
                description_ar: document.getElementById('dealDescAr').value,
                project_id: projectId
            };
            if (id) {
                await supabase.from('deals').update(payload).eq('id', id);
            } else {
                payload.id = crypto.randomUUID();
                await supabase.from('deals').insert(payload);
            }
            closeModal('dealModal');
            loadDeals();
            loadStats();
            showToast('تم الحفظ');
        });

        // ============ CONTACTS ============
        async function loadContacts() {
            const projectId = document.getElementById('contactProjectFilter').value;
            if (!projectId) return;
            let { data } = await supabase.from('contacts').select('*').eq('project_id', projectId);
            if (!data || !data.length) data = [{ project_id: projectId }];
            const c = data[0];
            document.getElementById('contactsTableContainer').innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    ${['whatsapp','phone','email','instagram','telegram','snapchat','tiktok','facebook','twitter','website'].map(f => `
                        <div><label class="block font-semibold mb-1">${f}</label><input id="edit_${f}" value="${c[f]||''}" class="w-full border rounded-xl p-3"></div>
                    `).join('')}
                </div>
                <button id="saveContactBtn" class="mt-6 w-full bg-teal-700 text-white py-3 rounded-xl font-bold">حفظ التغييرات</button>
            `;
            document.getElementById('saveContactBtn').onclick = async () => {
                const newContact = { project_id: parseInt(projectId) };
                ['whatsapp','phone','email','instagram','telegram','snapchat','tiktok','facebook','twitter','website'].forEach(f => {
                    newContact[f] = document.getElementById(`edit_${f}`).value;
                });
                await supabase.from('contacts').upsert(newContact);
                showToast('تم حفظ بيانات التواصل');
            };
        }

        // ============ FEEDBACKS ============
        async function loadFeedbacks() {
            const status = document.getElementById('feedbackStatusFilter').value;
            let query = supabase.from('feedbacks').select('*').order('created_at', { ascending: false });
            if (status) query = query.eq('status', status);
            const { data } = await query;
            document.getElementById('feedbacksTableContainer').innerHTML = `<table class="w-full text-sm"><thead><tr class="border-b"><th>النوع</th><th>الرسالة</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${(data||[]).map(f => `
                <tr class="border-b"><td>${f.type}</td><td>${f.message}</td><td>${f.status}</td><td>${new Date(f.created_at).toLocaleString()}</td></tr>
            `).join('')}</tbody></table>`;
        }

        // ============ INIT ============
        async function initSelects() {
            const { data: projects } = await supabase.from('projects').select('id, name_ar');
            if (projects) {
                const options = projects.map(p => `<option value="${p.id}">${p.name_ar}</option>`).join('');
                document.getElementById('productProjectFilter').innerHTML = '<option value="">اختر مشروعاً</option>' + options;
                document.getElementById('dealProjectFilter').innerHTML = '<option value="">اختر مشروعاً</option>' + options;
                document.getElementById('contactProjectFilter').innerHTML = '<option value="">اختر مشروعاً</option>' + options;
            }
            const { data: emirates } = await supabase.from('projects').select('emirate');
            const unique = [...new Set((emirates||[]).map(e=>e.emirate))];
            document.getElementById('projectEmirateFilter').innerHTML = '<option value="">كل الإمارات</option>' + unique.map(e => `<option>${e}</option>`).join('');
        }

        // تبويبات
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.tab + 'Tab').classList.remove('hidden');
                if (btn.dataset.tab === 'projects') loadProjects(1);
                else if (btn.dataset.tab === 'products') loadProducts();
                else if (btn.dataset.tab === 'deals') loadDeals();
                else if (btn.dataset.tab === 'contacts') loadContacts();
                else if (btn.dataset.tab === 'feedbacks') loadFeedbacks();
                else if (btn.dataset.tab === 'registrations') loadRegistrations();
                else if (btn.dataset.tab === 'dashboard') loadAnalytics();
            });
        });

        // أزرار إضافية
        document.getElementById('addProjectBtn').onclick = () => { document.getElementById('projectForm').reset(); document.getElementById('projectId').value=''; openModal('projectModal'); };
        document.getElementById('addProductBtn').onclick = () => {
            const pid = document.getElementById('productProjectFilter').value;
            if (!pid) return showToast('اختر مشروعاً أولاً', true);
            document.getElementById('productForm').reset();
            document.getElementById('productId').value='';
            document.getElementById('productProjectId').value = pid;
            openModal('productModal');
        };
        document.getElementById('addDealBtn').onclick = () => {
            const pid = document.getElementById('dealProjectFilter').value;
            if (!pid) return showToast('اختر مشروعاً أولاً', true);
            document.getElementById('dealForm').reset();
            document.getElementById('dealId').value='';
            document.getElementById('dealProjectId').value = pid;
            openModal('dealModal');
        };

        // تصدير CSV (مبسط)
        document.getElementById('exportAnalyticsBtn').onclick = () => showToast('جاري التصدير...');

        // حدث إعادة تعيين كلمة المرور
        document.getElementById('forgotPasswordLink').onclick = async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            if (!email) return showToast('أدخل البريد الإلكتروني أولاً', true);
            const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: `${window.location.origin}/reset-password.html` });
            if (error) showToast(error.message, true);
            else showToast('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');
        };

        // الدخول
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && session.user.email === ALLOWED_EMAIL) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                await initSelects();
                await loadStats();
                await loadAnalytics();
                await loadProjects(1);
            }
        }

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('adminEmail').value;
            const pwd = document.getElementById('adminPassword').value;
            const { error, data } = await supabase.auth.signInWithPassword({ email, password: pwd });
            if (error || data.user.email !== ALLOWED_EMAIL) {
                document.getElementById('loginError').innerText = 'بيانات الدخول غير صحيحة';
            } else {
                checkSession();
            }
        };
        document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };

        checkSession();
    </script>
</body>
</html>
