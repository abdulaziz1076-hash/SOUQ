<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سوق المشاريع – لوحة التحكم</title>

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Sortable.js -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js">
    </script>

    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b2e25;
            --primary-light: #1a5f44;
            --primary-dark: #062019;
            --gold: #D4AF37;
            --gold-light: #e8d08a;
            --gold-dark: #b8972a;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0b2e25;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --transition: 0.25s ease;
            --sidebar-width: 260px;
            --header-height: 72px;
        }

        html {
            font-size: 14px;
        }

        body {
            font-family: 'Almarai', 'Tajawal', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            display: flex;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================================
                   SIDEBAR
                   ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--primary);
            color: #fff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar-header {
            padding: 24px 20px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .sidebar-header h1 span {
            color: var(--gold);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav .nav-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.3);
            padding: 12px 12px 6px;
            font-weight: 700;
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            background: transparent;
            width: 100%;
            text-align: right;
            font-family: inherit;
        }

        .sidebar-nav .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .sidebar-nav .nav-item.active {
            background: var(--gold);
            color: var(--primary);
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .sidebar-nav .nav-item i {
            width: 22px;
            font-size: 1.1rem;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-nav .nav-item .badge-nav {
            margin-right: auto;
            background: rgba(255, 255, 255, 0.15);
            padding: 1px 10px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .sidebar-nav .nav-item.active .badge-nav {
            background: rgba(11, 46, 37, 0.15);
            color: var(--primary);
        }

        .sidebar-footer {
            padding: 16px 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
        }

        .sidebar-footer .user-info .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--gold);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
        }

        .sidebar-footer .user-info .name {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .sidebar-footer .user-info .role {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .sidebar-footer .logout-btn-side {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .sidebar-footer .logout-btn-side:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ============================================================
                   MAIN CONTENT
                   ============================================================ */
        .main-content {
            margin-right: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
                   TOP HEADER
                   ============================================================ */
        .top-header {
            height: var(--header-height);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
        }

        .top-header .page-title {
            font-size: 1.15rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-header .page-title i {
            color: var(--gold);
        }

        .top-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-header .header-actions .refresh-top {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .top-header .header-actions .refresh-top:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(11, 46, 37, 0.2);
        }

        .top-header .header-actions .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-primary);
            cursor: pointer;
            padding: 6px;
        }

        /* ============================================================
                   PAGE CONTENT
                   ============================================================ */
        .page-content {
            flex: 1;
            padding: 24px 32px 40px;
        }

        /* ============================================================
                   STATS GRID
                   ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-card .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .stat-card .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(11, 46, 37, 0.07);
            color: var(--primary);
        }

        .stat-card .stat-icon.gold {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-dark);
        }

        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-card .stat-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-dark);
        }

        /* ============================================================
                   TABS (inside content)
                   ============================================================ */
        .tabs-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px 12px 0 12px;
            border-bottom: 1px solid var(--border-color);
            background: #fafbfc;
        }

        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tab-btn i {
            font-size: 0.95rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(11, 46, 37, 0.04);
        }

        .tab-btn.active {
            color: var(--primary);
            background: #fff;
            box-shadow: 0 -2px 0 var(--gold) inset;
            font-weight: 800;
        }

        .tab-content {
            padding: 22px 24px 28px;
            display: none;
            animation: fadeSlide 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
                   FILTER BAR
                   ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-bar .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            background: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            min-width: 140px;
            transition: var(--transition);
            color: var(--text-primary);
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .filter-bar .btn {
            padding: 8px 18px;
            border-radius: var(--radius-full);
            border: none;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .filter-bar .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(11, 46, 37, 0.2);
        }

        .filter-bar .btn-gold {
            background: var(--gold);
            color: var(--primary);
        }

        .filter-bar .btn-gold:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .filter-bar .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .filter-bar .btn-outline:hover {
            background: var(--bg-body);
            border-color: var(--text-muted);
        }

        .filter-bar .btn-danger {
            background: #dc2626;
            color: #fff;
        }

        .filter-bar .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        /* ============================================================
                   TABLES
                   ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        .data-table th,
        .data-table td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .data-table th {
            background: #f8fafc;
            font-weight: 800;
            color: var(--text-primary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: #fafbfc;
        }

        .data-table .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ============================================================
                   BADGES
                   ============================================================ */
        .badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-approved {
            background: #dcfce7;
            color: #166534;
        }

        .badge-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-reviewed {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-resolved {
            background: #d9f99d;
            color: #3f6212;
        }

        .badge-open {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-closed {
            background: #e5e7eb;
            color: #4b5563;
        }

        .badge-in_progress {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-disabled {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-deleted {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-license-approved {
            background: #dcfce7;
            color: #166534;
        }

        .badge-license-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-license-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-license-uploaded {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-license-suspended {
            background: #fef3c7;
            color: #92400e;
        }

        /* ============================================================
                   THUMBNAILS
                   ============================================================ */
        .thumb-preview {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: var(--transition);
        }

        .thumb-preview:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-md);
        }

        /* ============================================================
                   ACTION BUTTONS
                   ============================================================ */
        .action-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 5px;
            border-radius: var(--radius-sm);
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: transparent;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn.approve {
            color: #166534;
            background: #dcfce7;
        }

        .action-btn.approve:hover {
            background: #bbf7d0;
        }

        .action-btn.reject {
            color: #991b1b;
            background: #fee2e2;
        }

        .action-btn.reject:hover {
            background: #fecaca;
        }

        .action-btn.edit {
            color: #0369a1;
            background: #e0f2fe;
        }

        .action-btn.edit:hover {
            background: #b8dffa;
        }

        .action-btn.delete {
            color: #991b1b;
            background: #fee2e2;
        }

        .action-btn.delete:hover {
            background: #fecaca;
        }

        .action-btn.view {
            color: var(--primary);
            background: #f1f5f9;
        }

        .action-btn.view:hover {
            background: #e2e8f0;
        }

        .action-btn.toggle {
            color: #92400e;
            background: #fef3c7;
        }

        .action-btn.toggle:hover {
            background: #fde68a;
        }

        .action-btn.toggle.active {
            color: #166534;
            background: #dcfce7;
        }

        .action-btn.toggle.active:hover {
            background: #bbf7d0;
        }

        /* ============================================================
                   DRAG & DROP (Sortable)
                   ============================================================ */
        .sortable-row {
            cursor: grab;
            transition: background 0.2s;
        }

        .sortable-row:active {
            cursor: grabbing;
        }

        .sortable-row.sortable-chosen {
            background: #fef9e6 !important;
            border: 1px solid var(--gold);
        }

        .sortable-row.sortable-ghost {
            opacity: 0.35;
        }

        .drag-handle {
            cursor: grab;
            color: var(--gold);
            font-size: 1.1rem;
            padding: 0 4px;
            user-select: none;
            display: inline-block;
            vertical-align: middle;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .order-number {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-right: 4px;
        }

        .save-order-btn {
            background: var(--gold);
            color: var(--primary);
            border: none;
            padding: 8px 24px;
            border-radius: var(--radius-full);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .save-order-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
        }

        .save-order-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .order-status {
            margin-right: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ============================================================
                   PAGINATION
                   ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 6px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .pagination button:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ============================================================
                   MODALS
                   ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 10;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .modal-box .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-box .modal-header h3 i {
            color: var(--gold);
        }

        .modal-box .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .modal-box .modal-close:hover {
            background: var(--bg-body);
            color: var(--text-primary);
        }

        .modal-box .modal-body {
            padding: 24px;
        }

        .modal-box .modal-body p {
            margin-bottom: 8px;
            line-height: 1.7;
        }

        /* Form styles inside modals */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        .form-grid label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
            color: var(--text-primary);
            background: #fff;
        }

        .form-grid input:focus,
        .form-grid select:focus,
        .form-grid textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        .form-grid textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-grid .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }

        .form-grid .checkbox-row input[type="checkbox"] {
            width: auto;
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
        }

        .form-grid .checkbox-row label {
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .form-actions .btn {
            padding: 10px 32px;
            border-radius: var(--radius-full);
            border: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .form-actions .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .form-actions .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(11, 46, 37, 0.2);
        }

        .form-actions .btn-gold {
            background: var(--gold);
            color: var(--primary);
        }

        .form-actions .btn-gold:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
        }

        .form-actions .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .form-actions .btn-outline:hover {
            background: var(--bg-body);
        }

        /* Variants inside product modal */
        .variant-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .variant-row input,
        .variant-row select {
            flex: 1;
            min-width: 80px;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-family: inherit;
            font-size: 0.8rem;
        }

        .variant-row .variant-default-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .variant-row .variant-default-label input {
            width: auto;
            min-width: unset;
            padding: 0;
            margin: 0;
        }

        .variant-row .remove-variant {
            background: #fee2e2;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            color: #991b1b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .variant-row .remove-variant:hover {
            background: #fecaca;
            transform: scale(1.05);
        }

        .add-variant-btn {
            padding: 8px 18px;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-full);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .add-variant-btn:hover {
            border-color: var(--gold);
            color: var(--primary);
            background: rgba(212, 175, 55, 0.05);
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #fff;
            padding: 14px 32px;
            border-radius: var(--radius-full);
            z-index: 3000;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s ease;
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
        }

        .toast.error {
            background: #dc2626;
        }

        .toast.success {
            background: #166534;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
                   LOGIN
                   ============================================================ */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--primary-dark), var(--primary));
            padding: 20px;
            width: 100%;
        }

        .login-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 48px 42px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .login-card .login-icon {
            font-size: 3.2rem;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .login-card h2 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 800;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 0.9rem;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .login-card input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        .login-card .login-btn {
            background: var(--primary);
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-full);
            font-weight: 700;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .login-card .login-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(11, 46, 37, 0.25);
        }

        .login-card .login-error {
            color: #dc2626;
            margin-top: 14px;
            font-size: 0.85rem;
        }

        .login-card .forgot-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 14px;
        }

        .login-card .forgot-link:hover {
            text-decoration: underline;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 240px;
            }
            .page-content {
                padding: 20px 20px 32px;
            }
            .top-header {
                padding: 0 20px;
            }
        }

        @media (max-width: 820px) {
            .sidebar {
                transform: translateX(100%);
                box-shadow: none;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.2);
            }

            .main-content {
                margin-right: 0;
            }

            .top-header .header-actions .mobile-toggle {
                display: block;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-grid .full {
                grid-column: 1;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .tab-content {
                padding: 16px;
            }

            .tabs-header {
                padding: 6px 8px 0;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
                white-space: nowrap;
            }

            .tab-btn i {
                font-size: 0.8rem;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-bar .filter-group {
                width: 100%;
            }

            .filter-bar input,
            .filter-bar select {
                min-width: unset;
                width: 100%;
            }

            .data-table {
                font-size: 0.7rem;
                min-width: 480px;
            }

            .data-table th,
            .data-table td {
                padding: 8px 10px;
            }

            .modal-box {
                max-width: 100%;
                border-radius: var(--radius-sm);
                margin: 10px;
            }

            .login-card {
                padding: 32px 24px;
            }

            .top-header .page-title {
                font-size: 0.95rem;
            }

            .top-header .header-actions .refresh-top span {
                display: none;
            }

            .variant-row {
                flex-direction: column;
                align-items: stretch;
            }

            .variant-row input,
            .variant-row select {
                min-width: unset;
            }

            .variant-row .variant-default-label {
                justify-content: flex-start;
            }

            .variant-row .remove-variant {
                align-self: flex-end;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 14px 16px;
            }

            .stat-card .stat-number {
                font-size: 1.4rem;
            }

            .stat-card .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .page-content {
                padding: 12px 12px 24px;
            }

            .top-header {
                padding: 0 12px;
                height: 60px;
            }

            .top-header .page-title {
                font-size: 0.85rem;
            }

            .tab-content {
                padding: 12px;
            }

            .modal-box .modal-header {
                padding: 14px 16px;
            }

            .modal-box .modal-header h3 {
                font-size: 1rem;
            }

            .modal-box .modal-body {
                padding: 16px;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .save-order-btn {
                width: 100%;
                justify-content: center;
            }

            .login-card {
                padding: 24px 16px;
            }

            .login-card h2 {
                font-size: 1.3rem;
            }
        }

        /* ============================================================
                   SCROLLBAR
                   ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dark);
        }

        /* ============================================================
                   UTILITY
                   ============================================================ */
        .text-muted {
            color: var(--text-muted);
        }

        .text-gold {
            color: var(--gold);
        }

        .mt-8 {
            margin-top: 8px;
        }

        .mt-16 {
            margin-top: 16px;
        }

        .mb-8 {
            margin-bottom: 8px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gap-4 {
            gap: 4px;
        }

        .w-full {
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* ============================================================
                   ORDER DETAILS / TICKET REPLY
                   ============================================================ */
        .detail-block {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .detail-block strong {
            color: var(--text-primary);
            display: inline-block;
            min-width: 100px;
        }

        .detail-block .items-list {
            list-style: none;
            padding: 0;
            margin-top: 6px;
        }

        .detail-block .items-list li {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .detail-block .items-list li:last-child {
            border-bottom: none;
        }

        .admin-reply-box {
            background: #f1f5f9;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--gold);
            margin-top: 12px;
        }

        .admin-reply-box strong {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <!-- ==========================================================
    LOGIN SCREEN
    ========================================================== -->
    <div id="loginSection" class="login-page">
        <div class="login-card">
            <div class="login-icon"><i class="fas fa-store-alt"></i></div>
            <h2>سوق المشاريع</h2>
            <p>لوحة تحكم المشرف المتقدمة</p>
            <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" value="abdulaziz1076@gmail.com" />
            <input type="password" id="adminPassword" placeholder="كلمة المرور" />
            <button class="login-btn" id="loginBtn">
                دخول <i class="fas fa-arrow-left"></i>
            </button>
            <div class="login-error" id="loginError"></div>
            <a href="#" id="forgotPasswordLink" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>
    </div>

    <!-- ==========================================================
    SIDEBAR
    ========================================================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="fas fa-store"></i></div>
            <h1>سوق <span>المشاريع</span></h1>
        </div>

        <nav class="sidebar-nav" id="sidebarNav">
            <div class="nav-label">الرئيسية</div>
            <button class="nav-item active" data-tab="dashboard">
                <i class="fas fa-chart-pie"></i> لوحة المعلومات
            </button>

            <div class="nav-label">الإدارة</div>
            <button class="nav-item" data-tab="registrations">
                <i class="fas fa-clipboard-list"></i> طلبات التسجيل
                <span class="badge-nav" id="regBadge">0</span>
            </button>
            <button class="nav-item" data-tab="projects">
                <i class="fas fa-store"></i> المشاريع
                <span class="badge-nav" id="projectBadge">0</span>
            </button>
            <button class="nav-item" data-tab="products">
                <i class="fas fa-box"></i> المنتجات
            </button>
            <button class="nav-item" data-tab="deals">
                <i class="fas fa-tags"></i> العروض
            </button>
            <button class="nav-item" data-tab="contacts">
                <i class="fas fa-address-card"></i> بيانات التواصل
            </button>
            <button class="nav-item" data-tab="feedbacks">
                <i class="fas fa-comment-dots"></i> الشكاوى
                <span class="badge-nav" id="feedbackBadge">0</span>
            </button>
            <button class="nav-item" data-tab="orders">
                <i class="fas fa-truck"></i> الطلبات
                <span class="badge-nav" id="orderBadge">0</span>
            </button>
            <button class="nav-item" data-tab="licenses">
                <i class="fas fa-file-certificate"></i> التراخيص
            </button>
            <button class="nav-item" data-tab="support">
                <i class="fas fa-headset"></i> الدعم الفني
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">أ</div>
                <div>
                    <div class="name">المشرف</div>
                    <div class="role">مدير النظام</div>
                </div>
            </div>
            <button class="logout-btn-side" id="logoutBtnSide">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </aside>

    <!-- ==========================================================
    MAIN CONTENT
    ========================================================== -->
    <div class="main-content" id="adminContent" style="display:none;">

        <!-- TOP HEADER -->
        <header class="top-header">
            <div class="page-title">
                <i class="fas fa-grip-lines"></i>
                <span id="pageTitle">لوحة المعلومات</span>
            </div>
            <div class="header-actions">
                <button class="refresh-top" id="refreshAllBtn">
                    <i class="fas fa-sync-alt"></i> <span>تحديث الكل</span>
                </button>
                <button class="mobile-toggle" id="mobileToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- ===== DASHBOARD TAB ===== -->
            <div id="dashboardTab" class="tab-content active">
                <div class="stats-grid" id="statsContainer">
                    <!-- filled by JS -->
                </div>
                <div style="background:#fff; border-radius:var(--radius); padding:30px; text-align:center; border:1px solid var(--border-color); box-shadow:var(--shadow-sm);">
                    <i class="fas fa-chart-line" style="font-size:2.4rem; color:var(--gold); margin-bottom:12px;"></i>
                    <h3 style="font-weight:700; margin-bottom:6px;">مرحباً بك في لوحة التحكم</h3>
                    <p class="text-muted">استخدم القائمة الجانبية للتنقل بين الأقسام المختلفة وإدارة منصتك.</p>
                </div>
            </div>

            <!-- ===== REGISTRATIONS TAB ===== -->
            <div id="registrationsTab" class="tab-content">
                <div class="filter-bar">
                    <div class="filter-group">
                        <input type="text" id="regSearch" placeholder="بحث: اسم، واتساب..." />
                        <select id="regStatusFilter">
                            <option value="all">كل الحالات</option>
                            <option value="pending">معلق</option>
                            <option value="approved">موافق</option>
                            <option value="rejected">مرفوض</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <button class="btn btn-gold" id="refreshRegBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                        <button class="btn btn-outline" id="exportRegBtn"><i class="fas fa-file-csv"></i> تصدير</button>
                    </div>
                </div>
                <div id="registrationsTableContainer"></div>
                <div class="pagination" id="registrationsPagination"></div>
            </div>

            <!-- ===== PROJECTS TAB ===== -->
            <div id="projectsTab" class="tab-content">
                <div class="filter-bar">
                    <div class="filter-group">
                        <input type="text" id="projectSearch" placeholder="بحث بالاسم..." />
                        <select id="projectEmirateFilter"><option value="">كل الإمارات</option></select>
                        <select id="projectStatusFilter">
                            <option value="">كل الحالات</option>
                            <option value="active">فعال</option>
                            <option value="disabled">معطل</option>
                            <option value="deleted">محذوف</option>
                            <option value="pending">معلق</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <button class="btn btn-gold" id="refreshProjectsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                        <button class="btn btn-primary" id="addProjectBtn"><i class="fas fa-plus"></i> مشروع جديد</button>
                        <button class="btn btn-outline" id="exportProjectsBtn"><i class="fas fa-file-csv"></i> تصدير</button>
                    </div>
                </div>
                <div id="projectsTableContainer"></div>
                <div style="display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px;">
                    <button id="saveOrderBtn" class="save-order-btn"><i class="fas fa-save"></i> حفظ الترتيب الجديد</button>
                    <span id="orderStatus" class="order-status"></span>
                </div>
                <div class="pagination" id="projectsPagination"></div>
            </div>

            <!-- ===== PRODUCTS TAB ===== -->
            <div id="productsTab" class="tab-content">
                <div class="filter-bar">
                    <select id="productProjectFilter"><option value="">اختر المشروع أولاً</option></select>
                    <div class="filter-group">
                        <button class="btn btn-gold" id="refreshProductsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                        <button class="btn btn-primary" id="addProductBtn"><i class="fas fa-plus"></i> منتج جديد</button>
                        <button class="btn btn-outline" id="reorderProductsBtn"><i class="fas fa-sort-amount-down"></i> إعادة ترتيب</button>
                        <button class="btn btn-outline" id="exportProductsBtn"><i class="fas fa-file-csv"></i> تصدير</button>
                    </div>
                </div>
                <div id="productsTableContainer"></div>
            </div>

            <!-- ===== DEALS TAB ===== -->
            <div id="dealsTab" class="tab-content">

    <!-- ==========================================================

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { APP_CONFIG } from './config.js';

        // ===== SUPABASE =====
        const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
        const ALLOWED_EMAIL = 'abdulaziz1076@gmail.com';
        const LIMIT = 10;

        // ===== CATEGORIES =====
        const CATEGORIES_AR = ["أطعمة ومشروبات", "الرقميات", "روائح وعطور", "عناية", "حلويات", "تجميل", "ملابس", "يدويات", "هدايا", "عطارة",
            "فنون", "نباتات", "ترفيه"
        ];
        const CATEGORIES_EN = ["Food & Beverages", "IT", "Scents & Perfumes", "Care", "Sweets", "Beauty", "Clothes", "Handmade",
            "Gifts", "Apothecary", "Arts", "Plants", "Entertainment"
        ];

        // ===== STATE =====
        const state = {
            currentProjectsPage: 1,
            projectsTotal: 0,
            currentOrdersPage: 1,
            ordersTotal: 0,
            currentRegPage: 1,
            regTotal: 0,
            currentLicensesPage: 1,
            licensesTotal: 0,
            currentSupportPage: 1,
            supportTotal: 0,
            currentVariants: [],
            currentTab: 'dashboard',
            isLoading: false,
            projectsMap: {}
        };

        // ===== TOAST =====
        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeStatus(s) { return (s || '').toString().trim().toLowerCase(); }

        function mapProjectStatusToBadgeAndText(status) {
            const v = normalizeStatus(status);
            if (v === 'disabled' || v === 'inactive') return { badge: 'badge-disabled', text: 'معطل' };
            if (v === 'deleted' || v === 'archived') return { badge: 'badge-deleted', text: 'محذوف' };
            if (v === 'pending') return { badge: 'badge-pending', text: 'معلق' };
            return { badge: 'badge-active', text: 'فعال' };
        }

        function getLicenseBadge(status) {
            const map = {
                'pending_license': 'badge-license-pending',
                'license_uploaded': 'badge-license-uploaded',
                'license_approved': 'badge-license-approved',
                'license_rejected': 'badge-license-rejected',
                'suspended': 'badge-license-suspended'
            };
            return map[status] || 'badge-pending';
        }

        function getLicenseText(status) {
            const map = {
                'pending_license': 'قيد المراجعة',
                'license_uploaded': 'تم الرفع',
                'license_approved': 'معتمد',
                'license_rejected': 'مرفوض',
                'suspended': 'معلق'
            };
            return map[status] || status || '-';
        }

        // ===== LOAD PROJECTS MAP =====
        async function loadProjectsMap() {
            const { data, error } = await supabase.from('projects').select('id, name_ar');
            if (error) {
                console.error('خطأ في جلب أسماء المشاريع:', error);
                return;
            }
            state.projectsMap = {};
            data.forEach(p => { state.projectsMap[p.id] = p.name_ar; });
        }

        // ===== LOAD STATS =====
        async function loadStats() {
            try {
                const [projects, products, feedbacks, totalRegs, pendingRegs, orders] = await Promise.all([
                    supabase.from('projects').select('*', { count: 'exact', head: true }),
                    supabase.from('products').select('*', { count: 'exact', head: true }),
                    supabase.from('feedbacks').select('*', { count: 'exact', head: true }),
                    supabase.from('project_registrations').select('*', { count: 'exact', head: true }),
                    supabase.from('project_registrations').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
                    supabase.from('admin_order_logs').select('*', { count: 'exact', head: true })
                ]);

                // تحديث البادجات في الشريط الجانبي
                document.getElementById('regBadge').textContent = pendingRegs.count || 0;
                document.getElementById('projectBadge').textContent = projects.count || 0;
                document.getElementById('feedbackBadge').textContent = feedbacks.count || 0;
                document.getElementById('orderBadge').textContent = orders.count || 0;

                document.getElementById('statsContainer').innerHTML = `
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon"><i class="fas fa-store"></i></div><span class="stat-badge">نشطة</span></div>
                                <div class="stat-number">${projects.count||0}</div>
                                <div class="stat-label">المشاريع</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon gold"><i class="fas fa-box"></i></div><span class="stat-badge">معروضة</span></div>
                                <div class="stat-number">${products.count||0}</div>
                                <div class="stat-label">المنتجات</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div><span class="stat-badge">تسجيل</span></div>
                                <div class="stat-number">${totalRegs.count||0}</div>
                                <div class="stat-label">إجمالي الطلبات</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon gold"><i class="fas fa-clock"></i></div><span class="stat-badge">مراجعة</span></div>
                                <div class="stat-number">${pendingRegs.count||0}</div>
                                <div class="stat-label">طلبات معلقة</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon"><i class="fas fa-comment-dots"></i></div><span class="stat-badge">وارد</span></div>
                                <div class="stat-number">${feedbacks.count||0}</div>
                                <div class="stat-label">الشكاوى</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-top"><div class="stat-icon gold"><i class="fas fa-truck"></i></div><span class="stat-badge">مطلوب</span></div>
                                <div class="stat-number">${orders.count||0}</div>
                                <div class="stat-label">الطلبات (السلة)</div>
                            </div>
                        `;
            } catch (e) {
                console.error('Stats error:', e);
                document.getElementById('statsContainer').innerHTML =
                    `<div class="stat-card"><div class="stat-number">!</div><div class="stat-label">خطأ في التحميل</div></div>`;
            }
        }

        // ===== PROJECTS =====
        async function loadProjects(page = 1) {
            if (state.isLoading) return;
            state.isLoading = true;
            state.currentProjectsPage = page;

            try {
                let query = supabase
                    .from('projects')
                    .select('*', { count: 'exact' })
                    .order('display_order', { ascending: true, nullsFirst: false })
                    .order('id', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                const search = document.getElementById('projectSearch').value;
                if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);

                const emirate = document.getElementById('projectEmirateFilter').value;
                if (emirate) query = query.eq('emirate', emirate);

                const statusF = document.getElementById('projectStatusFilter').value;
                if (statusF) query = query.eq('status', statusF);

                const { data, error, count } = await query;
                if (error) throw error;

                state.projectsTotal = count || 0;
                const container = document.getElementById('projectsTableContainer');
                if (!data || data.length === 0) {

        // ===== SAVE ORDER =====
        async function saveNewOrder() {
            const tbody = document.getElementById('projects-tbody');
            if (!tbody) return;
            const rows = tbody.querySelectorAll('tr');
            if (rows.length === 0) return;

            const updates = [];
            rows.forEach((row, index) => {
                const id = row.dataset.projectId;
                if (id) {
                    updates.push({ id: parseInt(id), display_order: index + 1 });
                }
            });

            if (updates.length === 0) return;

            const saveBtn = document.getElementById('saveOrderBtn');
            const statusSpan = document.getElementById('orderStatus');
            saveBtn.disabled = true;
            statusSpan.textContent = '⏳ جاري حفظ الترتيب...';

            try {
                const promises = updates.map(u =>
                    supabase.from('projects').update({ display_order: u.display_order }).eq('id', u.id)
                );
                const results = await Promise.all(promises);
                const errors = results.filter(r => r.error);
                if (errors.length > 0) {
                    throw new Error(errors[0].error.message);
                }
                statusSpan.textContent = '✅ تم حفظ الترتيب بنجاح!';
                showToast('تم تحديث ترتيب المشاريع');
                setTimeout(() => {
                    loadProjects(state.currentProjectsPage);
                }, 500);
            } catch (err) {
                statusSpan.textContent = '❌ فشل الحفظ: ' + err.message;
                showToast(err.message, 'error');
            } finally {
                saveBtn.disabled = false;
                setTimeout(() => { statusSpan.textContent = ''; }, 5000);
            }
        }

        document.getElementById('saveOrderBtn')?.addEventListener('click', saveNewOrder);

            const newStatus = current.status === 'active' ? 'disabled' : 'active';
            const { error } = await supabase.from('projects').update({ status: newStatus }).eq('id', id);
            if (error) { showToast(error.message, 'error'); return; }
            showToast(`تم ${newStatus === 'active' ? 'تفعيل' : 'تعطيل'} المشروع`);
            loadProjects(state.currentProjectsPage);

        // ===== SAVE PROJECT =====
        async function saveProject(e) {
            e.preventDefault();
            const id = document.getElementById('projectId').value;
            const payload = {
                name_ar: document.getElementById('projectNameAr').value,
                name_en: document.getElementById('projectNameEn').value,
                emirate: document.getElementById('projectEmirate').value,

                category_en: document.getElementById('projectCategoryEn').value
            };
            let error;

            else error = (await supabase.from('projects').insert(payload)).error;

                let query = supabase
                    .from('project_registrations')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                if (search) query = query.or(`project_name.ilike.%${search}%,whatsapp.ilike.%${search}%,ip.ilike.%${search}%`);
                const status = document.getElementById('regStatusFilter').value;
                if (status !== 'all') query = query.eq('status', status);
                const { data, error, count } = await query;
                if (error) throw error;
                state.regTotal = count || 0;
                const container = document.getElementById('registrationsTableContainer');
                if (!data || data.length === 0) {

                showToast(e.message, 'error');
                console.error('loadRegistrations error:', e);
            } finally {
                state.isLoading = false;
            }
        }

            const projectId = document.getElementById('productProjectFilter').value;

                document.getElementById('productsTableContainer').innerHTML =
                    '<div class="no-data">✏️ اختر مشروعاً أولاً من القائمة</div>';

                'display_order', { ascending: true, nullsFirst: false });

                container.innerHTML = '<div class="no-data">لا توجد منتجات لهذا المشروع</div>';

            }
            let html =
                `<div class="table-wrapper"><table class="data-table"><thead><tr><th>الترتيب</th><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>التصنيف</th><th>النوع</th><th>السعر</th><th>الإجراءات</th></tr></thead><tbody>`;

                            <td>${escapeHtml(p.price_ar || '-')}</td>

                                <button class="action-btn edit" onclick="window.editProduct('${p.id}')" title="تعديل"><i class="fas fa-edit"></i></button>

            document.querySelectorAll('.product-order-input').forEach(inp => {

                });
            });

        window.swapProductOrder = async (id, direction) => {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) return;
            const { data: current } = await supabase.from('products').select('id, display_order').eq('id', id).single();
            if (!current) return;
            let currentOrder = current.display_order ?? 0;
            let query = direction === 'up' ?
                supabase.from('products').select('id, display_order').eq('project_id', projectId).lt('display_order',
                    currentOrder).order('display_order', { ascending: false }).limit(1) :
                supabase.from('products').select('id, display_order').eq('project_id', projectId).gt('display_order',
                    currentOrder).order('display_order', { ascending: true }).limit(1);
            const { data: neighbor } = await query;
            if (!neighbor?.length) return showToast(direction === 'up' ? 'هذا بالفعل الأعلى' : 'هذا بالفعل الأسفل', 'error');
            const target = neighbor[0];
            await supabase.from('products').update({ display_order: target.display_order }).eq('id', current.id);
            await supabase.from('products').update({ display_order: currentOrder }).eq('id', target.id);
            showToast('تم تبديل الترتيب');
            loadProducts();
        };

        async function updateProductOrderDirect(id, newOrder) {
            const { error } = await supabase.from('products').update({ display_order: newOrder }).eq('id', id);
            if (error) showToast(error.message, 'error');
            else loadProducts();
        }

        window.reorderAllProducts = async () => {
            const projectId = document.getElementById('productProjectFilter').value;
            if (!projectId) return showToast('اختر مشروعاً أولاً', 'error');
            const { data } = await supabase.from('products').select('id').eq('project_id', projectId).order('display_order', {
                ascending: true,
                nullsFirst: false
            }).order('id', { ascending: true });
            if (!data) return;
            for (let i = 0; i < data.length; i++) {
                await supabase.from('products').update({ display_order: i + 1 }).eq('id', data[i].id);

            showToast('تم إعادة ترتيب المنتجات');
            loadProducts();
        };

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const projectId = document.getElementById('productProjectId').value;
            const imagesArr = document.getElementById('productImages').value.split(',').map(s => s.trim()).filter(Boolean);
            const detailsAr = document.getElementById('productDetailsAr').value.split('\n').map(s => s.trim()).filter(Boolean);
            const detailsEn = document.getElementById('productDetailsEn').value.split('\n').map(s => s.trim()).filter(Boolean);
            const payload = {
                name_ar: document.getElementById('productNameAr').value,
                name_en: document.getElementById('productNameEn').value,
                main_image: document.getElementById('productMainImage').value,
                images: imagesArr,
                description_ar: document.getElementById('productDescAr').value,
                description_en: document.getElementById('productDescEn').value,
                long_description_ar: document.getElementById('productLongDescAr').value,
                long_description_en: document.getElementById('productLongDescEn').value,
                details_ar: detailsAr,
                details_en: detailsEn,
                price_ar: document.getElementById('productPriceAr').value,
                price_en: document.getElementById('productPriceEn').value,
                type_ar: document.getElementById('productTypeAr').value,
                type_en: document.getElementById('productTypeEn').value,
                category_ar: document.getElementById('productCategoryAr').value,
                category_en: document.getElementById('productCategoryEn').value,
                project_id: projectId
            };
            let productId = id;
            let err;
            if (!productId) {
                const { data: newProduct, error: insertErr } = await supabase.from('products').insert(payload).select()
                    .single();
                if (insertErr) { showToast(insertErr.message, 'error'); return; }
                productId = newProduct.id;
            } else {
                err = (await supabase.from('products').update(payload).eq('id', productId)).error;

                    label_en: rowEl.querySelector('.variant-label-en')?.value || '',

                    price_en: rowEl.querySelector('.variant-price-en')?.value || '',

                        product_id: productId,
                        label_ar: v.label_ar,
                        label_en: v.label_en,
                        price_ar: v.price_ar,
                        price_en: v.price_en,

                let query = supabase
                    .from('admin_order_logs')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .range((page - 1) * LIMIT, page * LIMIT - 1);

                if (search) query = query.or(
                    `project_name.ilike.%${search}%,customer_whatsapp.ilike.%${search}%,order_number.ilike.%${search}%`);

                const projectFilter = document.getElementById('ordersProjectFilter').value;
                if (projectFilter) query = query.eq('project_id', parseInt(projectFilter));

                const { data, error, count } = await query;
                if (error) throw error;

                state.ordersTotal = count || 0;
                const container = document.getElementById('ordersTableContainer');

                    `<div class="table-wrapper"><table class="data-table"><thead><tr>

                    }

                    };

                    html += `<tr>
                                <td>${escapeHtml(order.order_number)}</td>
                                <td>${escapeHtml(order.project_name)}</td>
                                <td>${escapeHtml(order.customer_whatsapp)}</td>
                                <td class="order-items-preview" title="${escapeHtml(itemsPreview)}">${escapeHtml(itemsPreview)}</td>
                                <td>${escapeHtml(order.total_price)}</td>
