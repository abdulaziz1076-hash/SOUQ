<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المشرف - سوق المشاريع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* أنماط إضافية للوحة التحكم */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--light-gray);
        }
        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 10px;
        }
        .admin-tab-btn {
            background: var(--light);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .admin-tab-btn.active {
            background: var(--secondary);
            color: var(--primary-dark);
        }
        .admin-table {
            width: 100%;
            background: white;
            border-radius: 18px;
            overflow-x: auto;
            border-collapse: collapse;
        }
        .admin-table th, .admin-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--light-gray);
            text-align: right;
        }
        .admin-table th {
            background: var(--primary-dark);
            color: white;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-pending { background: #f0ad4e; color: white; }
        .status-approved { background: #5cb85c; color: white; }
        .status-rejected { background: #d9534f; color: white; }
        .status-resolved { background: #5bc0de; color: white; }
        select.status-select {
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--light-gray);
        }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            font-size: 16px;
            margin: 0 3px;
        }
    </style>
</head>
<body>
<div class="container" style="padding: 20px;">
    <div id="loginSection">
        <div style="max-width: 300px; margin: 100px auto; text-align: center;">
            <h2>دخول المشرف</h2>
            <input type="password" id="adminPassword" placeholder="كلمة المرور" style="width:100%; padding:10px; margin:10px 0;">
            <button onclick="checkAdminPassword()" class="btn-generate">دخول</button>
        </div>
    </div>

    <div id="adminContent" style="display:none;">
        <h1><i class="fas fa-chalkboard-user"></i> لوحة تحكم المشرف</h1>
        <p>مرحباً، يمكنك إدارة المشاريع والمنتجات والبلاغات والشكاوي والاقتراحات.</p>

        <div class="admin-stats" id="statsContainer">جاري التحميل...</div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="projects">المشاريع</button>
            <button class="admin-tab-btn" data-tab="products">المنتجات</button>
            <button class="admin-tab-btn" data-tab="reports">البلاغات</button>
            <button class="admin-tab-btn" data-tab="complaints">الشكاوى</button>
            <button class="admin-tab-btn" data-tab="suggestions">الاقتراحات</button>
        </div>

        <div id="projectsTab" class="admin-tab-content"></div>
        <div id="productsTab" class="admin-tab-content" style="display:none;"></div>
        <div id="reportsTab" class="admin-tab-content" style="display:none;"></div>
        <div id="complaintsTab" class="admin-tab-content" style="display:none;"></div>
        <div id="suggestionsTab" class="admin-tab-content" style="display:none;"></div>
    </div>
</div>

<script type="module">
    import { supabase } from './supabase.js';

    // كلمة المرور المؤقتة (غير آمنة، استخدم Auth في الإنتاج)
    const ADMIN_PASSWORD = "admin123";

    window.checkAdminPassword = function() {
        const pwd = document.getElementById('adminPassword').value;
        if (pwd === ADMIN_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadAllData();
        } else {
            alert("كلمة مرور خاطئة");
        }
    };

    async function loadAllData() {
        await loadStats();
        await loadProjects();
        await loadProducts();
        await loadReports();
        await loadComplaints();
        await loadSuggestions();
    }

    async function loadStats() {
        const [projectsCount, productsCount, reportsCount, complaintsCount, suggestionsCount] = await Promise.all([
            supabase.from('projects').select('*', { count: 'exact', head: true }),
            supabase.from('products').select('*', { count: 'exact', head: true }),
            supabase.from('reports').select('*', { count: 'exact', head: true }),
            supabase.from('complaints').select('*', { count: 'exact', head: true }),
            supabase.from('suggestions').select('*', { count: 'exact', head: true })
        ]);
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-box"><div class="stat-number">${projectsCount.count || 0}</div><div>المشاريع</div></div>
            <div class="stat-box"><div class="stat-number">${productsCount.count || 0}</div><div>المنتجات</div></div>
            <div class="stat-box"><div class="stat-number">${reportsCount.count || 0}</div><div>البلاغات</div></div>
            <div class="stat-box"><div class="stat-number">${complaintsCount.count || 0}</div><div>الشكاوى</div></div>
            <div class="stat-box"><div class="stat-number">${suggestionsCount.count || 0}</div><div>الاقتراحات</div></div>
        `;
    }

    async function loadProjects() {
        const { data, error } = await supabase.from('projects').select('*').order('created_at', { ascending: false });
        if (error) return;
        let html = '<table class="admin-table"><thead><tr><th>المعرف</th><th>الاسم</th><th>الإمارة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>';
        data.forEach(p => {
            html += `<tr>
                <td>${p.id}</td>
                <td>${p.name_ar}</td>
                <td>${p.emirate}</td>
                <td><select class="status-select" data-id="${p.id}" data-table="projects" data-field="status">${getStatusOptions(p.status)}</select></td>
                <td><button class="action-btn" onclick="deleteItem('projects', ${p.id})"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('projectsTab').innerHTML = html;
        attachStatusChangeEvents();
    }

    async function loadProducts() {
        const { data, error } = await supabase.from('products').select('*, projects(name_ar)').order('created_at', { ascending: false });
        if (error) return;
        let html = '<table class="admin-table"><thead><tr><th>المعرف</th><th>الاسم</th><th>المشروع</th><th>إجراءات</th></tr></thead><tbody>';
        data.forEach(p => {
            html += `<tr>
                <td>${p.id}</td>
                <td>${p.name_ar}</td>
                <td>${p.projects?.name_ar || ''}</td>
                <td><button class="action-btn" onclick="deleteItem('products', '${p.id}')"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('productsTab').innerHTML = html;
    }

    async function loadReports() {
        const { data, error } = await supabase.from('reports').select('*').order('created_at', { ascending: false });
        if (error) return;
        let html = '<table class="admin-table"><thead><tr><th>المعرف</th><th>النوع</th><th>الهدف</th><th>السبب</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>';
        data.forEach(r => {
            html += `<tr>
                <td>${r.id}</td>
                <td>${r.target_type}</td>
                <td>${r.target_id}</td>
                <td>${r.reason}</td>
                <td><select class="status-select" data-id="${r.id}" data-table="reports" data-field="status">${getStatusOptions(r.status, ['pending','reviewed','resolved','rejected'])}</select></td>
                <td><button class="action-btn" onclick="deleteItem('reports', ${r.id})"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('reportsTab').innerHTML = html;
        attachStatusChangeEvents();
    }

    async function loadComplaints() {
        const { data, error } = await supabase.from('complaints').select('*').order('created_at', { ascending: false });
        if (error) return;
        let html = '<table class="admin-table"><thead><tr><th>المعرف</th><th>الموضوع</th><th>البريد</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>';
        data.forEach(c => {
            html += `<tr>
                <td>${c.id}</td>
                <td>${c.subject}</td>
                <td>${c.user_email || ''}</td>
                <td><select class="status-select" data-id="${c.id}" data-table="complaints" data-field="status">${getStatusOptions(c.status, ['pending','reviewed','resolved'])}</select></td>
                <td><button class="action-btn" onclick="deleteItem('complaints', ${c.id})"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('complaintsTab').innerHTML = html;
        attachStatusChangeEvents();
    }

    async function loadSuggestions() {
        const { data, error } = await supabase.from('suggestions').select('*').order('created_at', { ascending: false });
        if (error) return;
        let html = '<table class="admin-table"><thead><tr><th>المعرف</th><th>الاقتراح</th><th>البريد</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>';
        data.forEach(s => {
            html += `<tr>
                <td>${s.id}</td>
                <td>${s.suggestion.substring(0, 50)}...</td>
                <td>${s.user_email || ''}</td>
                <td><select class="status-select" data-id="${s.id}" data-table="suggestions" data-field="status">${getStatusOptions(s.status, ['pending','approved','implemented','rejected'])}</select></td>
                <td><button class="action-btn" onclick="deleteItem('suggestions', ${s.id})"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('suggestionsTab').innerHTML = html;
        attachStatusChangeEvents();
    }

    function getStatusOptions(current, options = ['pending','approved','rejected']) {
        const labels = { pending: 'قيد الانتظار', approved: 'موافق', rejected: 'مرفوض', reviewed: 'تمت المراجعة', resolved: 'تم الحل', implemented: 'تم التطبيق' };
        return options.map(opt => `<option value="${opt}" ${current === opt ? 'selected' : ''}>${labels[opt] || opt}</option>`).join('');
    }

    function attachStatusChangeEvents() {
        document.querySelectorAll('.status-select').forEach(select => {
            select.removeEventListener('change', handleStatusChange);
            select.addEventListener('change', handleStatusChange);
        });
    }
    // داخل admin.html، استبدل دالة checkAdminPassword بهذه
function checkAdminPassword() {
    var pwd = document.getElementById('adminPassword').value;
    if (pwd === "admin123") {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        // بعد الدخول، حمّل البيانات من Supabase (هنا يحتاج إنترنت)
        loadAllData();
    } else {
        alert("كلمة مرور خاطئة");
    }
}

    async function handleStatusChange(e) {
        const select = e.target;
        const id = select.dataset.id;
        const table = select.dataset.table;
        const field = select.dataset.field;
        const newStatus = select.value;
        const { error } = await supabase.from(table).update({ [field]: newStatus }).eq('id', id);
        if (error) console.error(error);
        else loadAllData(); // refresh
    }

    window.deleteItem = async (table, id) => {
        if (confirm('هل أنت متأكد من الحذف؟')) {
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) alert('خطأ في الحذف');
            else loadAllData();
        }
    };

    // تبديل التبويبات
    document.querySelectorAll('.admin-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const tabName = btn.dataset.tab;
            document.querySelectorAll('.admin-tab-content').forEach(div => div.style.display = 'none');
            document.getElementById(`${tabName}Tab`).style.display = 'block';
        });
    });
</script>
</body>
</html>
