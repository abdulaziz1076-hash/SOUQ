<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لوحة تحكم المشرف | سوق المشاريع (نسخة محسنة)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f4f8;
            font-family: 'Almarai', 'Tajawal', sans-serif;
            color: #1a2c3e;
            direction: rtl;
        }
        .admin-wrapper { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }
        
        /* تنسيق الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 32px;
            padding: 12px 28px;
            margin-bottom: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2edf2;
        }
        .logo-area h1 { font-size: 1.5rem; color: #0a2e25; font-weight: 800; }
        .logo-area i { color: #D4AF37; margin-left: 8px; }
        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logout-btn:hover { background: #c53030; transform: translateY(-2px); }
        
        /* البطاقات الإحصائية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.03);
            border: 1px solid #e9f0f5;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1);
        }
        .stat-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #0b3b2e, #1a5f44);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .stat-icon i { font-size: 28px; color: #D4AF37; }
        .stat-number {
            font-size: 38px;
            font-weight: 800;
            color: #0a2e25;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 14px;
            color: #5f7f9a;
            margin-top: 8px;
            font-weight: 500;
        }
        
        /* علامات التبويب */
        .tabs-container {
            background: white;
            border-radius: 60px;
            padding: 6px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #e2edf2;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #2c4e6e;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .tab-btn i { font-size: 16px; }
        .tab-btn.active {
            background: #0a2e25;
            color: white;
            box-shadow: 0 8px 18px rgba(10,46,37,0.2);
        }
        .tab-btn:hover:not(.active) { background: #e6f0f5; }
        
        /* بطاقات المحتوى */
        .content-card {
            background: white;
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid #e9f0f5;
            display: none;
        }
        .content-card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* شريط الفلترة والبحث */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-bar input, .filter-bar select {
            padding: 10px 18px;
            border: 1px solid #cfdfe9;
            border-radius: 34px;
            background: white;
            font-family: inherit;
            font-size: 13px;
            min-width: 170px;
            transition: 0.2s;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            border-color: #1a5f44;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,95,68,0.1);
        }
        .filter-bar button {
            background: #0a2e25;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .filter-bar button.btn-outline {
            background: white;
            color: #0a2e25;
            border: 1px solid #0a2e25;
        }
        .filter-bar button.btn-outline:hover {
            background: #0a2e25;
            color: white;
            transform: translateY(-2px);
        }
        .filter-bar button:hover { transform: translateY(-2px); background: #1a5f44; }
        
        /* الجداول */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            padding: 16px 12px;
            text-align: right;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        .data-table th {
            background: #fafcfd;
            font-weight: 800;
            color: #0a2e25;
            font-size: 0.9rem;
            letter-spacing: -0.2px;
        }
        .data-table tr:hover td {
            background-color: #f8fbfe;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-pending { background: #fff3e0; color: #c47a2e; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }
        .badge-reviewed { background: #e0f2fe; color: #0369a1; }
        .badge-resolved { background: #d9f99d; color: #3f6212; }
        
        .thumb-preview {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.2s;
        }
        .thumb-preview:hover { transform: scale(1.05); }
        
        .action-buttons { display: flex; gap: 10px; }
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 12px;
            transition: 0.2s;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn.edit { color: #2c7da0; background: #eef6fc; }
        .action-btn.edit:hover { background: #c9e6f5; transform: scale(1.05); }
        .action-btn.delete { color: #e53e3e; background: #fee9e9; }
        .action-btn.delete:hover { background: #fccaca; transform: scale(1.05); }
        
        /* النماذج المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 44px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 40px rgba(0,0,0,0.2);
        }
        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid #e9f0f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 1.6rem; color: #0a2e25; font-weight: 800; }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
        }
        .modal-body { padding: 28px; }
        .form-row { margin-bottom: 24px; }
        .form-row label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .form-row input, .form-row select, .form-row textarea {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid #cfdfe9;
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn-save {
            background: linear-gradient(135deg, #0a2e25, #1a5f44);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10,46,37,0.3); }
        
        /* تحليلات محسنة */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            margin-bottom: 32px;
        }
        .analytics-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.03);
            border: 1px solid #eef3f8;
        }
        .analytics-card h3 {
            font-size: 1.2rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0a2e25;
            font-weight: 700;
        }
        .chart-container { height: 260px; position: relative; }
        
        .visitors-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }
        .visitors-table td, .visitors-table th {
            padding: 12px 8px;
            border-bottom: 1px solid #ecf3f9;
        }
        .export-btn {
            background: #D4AF37;
            color: #0a2e25;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .export-btn:hover { background: #c9a032; transform: translateY(-2px); }
        
        .period-selector {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-bottom: 24px;
            align-items: center;
        }
        .period-selector select, .period-selector button {
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #cfdfe9;
            background: white;
            font-family: inherit;
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
        }
        .pagination button {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #cfdfe9;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .pagination button:hover {
            background: #0a2e25;
            color: white;
            border-color: #0a2e25;
        }
        
        @media (max-width: 700px) {
            .tab-btn { padding: 8px 16px; font-size: 12px; }
            .stats-grid { gap: 16px; }
            .filter-group { width: 100%; }
            .filter-bar input, .filter-bar select { width: 100%; }
        }
        
        /* رسالة منبثقة */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a2e25;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            z-index: 3000;
            font-weight: 500;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>

<div id="loginSection" style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#0a2e25,#1a5f44);">
    <div style="background:white; border-radius:48px; padding:42px; width:100%; max-width:420px; text-align:center; box-shadow:0 25px 45px rgba(0,0,0,0.2);">
        <i class="fas fa-chalkboard-user" style="font-size:64px; color:#D4AF37; margin-bottom:20px;"></i>
        <h2 style="color:#0a2e25; margin-bottom:20px;">دخول المشرف</h2>
        <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" value="abdulaziz1076@gmail.com" style="width:100%; padding:14px; margin:12px 0; border-radius:40px; border:1px solid #ccc;">
        <input type="password" id="adminPassword" placeholder="كلمة المرور" style="width:100%; padding:14px; margin-bottom:24px; border-radius:40px; border:1px solid #ccc;">
        <button id="loginBtn" style="background:#0a2e25; color:white; width:100%; padding:14px; border-radius:40px; font-weight:bold; border:none; font-size:16px;">دخول <i class="fas fa-arrow-left"></i></button>
        <div id="loginError" style="color:#dc2626; margin-top:16px;"></div>
        <div style="margin-top: 15px;">
            <a href="#" id="forgotPasswordLink" style="color: #D4AF37; text-decoration: none; font-size: 13px;">نسيت كلمة المرور؟</a>
        </div>
    </div>
</div>

<div id="adminContent" style="display:none;">
    <div class="admin-wrapper">
        <div class="top-bar">
            <div class="logo-area"><h1><i class="fas fa-store"></i> سوق المشاريع | المشرف المتقدم</h1></div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>

        <div class="stats-grid" id="statsContainer">جاري التحميل...</div>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="dashboard"><i class="fas fa-chart-line"></i> لوحة التحليلات</button>
            <button class="tab-btn" data-tab="registrations"><i class="fas fa-clipboard-list"></i> طلبات التسجيل</button>
            <button class="tab-btn" data-tab="projects"><i class="fas fa-store"></i> المشاريع</button>
            <button class="tab-btn" data-tab="products"><i class="fas fa-box"></i> المنتجات</button>
            <button class="tab-btn" data-tab="deals"><i class="fas fa-tags"></i> العروض</button>
            <button class="tab-btn" data-tab="contacts"><i class="fas fa-address-card"></i> بيانات التواصل</button>
            <button class="tab-btn" data-tab="feedbacks"><i class="fas fa-comment-dots"></i> الشكاوى</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboardTab" class="content-card active">
            <div class="period-selector">
                <select id="analyticsPeriod">
                    <option value="30min">آخر 30 دقيقة</option>
                    <option value="24h">آخر 24 ساعة</option>
                    <option value="7d">آخر 7 أيام</option>
                </select>
                <button id="refreshAnalyticsBtn"><i class="fas fa-sync-alt"></i> تحديث التحليلات</button>
            </div>
            <div class="analytics-grid">
                <div class="analytics-card"><h3><i class="fas fa-chart-line"></i> الزيارات لكل دقيقة</h3><div class="chart-container"><canvas id="visitsChart"></canvas></div></div>
                <div class="analytics-card"><h3><i class="fas fa-globe"></i> مصادر الزيارات</h3><div class="chart-container"><canvas id="sourcesChart"></canvas></div></div>
                <div class="analytics-card"><h3><i class="fas fa-mobile-alt"></i> الأجهزة المستخدمة</h3><div class="chart-container"><canvas id="devicesChart"></canvas></div></div>
                <div class="analytics-card"><h3><i class="fas fa-map-marker-alt"></i> تقدير الزوار حسب الإمارة</h3><div class="chart-container"><canvas id="geoChart"></canvas></div></div>
            </div>
            <div class="analytics-card">
                <h3><i class="fas fa-history"></i> آخر 20 نشاط تصفح</h3>
                <div style="overflow-x:auto;">
                    <table class="visitors-table" id="recentVisitsTable">
                        <thead><tr><th>الصفحة</th><th>المصدر</th><th>الجهاز</th><th>التوقيت</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="export-btn" id="exportAnalyticsBtn"><i class="fas fa-download"></i> تصدير CSV (الزيارات)</button>
            </div>
        </div>

        <!-- باقي التبويبات بنفس الجودة -->
        <div id="registrationsTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <select id="regStatusFilter"><option value="all">كل الحالات</option><option value="pending">معلق</option><option value="approved">موافق</option><option value="rejected">مرفوض</option></select>
                    <button id="refreshRegistrationsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                    <button id="exportRegBtn" class="btn-outline"><i class="fas fa-file-csv"></i> تصدير CSV</button>
                </div>
            </div>
            <div id="registrationsTableContainer"></div>
        </div>

        <div id="projectsTab" class="content-card">
            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="projectSearch" placeholder="بحث بالاسم...">
                    <select id="projectEmirateFilter"><option value="">كل الإمارات</option></select>
                    <select id="projectStatusFilter"><option value="">كل الحالات</option><option value="pending">معلق</option><option value="approved">موافق</option><option value="rejected">مرفوض</option></select>
                </div>
                <div class="filter-group">
                    <button id="refreshProjectsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                    <button id="addProjectBtn" class="btn-outline"><i class="fas fa-plus"></i> مشروع جديد</button>
                    <button id="exportProjectsBtn" class="btn-outline"><i class="fas fa-file-csv"></i> تصدير</button>
                </div>
            </div>
            <div id="projectsTableContainer"></div>
            <div id="projectsPagination" class="pagination"></div>
        </div>

        <div id="productsTab" class="content-card">
            <div class="filter-bar">
                <select id="productProjectFilter"><option value="">اختر المشروع أولاً</option></select>
                <button id="refreshProductsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button id="addProductBtn" class="btn-outline"><i class="fas fa-plus"></i> منتج جديد</button>
            </div>
            <div id="productsTableContainer"></div>
        </div>

        <div id="dealsTab" class="content-card">
            <div class="filter-bar">
                <select id="dealProjectFilter"><option value="">اختر المشروع</option></select>
                <button id="refreshDealsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button id="addDealBtn" class="btn-outline"><i class="fas fa-plus"></i> عرض جديد</button>
            </div>
            <div id="dealsTableContainer"></div>
        </div>

        <div id="contactsTab" class="content-card">
            <div class="filter-bar">
                <select id="contactProjectFilter"><option value="">اختر المشروع</option></select>
                <button id="refreshContactsBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
            <div id="contactsTableContainer"></div>
        </div>

        <div id="feedbacksTab" class="content-card">
            <div class="filter-bar">
                <select id="feedbackStatusFilter"><option value="">كل الحالات</option><option value="pending">معلق</option><option value="reviewed">مراجَع</option><option value="resolved">محلول</option><option value="rejected">مرفوض</option></select>
                <button id="refreshFeedbacksBtn"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>
            <div id="feedbacksTableContainer"></div>
        </div>
    </div>
</div>

<!-- مودالات المشروع والمنتج والعرض -->
<div id="projectModal" class="modal"><div class="modal-content"><div class="modal-header"><h3 id="projectModalTitle">مشروع</h3><button class="modal-close" data-modal="projectModal"><i class="fas fa-times"></i></button></div><div class="modal-body"><form id="projectForm"><input type="hidden" id="projectId"><div class="form-row"><label>الاسم (عربي)</label><input id="projectNameAr" required></div><div class="form-row"><label>الاسم (إنجليزي)</label><input id="projectNameEn" required></div><div class="form-row"><label>الإمارة</label><select id="projectEmirate"><option>أبوظبي</option><option>دبي</option><option>الشارقة</option><option>عجمان</option><option>رأس الخيمة</option><option>الفجيرة</option><option>أم القيوين</option></select></div><div class="form-row"><label>الصورة (URL)</label><input id="projectImage" placeholder="رابط الصورة"></div><div class="checkbox-row"><input type="checkbox" id="projectLicense"><label>رخصة أدريا</label></div><div class="form-row"><label>الحالة</label><select id="projectStatus"><option value="pending">معلق</option><option value="approved">موافق</option><option value="rejected">مرفوض</option></select></div><button class="btn-save">حفظ</button></form></div></div></div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>منتج</h3>
      <button class="modal-close" data-modal="productModal"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { APP_CONFIG } from './config.js';
    const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
    const ALLOWED_EMAIL = 'abdulaziz1076@gmail.com';
    let charts = {};
    let currentProjectsPage = 1;
    let projectsTotal = 0;

    function showToast(msg, isErr = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = msg;
        if (isErr) toast.style.background = '#dc2626';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function loadStats() {
        const { count: projectsCount } = await supabase.from('projects').select('*', { count: 'exact', head: true });
        const { count: productsCount } = await supabase.from('products').select('*', { count: 'exact', head: true });
        const { count: feedbacksCount } = await supabase.from('feedbacks').select('*', { count: 'exact', head: true });
        const { count: totalRegs } = await supabase.from('project_registrations').select('*', { count: 'exact', head: true });
        const { count: pendingRegs } = await supabase.from('project_registrations').select('*', { count: 'exact', head: true }).eq('status', 'pending');
        document.getElementById('statsContainer').innerHTML = `
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-store"></i></div><div class="stat-number">${projectsCount||0}</div><div class="stat-label">المشاريع</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-box"></i></div><div class="stat-number">${productsCount||0}</div><div class="stat-label">المنتجات</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-clipboard-list"></i></div><div class="stat-number">${totalRegs||0}</div><div class="stat-label">إجمالي الطلبات</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-number">${pendingRegs||0}</div><div class="stat-label">طلبات معلقة</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-comment-dots"></i></div><div class="stat-number">${feedbacksCount||0}</div><div class="stat-label">الشكاوى</div></div>
        `;
    }

    // التحليلات المتقدمة
    async function loadAnalytics() {
        const period = document.getElementById('analyticsPeriod').value;
        let since = new Date();
        if (period === '30min') since.setMinutes(since.getMinutes() - 30);
        else if (period === '24h') since.setHours(since.getHours() - 24);
        else since.setDate(since.getDate() - 7);
        const { data: events, error } = await supabase.from('analytics_events').select('*').gte('created_at', since.toISOString()).order('created_at', { ascending: false });
        if (error || !events) return;
        
        // الزيارات لكل دقيقة (آخر 10 فترات)
        const byMinute = {};
        events.forEach(ev => { let key = ev.created_at.slice(0,16); byMinute[key] = (byMinute[key] || 0) + 1; });
        const labels = Object.keys(byMinute).slice(-10).map(k => k.slice(11,16));
        const dataPoints = labels.map((_,i) => Object.values(byMinute).slice(-10)[i]);
        if (charts.visitsChart) charts.visitsChart.destroy();
        charts.visitsChart = new Chart(document.getElementById('visitsChart'), { type: 'line', data: { labels, datasets: [{ label: 'الزيارات', data: dataPoints, borderColor: '#D4AF37', backgroundColor: 'rgba(212,175,55,0.1)', fill: true, tension: 0.3 }] } });
        
        // المصادر
        const sources = { 'مباشر':0, 'جوجل':0, 'وسائل تواصل':0, 'آخر':0 };
        events.forEach(ev => {
            let ref = ev.referrer || '';
            if (ref.includes('google')) sources['جوجل']++;
            else if (ref.includes('facebook') || ref.includes('instagram') || ref.includes('x.com')) sources['وسائل تواصل']++;
            else if (ref === '' || ref === 'direct') sources['مباشر']++;
            else sources['آخر']++;
        });
        if (charts.sourcesChart) charts.sourcesChart.destroy();
        charts.sourcesChart = new Chart(document.getElementById('sourcesChart'), { type: 'doughnut', data: { labels: Object.keys(sources), datasets: [{ data: Object.values(sources), backgroundColor: ['#0a2e25','#D4AF37','#2b7a5c','#8b7355'] }] } });
        
        // الأجهزة
        const devices = { 'حاسوب':0, 'جوال':0, 'تابلت':0 };
        events.forEach(ev => {
            let d = ev.device || '';
            if (d.includes('Mobile')) devices['جوال']++;
            else if (d.includes('Tablet')) devices['تابلت']++;
            else devices['حاسوب']++;
        });
        if (charts.devicesChart) charts.devicesChart.destroy();
        charts.devicesChart = new Chart(document.getElementById('devicesChart'), { type: 'bar', data: { labels: Object.keys(devices), datasets: [{ label: 'الزيارات', data: Object.values(devices), backgroundColor: '#1a5f44', borderRadius: 10 }] } });
        
        // الإمارات (تقدير)
        const geo = { 'دبي':0, 'أبوظبي':0, 'الشارقة':0, 'أخرى':0 };
        const total = events.length || 1;
        geo['دبي'] = Math.round(total * 0.45);
        geo['أبوظبي'] = Math.round(total * 0.28);
        geo['الشارقة'] = Math.round(total * 0.15);
        geo['أخرى'] = total - geo['دبي'] - geo['أبوظبي'] - geo['الشارقة'];
        if (charts.geoChart) charts.geoChart.destroy();
        charts.geoChart = new Chart(document.getElementById('geoChart'), { type: 'pie', data: { labels: Object.keys(geo), datasets: [{ data: Object.values(geo), backgroundColor: ['#D4AF37','#0a2e25','#2b7a5c','#a0a0a0'] }] } });
        
        // آخر الزيارات
        const tbody = document.querySelector('#recentVisitsTable tbody');
        tbody.innerHTML = events.slice(0,20).map(ev => `<tr><td>${ev.page || '-'}</td><td>${ev.referrer || 'مباشر'}</td><td>${ev.device || '-'}</td><td>${new Date(ev.created_at).toLocaleString()}</td></tr>`).join('');
    }
    
    // طلبات التسجيل (مع وسوم)
    async function loadRegistrations() {
        const status = document.getElementById('regStatusFilter').value;
        let query = supabase.from('project_registrations').select('*').order('created_at', { ascending: false });
        if (status !== 'all') query = query.eq('status', status);
        const { data } = await query;
        if (!data) return;
        let html = `<table class="data-table"><thead><tr><th>#</th><th>اسم المشروع</th><th>الإمارة</th><th>واتساب</th><th>الحالة</th><th>تاريخ التسجيل</th><th>إجراءات</th></tr></thead><tbody>`;
        data.forEach(reg => {
            let statusClass = reg.status === 'pending' ? 'badge-pending' : (reg.status === 'approved' ? 'badge-approved' : 'badge-rejected');
            let statusText = reg.status === 'pending' ? 'معلق' : (reg.status === 'approved' ? 'موافق' : 'مرفوض');
            html += `<tr>
                <td>${reg.id}</td>
                <td>${escapeHtml(reg.project_name)}</td>
                <td>${reg.emirate}</td>
                <td>${reg.whatsapp}</td>
                <td><span class="badge ${statusClass}">${statusText}</span></td>
                <td>${new Date(reg.created_at).toLocaleString()}</td>
                <td class="action-buttons">
                    <button class="action-btn edit" onclick="window.updateRegStatus(${reg.id}, 'approved')"><i class="fas fa-check-circle"></i></button>
                    <button class="action-btn delete" onclick="window.updateRegStatus(${reg.id}, 'rejected')"><i class="fas fa-times-circle"></i></button>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('registrationsTableContainer').innerHTML = html;
    }
    window.updateRegStatus = async (id, newStatus) => {
        await supabase.from('project_registrations').update({ status: newStatus }).eq('id', id);
        showToast(`تم ${newStatus === 'approved' ? 'قبول' : 'رفض'} الطلب`);
        loadRegistrations(); loadStats();
    };
    
    // المشاريع مع pagination وصور مصغرة
    async function loadProjects(page = 1) {
        currentProjectsPage = page;
        let query = supabase.from('projects').select('*', { count: 'exact' }).order('id', { ascending: false }).range((page-1)*10, page*10-1);
        const search = document.getElementById('projectSearch').value;
        if (search) query = query.or(`name_ar.ilike.%${search}%,name_en.ilike.%${search}%`);
        const emirate = document.getElementById('projectEmirateFilter').value;
        if (emirate) query = query.eq('emirate', emirate);
        const statusF = document.getElementById('projectStatusFilter').value;
        if (statusF) query = query.eq('status', statusF);
        const { data, error, count } = await query;
        projectsTotal = count || 0;
        if (error) { showToast(error.message, true); return; }
        let html = `<table class="data-table"><thead><tr><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>الإمارة</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
        (data || []).forEach(p => {
            let statusBadge = p.status === 'approved' ? 'badge-approved' : (p.status === 'rejected' ? 'badge-rejected' : 'badge-pending');
            html += `<tr>
                <td>${p.id}</td>
                <td>${p.image ? `<img src="${p.image}" class="thumb-preview" onclick="window.open('${p.image}')">` : '-'}</td>
                <td>${escapeHtml(p.name_ar)}</td>
                <td>${p.emirate}</td>
                <td><span class="badge ${statusBadge}">${p.status === 'approved' ? 'موافق' : (p.status === 'rejected' ? 'مرفوض' : 'معلق')}</span></td>
                <td class="action-buttons">
                    <button class="action-btn edit" onclick="window.editProject(${p.id})"><i class="fas fa-edit"></i></button>
                    <button class="action-btn delete" onclick="window.deleteItem('projects',${p.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('projectsTableContainer').innerHTML = html;
        // pagination controls
        let totalPages = Math.ceil(projectsTotal / 10);
        let paginationHtml = '<div class="pagination">';
        for (let i = 1; i <= totalPages; i++) {
            paginationHtml += `<button onclick="window.loadProjects(${i})" ${i === page ? 'style="background:#0a2e25;color:#fff;"' : ''}>${i}</button>`;
        }
        paginationHtml += '</div>';
        document.getElementById('projectsPagination').innerHTML = totalPages > 1 ? paginationHtml : '';
    }
    window.loadProjects = loadProjects;
    
    // حذف عام
    window.deleteItem = async (table, id) => {
        if (confirm('هل أنت متأكد من الحذف؟')) {
            const { error } = await supabase.from(table).delete().eq('id', id);
            if (error) showToast(error.message, true);
            else { showToast('تم الحذف بنجاح'); if (table === 'projects') loadProjects(); else if (table === 'products') loadProducts(); else if (table === 'deals') loadDeals(); loadStats(); }
        }
    };
    
    window.editProject = async (id) => {
        const { data } = await supabase.from('projects').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('projectId').value = data.id;
            document.getElementById('projectNameAr').value = data.name_ar;
            document.getElementById('projectNameEn').value = data.name_en;
            document.getElementById('projectEmirate').value = data.emirate;
            document.getElementById('projectImage').value = data.image || '';
            document.getElementById('projectLicense').checked = data.adra_license || false;
            document.getElementById('projectStatus').value = data.status;
            document.getElementById('projectModal').classList.add('active');
        }
    };
    
    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('projectId').value;
        const payload = {
            name_ar: document.getElementById('projectNameAr').value,
            name_en: document.getElementById('projectNameEn').value,
            emirate: document.getElementById('projectEmirate').value,
            image: document.getElementById('projectImage').value,
            adra_license: document.getElementById('projectLicense').checked,
            status: document.getElementById('projectStatus').value
            price_ar: document.getElementById('productPriceAr').value,
            price_en: document.getElementById('productPriceEn').value
        };
        let error;
        if (id) error = (await supabase.from('projects').update(payload).eq('id', id)).error;
        else error = (await supabase.from('projects').insert(payload)).error;
        if (error) showToast(error.message, true);
        else { showToast('تم الحفظ'); document.getElementById('projectModal').classList.remove('active'); loadProjects(); loadStats(); }
    });
    
    // المنتجات
    async function loadProducts() {
        const projectId = document.getElementById('productProjectFilter').value;
        if (!projectId) { document.getElementById('productsTableContainer').innerHTML = '<p style="padding:20px;">✏️ اختر مشروعاً أولاً من القائمة</p>'; return; }
        const { data } = await supabase.from('products').select('*').eq('project_id', projectId);
        let html = `<table class="data-table"><thead><tr><th>ID</th><th>الصورة</th><th>الاسم (عربي)</th><th>الإجراءات</th></tr></thead><tbody>`;
        (data || []).forEach(p => {
            html += `<tr><td>${p.id}</td><td>${p.main_image ? `<img src="${p.main_image}" class="thumb-preview">` : '-'}</td><td>${escapeHtml(p.name_ar)}</td><td class="action-buttons"><button class="action-btn edit" onclick="window.editProduct('${p.id}')"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="window.deleteItem('products','${p.id}')"><i class="fas fa-trash"></i></button></td></tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('productsTableContainer').innerHTML = html;
    }
    window.editProduct = async (id) => {
        const { data } = await supabase.from('products').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('productId').value = data.id;
            document.getElementById('productProjectId').value = data.project_id;
            document.getElementById('productNameAr').value = data.name_ar;
            document.getElementById('productNameEn').value = data.name_en;
            document.getElementById('productMainImage').value = data.main_image || '';
            document.getElementById('productImages').value = (data.images || []).join(',');
            document.getElementById('productDetailsAr').value = (data.details_ar || []).join('\n');
            document.getElementById('productModal').classList.add('active');
            document.getElementById('productPriceAr').value = data.price_ar || '';
            document.getElementById('productPriceEn').value = data.price_en || '';
        }
    };
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('productId').value;
        const projectId = document.getElementById('productProjectId').value;
        const imagesArr = document.getElementById('productImages').value.split(',').map(s=>s.trim()).filter(Boolean);
        const detailsArr = document.getElementById('productDetailsAr').value.split('\n').filter(l=>l.trim());
        const payload = { name_ar: document.getElementById('productNameAr').value, name_en: document.getElementById('productNameEn').value, main_image: document.getElementById('productMainImage').value, images: imagesArr, details_ar: detailsArr, project_id: projectId };
        let error;
        if (id) error = (await supabase.from('products').update(payload).eq('id', id)).error;
        else error = (await supabase.from('products').insert(payload)).error;
        if (error) showToast(error.message, true);
        else { showToast('تم حفظ المنتج'); document.getElementById('productModal').classList.remove('active'); loadProducts(); loadStats(); }
    });
    
    // العروض
    async function loadDeals() {
        const projectId = document.getElementById('dealProjectFilter').value;
        if (!projectId) { document.getElementById('dealsTableContainer').innerHTML = '<p>اختر مشروعاً لعرض عروضه</p>'; return; }

        (data || []).forEach(d => {
            html += `<tr><td>${d.id}</td><td>${d.image ? `<img src="${d.image}" class="thumb-preview">` : '-'}</td><td>${escapeHtml(d.title_ar)}</td><td class="action-buttons"><button class="action-btn edit" onclick="window.editDeal('${d.id}')"><i class="fas fa-edit"></i></button><button class="action-btn delete" onclick="window.deleteItem('deals','${d.id}')"><i class="fas fa-trash"></i></button></td></tr>`;

        if (id) error = (await supabase.from('deals').update(payload).eq('id', id)).error;

        if (error) showToast(error.message, true);
        else { showToast('تم حفظ العرض'); document.getElementById('dealModal').classList.remove('active'); loadDeals(); loadStats(); }
    });
    
    // جهات التواصل
    async function loadContacts() {
        const projectId = document.getElementById('contactProjectFilter').value;
        if (!projectId) { document.getElementById('contactsTableContainer').innerHTML = '<p>اختر مشروعاً لعرض بيانات التواصل</p>'; return; }
        let { data } = await supabase.from('contacts').select('*').eq('project_id', projectId);
        if (!data || data.length === 0) data = [{ project_id: projectId, whatsapp: '', phone: '', email: '', instagram: '' }];
        const contact = data[0];
        let html = `<div style="display:grid; gap:16px;"><div class="form-row"><label>واتساب</label><input id="editWhatsapp" value="${contact.whatsapp || ''}"></div>

        <button id="saveContactBtn" class="btn-save">حفظ التغييرات</button></div>`;
        document.getElementById('contactsTableContainer').innerHTML = html;
        document.getElementById('saveContactBtn').onclick = async () => {
            await supabase.from('contacts').upsert({ project_id: parseInt(projectId), whatsapp: document.getElementById('editWhatsapp').value, phone: document.getElementById('editPhone').value, email: document.getElementById('editEmail').value, instagram: document.getElementById('editInstagram').value });
            showToast('تم حفظ بيانات التواصل');
        };
    }
    
    // الشكاوى
    async function loadFeedbacks() {
        const status = document.getElementById('feedbackStatusFilter').value;
        let query = supabase.from('feedbacks').select('*').order('created_at', { ascending: false });
        if (status) query = query.eq('status', status);
        const { data } = await query;
        if (!data) return;
        let html = `<table class="data-table"><thead><tr><th>ID</th><th>النوع</th><th>الرسالة</th><th>البريد</th><th>الحالة</th><th>التاريخ</th><th>تغيير الحالة</th></tr></thead><tbody>`;
        data.forEach(f => {
            let badgeClass = f.status === 'pending' ? 'badge-pending' : (f.status === 'resolved' ? 'badge-resolved' : 'badge-reviewed');
            html += `<tr><td>${f.id}</td><td>${f.type}</td><td>${escapeHtml(f.message)}</td><td>${f.reporter_email || '-'}</td><td><span class="badge ${badgeClass}">${f.status}</span></td><td>${new Date(f.created_at).toLocaleString()}</td><td><select onchange="window.updateFeedbackStatus(${f.id}, this.value)" style="padding:6px 12px; border-radius:30px;"><option ${f.status==='pending'?'selected':''} value="pending">معلق</option><option ${f.status==='reviewed'?'selected':''} value="reviewed">مراجَع</option><option ${f.status==='resolved'?'selected':''} value="resolved">محلول</option><option ${f.status==='rejected'?'selected':''} value="rejected">مرفوض</option></select></td></tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById('feedbacksTableContainer').innerHTML = html;
    }
    window.updateFeedbackStatus = async (id, newStatus) => {
        await supabase.from('feedbacks').update({ status: newStatus }).eq('id', id);
        showToast('تم تحديث حالة الشكوى');
        loadFeedbacks();
    };
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    
    async function initEmirateFilter() {
        const { data } = await supabase.from('projects').select('emirate');
        const unique = [...new Set((data||[]).map(p=>p.emirate).filter(Boolean))];
        const select = document.getElementById('projectEmirateFilter');
        unique.forEach(e => { let opt = document.createElement('option'); opt.value = e; opt.textContent = e; select.appendChild(opt); });
    }
    async function initProjectSelects() {
        const { data } = await supabase.from('projects').select('id, name_ar');
        if (!data) return;
        const fillSelect = (id) => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">اختر المشروع</option>';
            data.forEach(p => { let opt = document.createElement('option'); opt.value = p.id; opt.textContent = p.name_ar; sel.appendChild(opt); });
        };
        fillSelect('productProjectFilter');
        fillSelect('dealProjectFilter');
        fillSelect('contactProjectFilter');
    }
    
    // أحداث الأزرار
    document.getElementById('refreshProjectsBtn').onclick = () => loadProjects(1);
    document.getElementById('refreshProductsBtn').onclick = loadProducts;
    document.getElementById('refreshDealsBtn').onclick = loadDeals;
    document.getElementById('refreshContactsBtn').onclick = loadContacts;
    document.getElementById('refreshFeedbacksBtn').onclick = loadFeedbacks;
    document.getElementById('refreshRegistrationsBtn').onclick = loadRegistrations;
    document.getElementById('addProjectBtn').onclick = () => { document.getElementById('projectForm').reset(); document.getElementById('projectId').value = ''; document.getElementById('projectModal').classList.add('active'); };
    document.getElementById('addProductBtn').onclick = () => { let pid = document.getElementById('productProjectFilter').value; if(!pid){ showToast('اختر مشروعاً أولاً', true); return; } document.getElementById('productForm').reset(); document.getElementById('productId').value = ''; document.getElementById('productProjectId').value = pid; document.getElementById('productModal').classList.add('active'); };
    document.getElementById('addDealBtn').onclick = () => { let pid = document.getElementById('dealProjectFilter').value; if(!pid){ showToast('اختر مشروعاً', true); return; } document.getElementById('dealForm').reset(); document.getElementById('dealId').value = ''; document.getElementById('dealProjectId').value = pid; document.getElementById('dealModal').classList.add('active'); };
    document.getElementById('exportAnalyticsBtn').onclick = () => { showToast('سيتم تصدير تحليلات الزيارات قريباً'); };
    document.getElementById('refreshAnalyticsBtn').onclick = loadAnalytics;
    document.getElementById('analyticsPeriod').onchange = loadAnalytics;
    document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', () => { document.getElementById(btn.dataset.modal).classList.remove('active'); }));
    window.onclick = (e) => { if(e.target.classList.contains('modal')) e.target.classList.remove('active'); };
    
    // تبديل التبويبات
    function attachTabs() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.content-card').forEach(c=>c.classList.remove('active'));
                document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
                if (btn.dataset.tab === 'projects') loadProjects(1);
                else if (btn.dataset.tab === 'products') loadProducts();
                else if (btn.dataset.tab === 'deals') loadDeals();
                else if (btn.dataset.tab === 'contacts') loadContacts();
                else if (btn.dataset.tab === 'feedbacks') loadFeedbacks();
                else if (btn.dataset.tab === 'dashboard') loadAnalytics();
                else if (btn.dataset.tab === 'registrations') loadRegistrations();
            });
        });
    }
    
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user.email === ALLOWED_EMAIL) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            await initEmirateFilter();
            await initProjectSelects();
            await loadStats();
            await loadProjects(1);
            await loadAnalytics();
            await loadRegistrations();
            await loadProducts();
            await loadDeals();
            await loadContacts();
            await loadFeedbacks();
            attachTabs();
        }
    }
    
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('adminEmail').value;
        const pwd = document.getElementById('adminPassword').value;
        const { error, data } = await supabase.auth.signInWithPassword({ email, password: pwd });
        if (error || data.user.email !== ALLOWED_EMAIL) {
            document.getElementById('loginError').innerText = 'بيانات الدخول غير صحيحة';
        } else {
            checkSession();
        }
    };
    document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); location.reload(); };
    checkSession();
</script>
