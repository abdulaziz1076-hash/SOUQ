<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register your Project - Souq Almasharie</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F8F5F0;
            font-family: 'Poppins', sans-serif;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 35px 30px;
            box-shadow: 0 20px 35px rgba(15, 61, 46, 0.1);
            border: 1px solid #E8E4DD;
        }
        h1 {
            color: #0F3D2E;
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #8A8A8A;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 700;
            color: #0F3D2E;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E8E4DD;
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
            background: #FEFEFE;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #D4AF37;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 20px 0 15px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            flex-shrink: 0;
        }
        .checkbox-group label {
            font-weight: normal;
            font-size: 13px;
            color: #1A1A1A;
            line-height: 1.5;
        }
        .checkbox-group a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 700;
        }
        .checkbox-group a:hover {
            text-decoration: underline;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #0F3D2E, #1A5F44);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #D4AF37;
            margin-top: 10px;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .note {
            font-size: 11px;
            color: #8A8A8A;
            text-align: center;
            margin-top: 20px;
        }
        .error {
            color: #C41E3A;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .success {
            background: #D4EDDA;
            color: #155724;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 10px 0;
        }
        .loading i {
            font-size: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            color: #0F3D2E;
            border: 2px solid #0F3D2E;
            padding: 12px 25px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            width: auto;
            margin-top: 15px;
        }
        .back-button:hover {
            background: #0F3D2E;
            color: white;
            transform: translateY(-2px);
        }
        .back-button i {
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .lang-switch {
            text-align: right;
            margin-bottom: 25px;
        }
        
        .lang-switch a {
            color: #D4AF37;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            background: rgba(212, 175, 55, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #D4AF37;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .lang-switch a:hover {
            background: #D4AF37;
            color: #0F3D2E;
            transform: translateY(-2px);
        }
        
        @media (max-width: 550px) {
            .container { padding: 25px 20px; }
            h1 { font-size: 24px; }
            .button-group {
                flex-direction: column;
            }
            .back-button {
                width: 100%;
                justify-content: center;
            }
            .lang-switch {
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="lang-switch">
        <a href="register.html"><i class="fas fa-language"></i> العربية</a>
    </div>
    
    <h1>📋 Register Your Project</h1>
    <div class="sub">Limited time offer - Only a few spots available</div>

    <div class="success" id="successMsg">✅ Your request has been received! We will contact you within 24 hours.</div>
    <div class="loading" id="loadingMsg"><i class="fas fa-spinner"></i> Sending request...</div>

    <form id="registerForm">
        <div class="form-group">
            <label><i class="fas fa-store"></i> Project Name *</label>
            <input type="text" id="projectName" required placeholder="Example: Ahmed's Sweets">
        </div>

        <div class="form-group">
            <label><i class="fas fa-map-marker-alt"></i> Emirate *</label>
            <select id="emirate" required>
                <option value="">Select Emirate</option>
                <option>Abu Dhabi</option>
                <option>Dubai</option>
                <option>Sharjah</option>
                <option>Ajman</option>
                <option>Ras Al Khaimah</option>
                <option>Fujairah</option>
                <option>Umm Al Quwain</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fab fa-whatsapp"></i> WhatsApp Number (for publishing) *</label>
            <input type="tel" id="whatsapp" required placeholder="Example: 971501234567">
            <div class="error" id="whatsappError">Please enter a valid number (9-15 digits)</div>
        </div>

        <div class="form-group">
            <label><i class="fab fa-instagram"></i> Instagram Account (optional)</label>
            <input type="text" id="instagram" placeholder="@account">
        </div>

        <div class="form-group">
            <label><i class="fas fa-tags"></i> Project Category *</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option>Food & Beverages</option>
                <option>Sweets</option>
                <option>Scents & Perfumes</option>
                <option>Care</option>
                <option>Gifts</option>
                <option>Clothing</option>
                <option>Handmade</option>
                <option>Entertainment</option>
                <option>Arts</option>
                <option>Plants</option>
            </select>
        </div>
        
        <div class="form-group">
            <label><i class="fas fa-align-right"></i> Project Description (optional)</label>
            <textarea id="description" rows="3" placeholder="Write a brief description of your project..."></textarea>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="consentCheckbox" required>
            <label for="consentCheckbox">
                ✅ I agree to the <a href="consent-publishEn.html" target="_blank">Publishing Terms</a>, <a href="privacyEn.html" target="_blank">Privacy Policy</a>, and <a href="termsEn.html" target="_blank">Terms of Use</a><br>
                (I confirm that I have the right to publish this data and images, and I accept full responsibility)
            </label>
        </div>

        <button type="submit" id="submitBtn">Submit Registration <i class="fas fa-paper-plane"></i></button>
        <div class="note">* Nothing will be published before review and confirmation</div>
    </form>
    
    <div class="button-group">
        <a href="index.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
</div>

<script>
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xvzvbgne';

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const whatsapp = document.getElementById('whatsapp').value;
        const whatsappRegex = /^[0-9]{9,15}$/;
        if (!whatsappRegex.test(whatsapp.replace(/[^0-9]/g, ''))) {
            document.getElementById('whatsappError').style.display = 'block';
            return;
        }
        document.getElementById('whatsappError').style.display = 'none';
        
        const consent = document.getElementById('consentCheckbox').checked;
        if (!consent) {
            alert('Please agree to the terms before submitting.');
            return;
        }
        
        const formData = {
            projectName: document.getElementById('projectName').value,
            emirate: document.getElementById('emirate').value,
            whatsapp: document.getElementById('whatsapp').value,
            instagram: document.getElementById('instagram').value || 'Not provided',
            category: document.getElementById('category').value,
            description: document.getElementById('description').value || 'No description',
            consent: 'Yes',
            date: new Date().toISOString(),
            ip: await getClientIP()
        };
        
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('loadingMsg').style.display = 'block';
        
        let registrations = JSON.parse(localStorage.getItem('projectRegistrations') || '[]');
        registrations.push(formData);
        localStorage.setItem('projectRegistrations', JSON.stringify(registrations));
        
        try {
            const response = await fetch(FORMSPREE_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(formData)
            });
            
            if (response.ok) {
                setTimeout(() => {
                    window.location.href = 'thankyou.html';
                }, 1000);
            } else {
                document.getElementById('loadingMsg').style.display = 'none';
                alert('There was an error sending your request. Your data has been saved locally and we will contact you soon.');
                setTimeout(() => {
                    window.location.href = 'thankyou.html';
                }, 1500);
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('loadingMsg').style.display = 'none';
            alert('Network error. Your request has been saved and we will contact you soon.');
            setTimeout(() => {
                window.location.href = 'thankyou.html';
            }, 1500);
        }
    });
    
    async function getClientIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (error) {
            return 'Not available';
        }
    }
</script>
</body>
</html>
