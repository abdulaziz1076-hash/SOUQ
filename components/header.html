<header class="app-header">
    <div class="header-container">
        <div class="logo-section" onclick="window.scrollToTop ? window.scrollToTop() : window.scrollTo({top:0})">
            <div class="logo-icon">
                <img src="images/logo.png" alt="سوق المشاريع" loading="lazy">
            </div>
            <div class="logo-text">
                <h1 id="siteTitle">سوق المشاريع</h1>
                <p id="siteSubtitle">المشاريع في الامارات</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="lang-toggle" id="langToggleBtn">
                <i class="fas fa-globe"></i>
                <span id="langBtn">English</span>
            </div>
            <div class="cart-icon" onclick="window.location.href='cart.html'">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" class="cart-badge">0</span>
            </div>
            <div class="menu-toggle" id="menuToggleBtn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </div>

    <div class="nav-menu" id="navMenu">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i>
            <span id="navHome">الرئيسية</span>
        </div>
        <div class="nav-item" onclick="window.location.hash='/projects/emirate/all'; window.location.reload();">
            <i class="fas fa-store"></i>
            <span id="navMarket">السوق</span>
        </div>
        <div class="nav-item" onclick="window.location.hash='/favorites'; window.location.reload();">
            <i class="fas fa-heart"></i>
            <span id="navFavorites">المفضلة</span>
        </div>
        <div class="nav-item" onclick="window.location.href='cart.html'">
            <i class="fas fa-shopping-cart"></i>
            <span id="navCart">السلة</span>
        </div>
        <div class="nav-item" onclick="window.location.href='services.html'">
            <i class="fas fa-cogs"></i>
            <span id="navServices">الخدمات العامة</span>
        </div>
        <div class="nav-item" onclick="window.location.href='registerr.html'">
            <i class="fas fa-user-plus"></i>
            <span id="navRegister">سجل مشروعك</span>
        </div>
    </div>
</header>
