<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سوق المشاريع | المنصة الاحترافية للأسر المنتجة</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ستايل احترافي مخصص للقسم الرئيسي */
        .hero-banner {
            position: relative;
            padding: 80px 20px;
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            border-radius: 0 0 40px 40px;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -10%;
            width: 120%;
            height: 100%;
            background: rgba(212, 175, 55, 0.1); /* لون السكندري بلمسة خفيفة */
            transform: rotate(-5deg);
            z-index: 1;
        }

        .hero-content { position: relative; z-index: 2; }

        .hero-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 15px; }

        /* الأزرار الاحترافية */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 30px auto 0;
        }

        .btn-main {
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-primary-action { background: var(--secondary); color: var(--primary-dark); }
        .btn-secondary-action { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); }

        .btn-main:active { transform: scale(0.95); }

        /* قسم الإحصائيات */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            margin: -30px 20px 0;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 5;
        }

        .stat-item { text-align: center; }
        .stat-val { display: block; font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); }
        .stat-lbl { font-size: 0.8rem; color: var(--gray); }

        /* قسم التشجيع */
        .invite-card {
            margin: 40px 20px;
            padding: 30px;
            background: var(--light);
            border: 2px dashed var(--secondary);
            border-radius: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="logo-section" onclick="location.href='index.html'">
                <div class="logo-text">
                    <h1 style="font-size: 1.2rem;">سوق المشاريع</h1>
                </div>
            </div>
            <div class="header-actions">
                <a href="project-login.html" class="cart-icon" style="text-decoration:none; width: auto; padding: 0 15px;">
                    <i class="fas fa-user-lock"></i>
                    <span style="font-size: 12px; margin-right: 5px;">دخول التجار</span>
                </a>
                <div class="menu-toggle" onclick="document.getElementById('navMenu').classList.toggle('active')">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <div id="mainContent">
        <section class="hero-banner">
            <div class="hero-content">
                <h2 class="hero-title">منصتك لدعم <br><span style="color: var(--secondary)">الأسر المنتجة</span></h2>
                <p>تصفح أرقى المنتجات المحلية المصنوعة بكل حب</p>
                
                <div class="action-grid">
                    <button class="btn-main btn-primary-action" onclick="appState.currentPage='families'; renderFamilies();">
                        <i class="fas fa-shopping-bag fa-lg"></i>
                        دخول السوق
                    </button>
                    <button class="btn-main btn-secondary-action" onclick="appState.currentPage='offers'; renderOffers();">
                        <i class="fas fa-tag fa-lg"></i>
                        عروض اليوم
                    </button>
                </div>
            </div>
        </section>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-val" id="count-projects">--</span>
                <span class="stat-lbl">مشروع</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="count-products">--</span>
                <span class="stat-lbl">منتج</span>
            </div>
            <div class="stat-item">
                <span class="stat-val" id="count-emirates">7</span>
                <span class="stat-lbl">إمارات</span>
            </div>
        </div>

        <div class="invite-card">
            <h3>لديك مشروع منزلي؟</h3>
            <p style="margin: 10px 0 20px; color: var(--gray);">انضم لأسرتنا وابدأ ببيع منتجاتك الآن</p>
            <a href="project-login.html" class="market-big-btn" style="text-decoration: none;">انضم إلينا الآن</a>
        </div>
    </div>

    <footer style="padding: 40px 20px; text-align: center; background: #fff;">
        <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;">
            <a href="#" style="color: var(--primary-dark); font-size: 24px;"><i class="fab fa-instagram"></i></a>
            <a href="#" style="color: var(--primary-dark); font-size: 24px;"><i class="fab fa-whatsapp"></i></a>
            <a href="#" style="color: var(--primary-dark); font-size: 24px;"><i class="fab fa-tiktok"></i></a>
        </div>
        <p style="color: var(--gray); font-size: 12px;">جميع الحقوق محفوظة © سوق المشاريع 2026</p>
    </footer>

    <script type="module">
        import { projectsData } from './js/main.js';

        // وظيفة تحديث الإحصائيات عند تشغيل الصفحة
        function updateStats() {
            // محاولة جلب البيانات من مصفوفة المشاريع الموجودة في main.js
            const projects = window.projectsData || [];
            if (projects.length > 0) {
                document.getElementById('count-projects').innerText = projects.length;
                let productCount = 0;
                projects.forEach(p => productCount += (p.products ? p.products.length : 0));
                document.getElementById('count-products').innerText = productCount;
            } else {
                // أرقام تجريبية في حال لم تكتمل عملية الـ Fetch بعد
                document.getElementById('count-projects').innerText = "120+";
                document.getElementById('count-products').innerText = "850+";
            }
        }
        
        // تنفيذ التحديث بعد ثانية لضمان جلب البيانات
        setTimeout(updateStats, 1500);
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
